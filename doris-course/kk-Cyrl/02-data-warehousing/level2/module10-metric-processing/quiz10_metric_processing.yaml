title: '10-модуль тесті: метрикаларды өңдеу және ұсыну'
description: Бір дұрыс жауабы бар алты сұрақ; дерекқорға қосылу қажет емес. Жібергеннен
  кейін түсіндірмелерді қараңыз.
questions:
- id: metric_contract
  type: single_choice
  objective: SQL жазбас бұрын метриканың жиынын, түйіршіктілігін, көрсеткіштерін,
    уақыт және қатынас ережесін анықтау.
  prompt: 'Екі бақылау тақтасы 1 қаңтардың орташа тапсырыс құнын көрсетеді: бірі 132.00,
    екіншісі 133.33. Екі сұраудың SQL-і де дұрыс. Айырманы не шешеді?'
  options:
  - id: write_contract
    text: Орташа — аймақ орташаларының орташасы емес, күн сомасының тапсырыс санына
      қатынасы дейтін келісімшарт
  - id: same_table
    text: Бірдей сақталған жолдарды оқу үшін екі сұрауды бір ұсыну кестесінде орындау
  - id: round_both
    text: Айырма ондық арифметикадан болғандықтан, екеуін бүтін санға дөңгелектеу
  - id: take_higher
    text: Орташалардың орташасы үлкен аймақтарды кем санайтындықтан, екеуінің жоғарысын
      алу
  answer: write_contract
  explanation: 'Айырма — қате емес, анықтама: EAST 144.00 және WEST 120.00 орташаларын
    орташалау 132.00, ал 9 тапсырысқа 1200.00 бөлу 133.33 береді. Жиынды, түйіршіктілікті,
    көрсеткіштерді және қатынас ережесін айтатын келісімшарт бақылау тақтасы не көрсететінін
    шешеді. Сол сақталған жолдарды екі тәсілмен де орташалауға болады. Дөңгелектеу
    айырманы шешпей, жасырады. Бір мән әрқашан жоғары емес: мұнда үлкен EAST тобының
    орташасы жоғары болғандықтан, орташалардың орташасы төмен.'
- id: rebuild_service
  type: single_choice
  objective: Жарияланған түйіршіктілікте ұсыну кестесін жасап, бір пакетті екі рет
    жүктеудің орнына қайта құру.
  prompt: Тапсырма әр күн қорытындысын SUM бағандары бар Aggregate Key ұсыну кестесіне
    енгізеді. Қайталаудан кейін 1 қаңтар EAST 5 тапсырыс пен 720.00 орнына 10 және
    1440.00 көрсетеді. Тапсырма не істеуі керек?
  options:
  - id: rebuild
    text: 'Әсер еткен жолдарды егжей-тегжейлі деректерден қайта құру не әр пакетті
      бір рет жүктеу: SUM әр жолды қосады'
  - id: keep_inserting
    text: Енгізе беру, себебі Aggregate Key бір кілтті қайталайтын жолдарды алып тастайды
  - id: store_average
    text: Сол пакетті екінші жүктеу өзгертпейтіндіктен, орнына орташа тапсырыс сомасын
      сақтау
  - id: divide_by_retries
    text: Сақталған мәндерді қайталау санына бөлу, бұл дұрыс қорытындыны қайтарады
  answer: rebuild
  explanation: Aggregate Key кестесі бірдей кілтті жолдарды қосады, сондықтан қайталанған
    пакет қосындыларды екі еселейді; кесте қайталауды жаңа тапсырыстан ажырата алмайды,
    оны тапсырма егжей-тегжейлі деректерден қайта құру не жүктеген пакеттерін тіркеу
    арқылы шешуі керек. Aggregate Key қайталануды тастамайды; Unique Key оларды ауыстырар
    еді. Сақталған орташаны басқа түйіршіктіліктерге қосуға болмайды. Бөлу әр жол
    бірдей рет қайталанды деп болжайды.
- id: full_outer_reconcile
  type: single_choice
  objective: Толық сыртқы біріктіру арқылы ұсыну кестесін егжей-тегжейлі деректермен
    салыстыру.
  prompt: Салыстыру егжей-тегжейлі қорытындыларды ұсыну кестесімен күн мен аймақ бойынша
    INNER JOIN арқылы біріктіреді, әр жол сәйкес. Ұсыну кестесінің 2 қаңтар жүктеуі
    сәтсіз болған. Салыстыру не көрсетеді?
  options:
  - id: misses_day
    text: '2 қаңтар туралы ештеңе: ішкі біріктіру тек екі жақта да бар күндерді сақтайды'
  - id: shows_zero
    text: Ұсыну кестесінде 0 тапсырысы бар 2 қаңтар, бұл сәтсіз жүктеуді көрсетеді
  - id: raises_error
    text: Қате, себебі бір жақта кілт жолы жоқ болса, ішкі біріктіру сәтсіз болады
  - id: shows_null
    text: Біріктірудің ұсыну жағында NULL бар 2 қаңтар, бұл жүктеу сәтсіздігін көрсетеді
  answer: misses_day
  explanation: Ішкі біріктіру тек екі жақта бар жолдарды қайтарады, сондықтан жоғалған
    күн салыстырудан кетіп, салыстыру өтеді; толық сыртқы біріктіру оны ұсыну жағында
    NULL қалдырып сақтайды. Еш біріктіру нөл ойлап таппайды. Сәйкестіктің жоқтығы
    қате емес. NULL жолын ішкі емес, толық сыртқы біріктіру көрсетеді.
- id: window_grain
  type: single_choice
  objective: Нәтиже түйіршіктілігін өзгертпей, терезе функциялары мен шартты агрегаттауды
    қолдану.
  prompt: Есепке күн сомасы және сол күнге дейінгі сомасы бар әр күнге бір жол қажет.
    Қай сұрау береді?
  options:
  - id: cte_then_window
    text: Ұсыну жолдарын күн бойынша топтайтын CTE, содан кейін оның үстіндегі жинақтаушы
      SUM(amount) OVER (ORDER BY order_date)
  - id: window_on_regions
    text: Күндер ретінде көрсетілген аймақтық ұсыну жолдарының үстіндегі сол терезе
  - id: sum_of_window
    text: Тереземен әр тапсырыста қайталанған күн қорытындысы, содан кейін сол терезе
      бағанын әр күнге қосу
  - id: lag_only
    text: Барлық бұрынғы күндердің жалпы сомасын қайтаратын LAG(amount) OVER (ORDER
      BY order_date)
  answer: cte_then_window
  explanation: CTE әр күнге бір жол түйіршіктілігін жасайды, терезе оны өзгертпей
    бірінші күннен ағымдағысына дейін қосады. Аймақ жолдарындағы терезе әр күнге емес,
    әр аймақ пен күнге бір жол сақтайды. Әр тапсырыста қайталанған күндік қорытындыны
    қосу күнді әр тапсырысқа бір рет санайды. LAG жинақталған қосындыны емес, тек
    алдыңғы жол мәнін қайтарады.
- id: paid_gmv
  type: single_choice
  objective: Төленген GMV, тапсырыс сомасы мен таза түсімді ажыратып, әр қатынастың
    алымы мен бөлімін сақтау.
  prompt: Мысалдың бас тартылғансыз тапсырыстары 800.00 тұрады. Терезедегі төлемдері
    660.00, төленген бір тапсырысқа терезеде 50.00 қайтарылған. Терезенің төленген
    GMV-і мен таза түсімі қандай?
  options:
  - id: paid_then_net
    text: Төлемдердің өзінен төленген GMV 660.00; қайтарымнан кейін таза түсім 610.00
  - id: order_amount
    text: Төленген GMV 800.00, себебі бас тартылмаған әр тапсырыс төленген деп саналады
  - id: refund_first
    text: Төленген GMV 610.00, себебі қайтарым төлемін GMV-ден алып тастайды
  - id: status_based
    text: Соңғы күйі PAID болатын, ақшасы қайтарылғансыз тапсырыстардың төленген GMV-і
  answer: paid_then_net
  explanation: 'Төленген GMV терезедегі қайталанулары жойылған төлемдерден алынады
    — 660.00; қайтарым бөлек факт, сондықтан таза түсім 660.00 минус 50.00, яғни 610.00.
    Тапсырыс сомасы ешқашан төленбегендерді де санайды. GMV-ден қайтарымды алу оны
    таза түсімге айналдырады. PARTIALLY_REFUNDED күйі төлем фактісін жоймайды: тапсырыс
    бір рет төленген.'
- id: distinct_and_proof
  type: single_choice
  objective: Нақты не жуық бөлек мәндер санын таңдап, оңтайландыруды тең нәтижелер
    және өлшенген жұмыспен тексеру.
  prompt: Қаржы бөлек төлем жасаған тұтынушыларды бірлікке дейін салыстырады, топ
    үлгіге дәл сәйкес болған HLL ұсынады. Бөлек жағдайда шағын ұсыну кестесі 7.2 ms
    орнына 3.7 ms жауап берді. Не істеу керек?
  options:
  - id: exact_and_prove
    text: Қаржы үшін нақты сан; кестені тең нәтижелер мен азырақ жұмысты көрсететін
      Profile-дардан кейін қабылдау
  - id: hll_matched
    text: Қаржы үшін HLL, себебі үлгідегі нақты сәйкестік қатесі нөл екенін көрсетеді
  - id: timing_enough
    text: Шағын кестені қазір қабылдау, себебі жылдам сұрауы азырақ жол оқығанын көрсетеді
  - id: bitmap_strings
    text: Кез келген бағанды нақты санайтын тұтынушы аттарының Bitmap-ы
  answer: exact_and_prove
  explanation: Бірлікке дейін салыстыруға COUNT(DISTINCT) не бүтін ID Bitmap-ы қажет;
    HLL бағалайды, бір сәйкестік қате шегі емес. Оңтайландыру бірдей жолдар қайтарғанда
    және Profile үнемдеген жұмысты көрсеткенде қабылданады; уақыттар соңында, өз жағдайларына
    тиесілі. Уақыттың өзі екеуін де көрсетпейді, аз оқу әрқашан жылдамырақ емес. Bitmap
    кез келген жолдық мәндерді емес, теріс емес бүтін ID-лерді алады.
passing_score_percent: 80
