title: '8-модуль тесті: көріністер және материалданған көріністер'
description: Бір дұрыс жауабы бар алты сұрақ; дерекқорға қосылу қажет емес. Жібергеннен
  кейін түсіндірмелерді қараңыз.
questions:
- id: view_or_stored_result
  type: single_choice
  objective: Кәдімгі көріністің сақталған сұрауын материалданған көріністің сақталған
    нәтижесінен ажырату.
  prompt: Үш топ күндік тапсырыстың бір анықтамасын қолдануы керек. Әр сұрау бір секунд
    бұрын бекітілген тапсырыстарды қамтуы тиіс, сұрау қазірдің өзінде жеткілікті жылдам.
    Нені ортақ қолдануы керек?
  options:
  - id: regular_view
    text: Әр жолы ағымдағы кестелерде сұрауын орындайтын анықтаманың кәдімгі көрінісі
  - id: manual_refresh_mv
    text: Әр бекітілген тапсырысты келген бойда алатын, қолмен жаңартылатын материалданған
      көрініс
  - id: nightly_copy
    text: Тапсырма әр түнде нәтижеден көшіретін, көшіретін тапсырыстарындай өзекті
      кесте
  - id: three_queries
    text: Сұраудың үш көшірмесі, себебі кәдімгі көрініс оқылмас бұрын жолдарын сақтауы
      керек
  answer: regular_view
  explanation: Кәдімгі көрініс нәтижесін емес, сұрауды сақтайды, сондықтан әр оқу
    оны ағымдағы кестелерде орындап, ең жаңа тапсырыстарды қамтиды, басқаратын жаңартуы
    жоқ. Қолмен жаңартылатын материалданған көрініс келесі жаңартуға дейін соңғы нәтижесін
    сақтайды. Түнгі көшірме соңғы орындауы сияқты ескі. Сұраудың үш көшірмесі бір-бірінен
    алшақтайды, кәдімгі көрініс жолдар сақтамайды.
- id: refresh_scope
  type: single_choice
  objective: Тұтынушыларға қажет өзектілік пен жаңарту шығынына қарай жаңарту триггері
    мен аясын таңдау.
  prompt: Материалданған көрініс тапсырыстарды күн мен аймақ бойынша топтайды. Ол
    факт кестесінің тапсырыс күнімен бөлімделген және бөлімделмеген тұтынушы кестесімен
    бірігеді. Жүктеу бір күнге тапсырыстар қосады, кейін тұтынушының аймағы түзетіледі.
    Әр өзгерістен кейін REFRESH ... AUTO нені қайта есептейді?
  options:
  - id: one_date_then_all
    text: Жүктеуден кейін сол күн бөлімі; түзетуден кейін әр бөлім
  - id: one_date_both
    text: Екі жағдайда да тек өзгерген күн, себебі AUTO әр өзгерген жолды сақталған
      қосындыларға қосады
  - id: all_both
    text: Екі жағдайда да әр бөлім, себебі AUTO әр жаңартуда бүкіл нәтижені қайта
      есептейді
  - id: nothing
    text: Екеуінде де ештеңе, себебі бөлімделген материалданған көрініс кестелеріне
      бірден ілеседі
  answer: one_date_then_all
  explanation: Doris материалданған көріністің әр бөлімін факт кестесінің бір күніне
    сәйкестендіреді, сондықтан бір күннің жаңа тапсырыстары сол бөлімді жаңартады;
    бөлімделмеген тұтынушы кестесі еш күнге сәйкес келмейді, сондықтан ондағы өзгеріс
    әр бөлімді ескіртеді. AUTO бөлімдерді жолдарынан қайта есептейді; ескі қосындыға
    жолдар қоспайды. Қай бөлім өзгергенін анықтай алмағанда ғана бәрін қайта есептейді.
    Асинхронды материалданған көрініс тек жаңартылғанда өзгереді.
- id: check_after_create
  type: single_choice
  objective: Сәтті CREATE-ке сенудің орнына материалданған көріністің күйі мен жолдарын
    тексеру.
  prompt: Бір сәт бұрын CREATE MATERIALIZED VIEW сәтті қайтты, әріптес сақталған күндік
    қорытындыларды қазір жариялағысы келеді. Нені әлі тексеру керек?
  options:
  - id: state_and_rows
    text: mv_infos RefreshState SUCCESS көрсететінін және жолдары негізгі кестелер
      қорытындыларына тең екенін
  - id: nothing_more
    text: 'Басқа ештеңе: сәтті CREATE алғашқы құру әр жолмен аяқталғанын білдіреді'
  - id: fast_query
    text: Оның сұрауы жылдам екенін, себебі жылдам жауап құрудың барлық жолды оқығанын
      көрсетеді
  - id: definition_text
    text: SHOW CREATE анықтаманы көрсететінін, себебі сақталған жолдар содан туындайды
  answer: state_and_rows
  explanation: 'Құру CREATE қайтқаннан кейін тапсырма ретінде орындалады: RefreshState
    оның сәттілігін айтады, ал сақталған жолдарды негізгі кестелердің сол қорытындыларымен
    салыстыру дұрыстығын көрсетеді. Сәтті CREATE тек анықтаманы қабылдады. Жылдамдық
    толықтық туралы ештеңе айтпайды. Анықтама не сақталғанын емес, не сақталуы керегін
    айтады.'
- id: explain_rewrite
  type: single_choice
  objective: EXPLAIN арқылы сұрау материалданған көріністі қолдану үшін қайта жазылды
    ма және неге жазылмағанын оқу.
  prompt: Материалданған көрініс orders_view_l2 күндік қорытындыларын сақтайды. Бақылау
    тақтасы көріністен WHERE order_date = '2026-01-01' арқылы бір күнді сұрайды. EXPLAIN
    негізгі кестелерді сканерлеп, материалданған көріністі Rewrite compensate predicate
    by view fail себебімен not usable деп тізеді. Бұл нені көрсетеді?
  options:
  - id: filter_not_applied
    text: Doris бұл сүзгіні сақталған жолдарға қолдана алмады, сондықтан бұл сұрауды
      қайта жазбады
  - id: rewrite_happened
    text: Сол қорытындылардың материалданған көрінісі бар болғандықтан, сұрау бәрібір
      қайта жазылды
  - id: view_broken
    text: Материалданған көрініс бұзылған, себебі дұрыс көрініс кестелерінің әр сұрауына
      жауап береді
  - id: wrong_answer
    text: Жауап қате, себебі материалданған көріністі айналып өтетін жоспар ескірген
      жолдар оқиды
  answer: filter_not_applied
  explanation: 'Сканерлеулер мен not usable жазбасы бұл сұраудың қайта жазылмағанын,
    себеп неліктен екенін айтады: Doris 4.1.3 DATE(event_time) = ''2026-01-01'' шартын
    сақталған жолдарда жоқ event_time бағанының ауқымына айналдырады. Материалданған
    көріністің бар болуы — қайта жазу емес. Ол тек өзі қызмет көрсете алатын түйіршіктілігі,
    бағандары және сүзгілері бар сұрауларға жауап береді. Негізгі кестелерді оқу ағымдағы
    жауапты баяуырақ береді; ол ескірген емес.'
- id: stable_contract
  type: single_choice
  objective: Жарияланған көріністің іске асуы өзгергенде атаулары мен мағыналарын
    тұрақты сақтау.
  prompt: Екі бақылау тақтасы әр күнге бір жолы және order_date, order_count, gross_amount
    бағандары бар көріністі оқиды. Материалданған көрініс енді сол түйіршіктілік пен
    мағыналарды сақтайды, жаңартуы олардың өзектілік ережесіне сай. Топ оларды қалай
    жылдамдатуы керек?
  options:
  - id: point_view_at_mv
    text: Көріністің материалданған көріністен оқуын қамтамасыз ету, бағандарын сақтау
      және алдымен екі жауапты салыстыру
  - id: expose_mv
    text: Бақылау тақталарына материалданған көрініс атауы мен бағандарын беру, себебі
      кәдімгі көрініс жылдамдауды бөгер еді
  - id: add_customer
    text: Кейінгі тұтынушы сүзгілеріне жаңа келісімшарт қажет болмауы үшін күндік
      көрініске customer_id де қосу
  - id: rename_amount
    text: Ауысқанда gross_amount атауын revenue ету, себебі сақталған тапсырыс сомасы
      — түсім
  answer: point_view_at_mv
  explanation: Тұтынушылар көрініс атаулары мен мағыналарына тәуелді, сондықтан бірдей
    деректердің ескі және жаңа жауабын салыстырғаннан кейін астындағы іске асуы өзгере
    алады. Бақылау тақталарын материалданған көрініске бағыттау оларды іске асуға
    байлайды. Күндік жолдағы тұтынушы бағаны түйіршіктілікті өзгертеді, оған жаңа
    интерфейс қажет. Тапсырыс сомасын сақтау оны түсімге айналдырмайды.
- id: worth_storing
  type: single_choice
  objective: Қайталанатын сұраулар нәтижені сақтау мен жүргізуді ақтай ма, шешу.
  prompt: Осылардың қайсысы асинхронды материалданған көріністі ақтайды?
  options:
  - id: repeated_costly_query
    text: Бақылау тақталары сағатына жүздеген рет орындайтын қымбат күндік агрегаттау,
      10 минут ескі болса жарайды
  - id: one_off
    text: Талдаушы жиналыстың бір сұрағына жауап беру үшін бір рет орындайтын былтырғы
      тапсырыстарды бір реттік зерттеу
  - id: tiny_table
    text: Әр орындағанда бірнеше миллисекундта жауап беретін он жолдық кесте сұрауы
  - id: changing_shapes
    text: Талдаушылар жазатын әр сұрауда топтауы мен сүзгілері өзгеретін арнайы сұрақтар
  answer: repeated_costly_query
  explanation: 'Бірдей қымбат сұрау жиі қойылып, тұтынушылары бақыланатын кідірісті
    қабылдаса, сақталған нәтиже пайдалы: бір жаңарту көп оқуға қызмет етеді. Бір реттік
    сұрақ сақталған нәтиже шығынын ақтамай тұрып жауап алады. Өте шағын кесте бақыланатын
    жаңартуға тұрарлық пайда алмайды. Өзгеретін сұрау пішіндеріне әр жолы басқа сақталған
    нәтиже қажет болар еді.'
passing_score_percent: 80
