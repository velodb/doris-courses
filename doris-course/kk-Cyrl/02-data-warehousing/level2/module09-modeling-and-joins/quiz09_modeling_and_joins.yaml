title: '9-модуль тесті: деректер қоймасын модельдеу және біріктірулер'
description: Бір дұрыс жауабы бар алты сұрақ; дерекқорға қосылу қажет емес. Жібергеннен
  кейін түсіндірмелерді қараңыз.
questions:
- id: declare_grain
  type: single_choice
  objective: Біріктірмес бұрын факт және өлшем кестелерінің түйіршіктілігін айту.
  prompt: Талдаушы әр тапсырыстың төленген сомасын көрсету үшін тапсырыс фактісін
    төлем кестесімен біріктіреді, кей тапсырыстың сомасы екі еселенеді. Алдымен нені
    айту керек еді?
  options:
  - id: grains
    text: Факт жолы — бір тапсырыс, төлем жолы — бір төлем, сондықтан екі рет төленген
      тапсырыс екі рет сәйкес келеді
  - id: join_type
    text: Біріктіру LEFT JOIN болуы керек, ол сол кестесінің жолдар санын сақтайды
  - id: distinct_sum
    text: Біріктіру не қайтарса да әр тапсырыс сомасын бір рет санайтын SUM(DISTINCT
      order_amount) қажет
  - id: more_buckets
    text: Екі кестеге де көбірек бакет қажет, себебі аз бакет біріктіруде жолдарды
      қайталатады
  answer: grains
  explanation: 'Түйіршіктіліктер әртүрлі: әр тапсырысқа бір жол және әр төлемге бір
    жол, сондықтан екі төлемі бар тапсырыс екі рет көрініп, сомасы екі рет саналады.
    Сол жақ біріктіру сәйкес келмеген тапсырыстарды сақтайды және екі рет сәйкес келетінін
    бәрібір қайталайды. SUM(DISTINCT) сомасы бірдей екі бөлек тапсырысты да біріктірер
    еді. Бакеттер біріктірудің қай жолды қайтаратынын емес, деректердің қалай сақталатынын
    шешеді.'
- id: model_for_source
  type: single_choice
  objective: Дереккөз жазбаларды қосатынына не ағымдағы күйді ауыстыратынына қарай
    кесте моделі мен кілтін таңдау.
  prompt: CRM әр тұтынушы өзгерген сайын толық ағымдағы жазбасын қайта жібереді, қойма
    әр тұтынушыға бір ағымдағы жол сақтауы керек. Қай кесте жарайды?
  options:
  - id: unique_customer
    text: Жаңарақ жазба тұтынушының ескі жолын ауыстыруы үшін customer_id бойынша
      Unique Key кестесі
  - id: duplicate_customer
    text: Кілті әр тұтынушыға бір жол сақтайтын customer_id бойынша Duplicate Key
      кестесі
  - id: aggregate_sum
    text: Жазбалар ағымдағы күйге қосылуы үшін атрибуттарға SUM қолданатын Aggregate
      Key кестесі
  - id: duplicate_with_count
    text: Duplicate Key кестесі және қайталануларды жасыру үшін әр есепте COUNT(DISTINCT
      customer_id)
  answer: unique_customer
  explanation: Дереккөз күйді ауыстырады, сондықтан бизнес кілті бар Unique Key кестесі
    әр тұтынушыға бір ағымдағы жол сақтайды. Duplicate Key қабылдаған әр жолды сақтайды;
    кілті тек сұрыптайды, сондықтан өзгерген тұтынушы тапсырысқа екі рет сәйкес келер
    еді. Атау не аймақ сияқты атрибуттар қосылмайды. Есептерде бөлек тұтынушыларды
    санау қайталануларды жасырады, бірақ олар екі еселейтін біріктіруді түзетпейді.
- id: three_join_checks
  type: single_choice
  objective: Біріктіруде жоғалған және қайталанған жолдарды жолдар санымен, бөлек
    кілттермен және сомалармен тексеру.
  prompt: 11 тапсырысты тұтынушы өлшемімен ішкі біріктіргеннен кейін нәтижеде 11 жол
    бар. Біріктіру дұрыс па?
  options:
  - id: not_yet
    text: 'Әзірше белгісіз: бөлек тапсырыстар мен соманы да салыстыру керек; жоғалған
      және екі еселенген тапсырыс әлі 11 жол береді'
  - id: yes_rows
    text: 'Иә: дейінгі және кейінгі бірдей жол саны еш тапсырыс жоғалмағанын не екі
      еселенбегенін көрсетеді'
  - id: yes_inner
    text: 'Иә: ішкі біріктіру тек жолдарды алып тастай алады, сондықтан 11-ден 11
      ешқайсысын алып тастамағанын көрсетеді'
  - id: check_plan
    text: 'Тек жоспар айтады: BROADCAST әр тапсырысты сақтайды, екі кестені shuffle
      ету кейбірін жоғалта алады'
  answer: not_yet
  explanation: '9-зертханалық жұмыстың қате өлшемі фактінің өз санындай 11 жолдық
    ішкі біріктіру береді, бірақ 1510.00 орнына 10 бөлек тапсырыс және 1410.00: бір
    тапсырыс жоғалды, екіншісі екі еселенді. Бірдей жолдар саны бірін-бірі өтейтін
    екі қатені жасыра алады. Ішкі біріктіру де кілті екі рет сәйкес келетін жолды
    көбейтеді. Таратылу біріктірудің қай жолдарды қайтаратынын емес, жолдардың қалай
    жылжитынын шешеді.'
- id: find_missing
  type: single_choice
  objective: Өлшем жолы жетіспейтін фактілерді сол жақ не антибіріктірумен табу.
  prompt: Кей тапсырыстар өлшемде әлі жоқ тұтынушыларға сілтеуі мүмкін. Қай сұрау
    сол тапсырыстарды тізеді?
  options:
  - id: left_is_null
    text: Тапсырыстарды өлшеммен LEFT JOIN жасап, өлшем кілті IS NULL жолдарын қалдыру
  - id: inner_is_null
    text: Тапсырыстарды өлшеммен INNER JOIN жасап, өлшем кілті IS NULL жолдарын қалдыру
  - id: compare_counts
    text: Тапсырыс COUNT(*) санын өлшем COUNT(*) санымен салыстыру, тұтынушылар жетіспесе,
      олар өзгеше болады
  - id: dimension_first
    text: Өлшемді тапсырыстармен LEFT JOIN жасап, тапсырысы жоқ тұтынушыларды қалдыру
  answer: left_is_null
  explanation: 'Сол жақ біріктіру әр тапсырысты сақтап, тұтынушы сәйкес келмесе, өлшем
    бағандарын NULL толтырады, сондықтан бұл жолдар — тұтынушысы жоқ тапсырыстар:
    антибіріктіру. Ішкі біріктіру дәл соларды алып тастайды. Екі кестенің жол саны
    әртүрлі нәрсені өлшейді: 11 тапсырыс және 663 тұтынушы. Өлшемнен басталған сол
    жақ біріктіру кері бағытты, тапсырысы жоқ тұтынушыларды табады.'
- id: read_join_plan
  type: single_choice
  objective: Жоспарды өлшеу деп қабылдамай, EXPLAIN арқылы біріктіру түрі мен таратылуын
    оқу.
  prompt: 'Тапсырыс фактісі мен тұтынушы өлшемінің біріктіруіне EXPLAIN join op: INNER
    JOIN(BROADCAST)[] көрсетеді. Бұл нені айтады?'
  options:
  - id: broadcast_plan
    text: Doris тұтынушыларды тапсырыстарды сканерлейтін әр данаға жіберуді жоспарлайды;
      орындалуды Profile көрсетеді
  - id: measured_fast
    text: Біріктіру жылдам орындалды, себебі broadcast екі кестені shuffle етуден
      жылдам
  - id: colocated
    text: Кестелер бірге орналастырылған, себебі екеуі де customer_id хэші бойынша
      бакеттерге бөлінген
  - id: keeps_unmatched
    text: Біріктіру тұтынушысы жоқ тапсырыстарды сақтайды, себебі broadcast — сол
      жақ сыртқы біріктіру түрі
  answer: broadcast_plan
  explanation: 'Біріктіру түйіні логикалық INNER JOIN және жоспарланған BROADCAST
    таратылуын көрсетеді: бір жақ екіншісін сканерлейтін даналарға жіберіледі. Жоспар
    — өлшеу емес, таңдау; Query Profile орындалудың не істегенін тіркейді. Еш стратегия
    әрқашан ең жылдам емес: үлкен кестені барлық жаққа тарату қымбат. Colocation-ға
    тек сәйкес хэш бағандары емес, colocation тобы қажет және ол COLOCATE көрсетер
    еді. Таратылу қай жолдар қалатыны туралы ештеңе айтпайды.'
- id: layers_rebuild
  type: single_choice
  objective: Бастапқы жеткізілімдерді, тексерілген егжей-тегжейлі деректерді және
    агрегаттарды қайта құруға болатын бөлек қабаттарда сақтау.
  prompt: Пакетте қате пішімдегі сома, қайталанған төлем және тапсырыстың ескі нұсқасы
    келеді. Қай жобалау дәлелді сақтап, пакет қайта өңделгенде сол есепті береді?
  options:
  - id: rebuild_layers
    text: Әр жеткізілімді ODS ішінде сақтау, DWD-ті бизнес кілті және нұсқамен құру,
      DWS пен ADS-ті DWD-тен қайта құру
  - id: final_only
    text: Тек жарияланған қорытынды, әр пакет келгенде қорытындысын қосып отыру
  - id: clean_in_place
    text: Бір кестеде тек тазартылған деректер болуы үшін бастапқы жазбаларды орнында
      түзету
  - id: summary_from_ods
    text: Әр жеткізілімді бір тапсырыс деп санап, тікелей жеткізілімдерден есептелген
      қорытынды
  answer: rebuild_layers
  explanation: ODS қате соманы қоса келгенді сақтайды, сондықтан ережені түзетіп,
    қайта орындауға болады; DWD тапсырыстарды нұсқа, төлемдерді ID бойынша шешеді;
    DWD-тен қайта құрылған DWS және ADS сол жолдарды береді. Қорытындыны қосу қайта
    орындалған пакетті екі рет санайды және дәлел сақтамайды. Бастапқы жазбаларды
    түзету дереккөз жібергенді жоғалтады. Жеткізілімдерді санау қайталанған және ескі
    жеткізілімдерді тапсырыс деп санайды.
passing_score_percent: 80
