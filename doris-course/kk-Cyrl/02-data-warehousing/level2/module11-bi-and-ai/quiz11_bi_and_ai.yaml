title: '11-модуль тесті: BI және AI тұтынушыларына арналған интерфейстер мен шекаралар'
description: Бір дұрыс жауабы бар алты сұрақ; дерекқорға қосылу қажет емес. Жібергеннен
  кейін түсіндірмелерді қараңыз.
questions:
- id: semantic_view
  type: single_choice
  objective: Тұрақты атаулары, бір жарияланған түйіршіктілігі және мағынасы жазылған
    көрсеткіштері бар семантикалық көрініс жобалау.
  prompt: BI тобы күндік тапсырыстардың бақылау тақтасын жасайды. Қай интерфейсті
    алуы керек?
  options:
  - id: semantic_view
    text: Келісімшарты мағыналары мен жауаптыларын жазатын, әр күнге бір жолы және
      атаулы көрсеткіштері бар көрініс
  - id: fact_table
    text: Әр диаграмма тапсырыстарды қажетінше агрегаттауы үшін тапсырыс фактісінің
      өзі
  - id: service_rows
    text: Бақылау тақтасы күндер ретінде оқи алатын ұсыну кестесінің күн-аймақ жолдары
  - id: wide_view
    text: Кейінгі еш сұраққа жаңа көрініс қажет болмауы үшін әр тапсырысқа бір жолы
      және барлық бағандары бар көрініс
  answer: semantic_view
  explanation: 'Семантикалық көрініс бір түйіршіктілікті және мағынасы жазылған атаулы
    көрсеткіштерді жариялайды, сондықтан әр диаграмма сол анықтаманы оқиды. Факт әр
    диаграммаға келісімшарт сүзгісі мен агрегаттауын қайталатады. Аймақ жолдары күндер
    емес: оларды күн деп оқитын диаграмма әр күнді әр аймаққа бір рет санайды. Тапсырысқа
    бір жолы бар көрініс — бақылау тақтасынан басқа түйіршіктіліктегі егжей-тегжейлі
    деректер.'
- id: ratio_over_days
  type: single_choice
  objective: Бақылау тақтасында өлшемдерді, аддитивті көрсеткіштерді және қатынастарды
    ажырату.
  prompt: 'Бақылау тақтасы әр күннің average_order_amount мәнін көрсетеді: 1 қаңтарда
    9 тапсырыс, 133.33; 2 қаңтарда 1 тапсырыс, 110.00. Екі күннің жалпы орташасы қандай?'
  options:
  - id: recompute
    text: 'gross_amount қосындысын order_count қосындысына бөлу: 1310.00 / 10 = 131.00'
  - id: average_ratios
    text: 'Екі күндік орташаның орташасы: (133.33 + 110.00) / 2 = 121.67'
  - id: sum_ratios
    text: Екі күндік орташаның қосындысы, себебі көрсеткіштер күндер бойынша қосылады
  - id: higher_ratio
    text: Екеуінің жоғарысы, себебі қатынасты күндер бойынша біріктіруге болмайды
  answer: recompute
  explanation: 'Қатынас аддитивті емес: алымы мен бөлімін күндер бойынша қосып, қайта
    бөліңіз — 10 тапсырысқа 1310.00. Күндік орташаларды орташалау 2 қаңтардың бір
    тапсырысына 1 қаңтардың тоғызындай салмақ береді. Орташаларды қосу мағынасыз.
    Қатынасты құрамдас бөліктерінен біріктіруге болады.'
- id: checks_fail_on_purpose
  type: single_choice
  objective: Интерфейс жолдарын, null мәндерін, күндер мен сомаларын тексеріп, келісімшарт
    және өзектілік тексерулерін әдейі сәтсіз ету.
  prompt: Семантикалық көріністің жариялау тексерулері әрқашан өтеді. 11-зертханалық
    жұмыс неге бұзылған көшірмені және 9 қаңтар өзектілік күнін де тексереді?
  options:
  - id: prove_checks
    text: 'Тексерулердің сәтсіз болғанын көру үшін: ешқашан сәтсіз болмаған тексеру
      ештеңені тексермеуі мүмкін'
  - id: fix_view
    text: Тексеру сәтсіз болса, бұзылған көшірме ауыстыратын жарияланған көріністі
      жөндеу үшін
  - id: time_checks
    text: Тексеруге қанша уақыт кететінін өлшеу үшін, себебі баяу тексеру сәтсіз саналады
  - id: business_clock
    text: Себебі 9 қаңтар — бизнестің өз уақыты, онда көрініс жеті күн кешіккен
  answer: prove_checks
  explanation: Бағаны жоқ көшірмені қабылдамайтын келісімшарт тексеруі және жеті күндік
    кідірісті қабылдамайтын өзектілік тексеруі екеуінің де жұмысын дәлелдейді; жарияланған
    көрініс өзгермейді. Бұзылған көшірме жарияланбай, жойылады. Бұл тексерулер жылдамдықты
    сынамайды. 9 қаңтар — бекітілген оқу күні; нақты тексеру бизнес уақытын және жарияланған
    ережесін қолданады.
- id: calendar_features
  type: single_choice
  objective: Модель дәлдігі туралы ештеңе мәлімдемей, күнтізбе бойынша белгі кірістерін
    дайындау.
  prompt: Модель күндік белгілерді оқиды, 3 қаңтарда тапсырыс болмады. Белгі проекциясы
    3 қаңтарға не беруі керек?
  options:
  - id: zero_row
    text: 'Күнтізбе жолы: 0 тапсырыс, орташа жоқ, белгі орнатылған; модель туралы
      ештеңе дәлелдемейді'
  - id: no_row
    text: Жол жоқ, себебі семантикалық көріністе сол күн жоқ, жоқ жол тапсырыс жоқтығын
      білдіреді
  - id: zero_average
    text: Модель NULL орнына сан оқуы үшін 0 тапсырысы және 0.00 орташасы бар жол
  - id: proves_accuracy
    text: Модельдің тапсырыссыз күндерді дұрыс болжайтынын көрсететін, белгісі орнатылған
      жол
  answer: zero_row
  explanation: Күнтізбеден бастау күнге нөл сандар, NULL қатынас және белгісі бар
    жол жасайды; проекция тексерілген кірістер дайындайды, модельге жауапты дәлдігін
    бағалайды. Жоқ жол — мүлде кіріс жоқ, ол сол күн тапсырыстары әлі келмегенін де
    білдіруі мүмкін. 0.00 орташа жоқ жерде мән ойлап табады. Белгі болжам туралы ештеңені
    дәлелдемейді.
- id: who_checks_what
  type: single_choice
  objective: Doris неге кепілдік беретінін және BI құралы не AI қолданбасы нені өзі
    тексеруі керегін айту.
  prompt: Бақылау тақтасының сұрауы 200 ms ішінде қайтады. Қай қорытынды дұрыс?
  options:
  - id: speed_only
    text: Интерфейс жылдам болды; өзектілік пен дұрыстыққа бөлек тексерулер керек,
      кейбірін BI құралы жасайды
  - id: fresh
    text: Деректер өзекті, себебі жылдам жауап кестелердің ең жаңа жолдарынан келеді
  - id: correct
    text: Сандар дұрыс, себебі Doris диаграмма қолданған анықтаманы тексерді
  - id: tool_free
    text: Doris әр диаграмма санын тексергендіктен, BI құралына өз тексеруі қажет
      емес
  answer: speed_only
  explanation: Кідіріс — бір уәде. Өзектілік жаңартуларға, кешіккен деректерге және
    BI кэшіне, дұрыстық метрика анықтамасы мен диаграмма сүзгілеріне байланысты, әрқайсысының
    жауаптысы бар. Жылдам жауап кэштен келуі мүмкін. Doris SQL орындайды; диаграмманың
    дұрыс анықтама қолданғанын тексермейді. BI құралы сүзгілеріне, кэшіне және өз
    пайдаланушыларына жауап береді.
- id: mcp_boundary
  type: single_choice
  objective: Бөлек MCP сервері және жарияланған көріністермен шектелген тек оқитын
    тіркелгі арқылы AI құралының Doris қатынауын шектеу.
  prompt: Топ AI ассистентін Doris MCP Server арқылы Doris-ке қосады. Қай баптау ассистент
    не оқи алатынын шектейді?
  options:
  - id: readonly_account
    text: Сервер тек жарияланған көріністерді оқи алатын тіркелгімен қосылады, оған
      өз шектерін қосады
  - id: root_with_filters
    text: Сервер root ретінде қосылады, құрал сүзгілері мен жол шектері ассистентті
      егжей-тегжейлі деректерден алыстатады
  - id: inside_fe
    text: Сервер FE ішінде жұмыс істейді, сондықтан Doris ассистенттің өз рұқсаттарын
      өзі қолданады
  - id: prompt_rules
    text: Ассистент prompt-ында оқи алатын кестелер тізілген, сондықтан дерекқор тіркелгісін
      өзгертудің қажеті жоқ
  answer: readonly_account
  explanation: 'Шекара — Doris тіркелгісінің рұқсаттары: жарияланған көріністермен
    шектелген тіркелгі ассистент қандай SQL жасаса да, артық оқи алмайды, сервер шектері
    соған қосылады. root қосылымындағы құрал сүзгілері өзі қамтымағанды өткізіп алады,
    root бәрін өзгерте алады. MCP Server — MySQL хаттамасымен қосылатын бөлек қызмет.
    Prompt қатынауды басқару емес.'
passing_score_percent: 80
