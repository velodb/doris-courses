title: '12-модуль тесті: Жариялау, рұқсаттар және аудит'
description: Бір жауап таңдалатын алты сұрақ; дерекқор қосылымы қажет емес. Түсіндірмені
  жауап бергеннен кейін көресіз.
questions:
- id: contract_first
  type: single_choice
  objective: Рұқсат бермес бұрын тұтынушы келісімшартын жазып, жарияланатын нысанды
    таңдау.
  prompt: BI тобы дүйсенбіде тақта басталар алдында тіркелгі сұрайды. GRANT-тан бұрын
    не болуы керек?
  options:
  - id: contract_object
    text: bi_order_metrics_l2 нысанын, түйіршіктілігін, мағыналарын, ауқымын және
      иелерін атайтын келісімшарт
  - id: root_password
    text: Іске қосу аптасына root құпиясөзі; тақта қатесіз істегенде тар тіркелгі
  - id: global_select
    text: Әр диаграмма керегін оқу үшін *.*.* үстіндегі SELECT_PRIV тіркелгісі
  - id: detail_table
    text: Әр диаграмма күндік сомасын өзі есептеуі үшін orders_fact_l2 қатынауы
  answer: contract_object
  explanation: 'Рұқсат нысаны мен ауқымы келісімшарттан шығады: бір семантикалық көрініс,
    тек оқу, өзгерісті мақұлдайтын иелер. Root пайдаланушыларға бәрін өзгерту/жоюға
    мүмкіндік береді, аудит оларды ажыратпайды. Жаһандық SELECT әр кестені, кейінгілерін
    де оқиды. Егжей-тегжей әр диаграммаға келісімшартты қайталатып, тұтынушыға айналып
    өтуге мүмкіндік береді.'
- id: role_select
  type: single_choice
  objective: Қажет нысан рұқсатын ғана рөлмен беріп, оқу мен әкімшілікті ажырату.
  prompt: BI бесеуі bi_order_metrics_l2 оқуы керек. Қай рұқсат сай?
  options:
  - id: role_select
    text: Рөлге internal.<db>.bi_order_metrics_l2 үстінде SELECT_PRIV, рөлді бес адамға
      беру
  - id: user_admin
    text: Әкімші әр көріністі оқитындықтан бесеуіне жеке ADMIN_PRIV беру
  - id: role_grant
    text: Мүшелер тек сол көріністі оқуы үшін рөлге көріністегі GRANT_PRIV беру
  - id: database_scope
    text: Көрініс пен дереккөздерін қамтитын internal.<db>.* SELECT_PRIV рөлін беру
  answer: role_select
  explanation: SELECT_PRIV — оқу рұқсаты, жалғыз көрініс — ауқымы. Рөл тексеруге бір
    рұқсат, адамға өзгертуге бір мүшелік береді; мүшелер дереккөз рұқсатынсыз көріністі
    оқиды. ADMIN_PRIV оқудан әлдеқайда кең. GRANT_PRIV рұқсат бергізеді, дерек оқытпайды.
    База ауқымы әр кестені, дереккөздер мен кейінгілерді қамтиды.
- id: kinds_of_evidence
  type: single_choice
  objective: SHOW GRANTS, SHOW ROLES, тұтынушы сұраулары, өзгеріс жазбасы, аудит әрқайсысы
    нені дәлелдейтінін айту.
  prompt: Тексеруші тақта тіркелгісі өткен аптада тапсырыс егжей-тегжейін шынымен
    оқыды ма деп сұрайды. Қай дәлел жауап береді?
  options:
  - id: audit_table
    text: Командасы, күйі, қателері бар __internal_schema.audit_log ішіндегі тіркелгі
      сұраулары
  - id: show_grants
    text: Тіркелгі осы кезге дейін оқыған кестелерді тізетін SHOW GRANTS FOR
  - id: change_record
    text: Тіркелгіге қай нысан берілгенін айтатын рұқсат өзгерісінің жазбасы
  - id: show_roles
    text: Әр рөл мүшелерін және оқыған кестелерін көрсететін SHOW ROLES
  answer: audit_table
  explanation: Аудит не орындалды, кім орындады, нәтижесі қандай екенін тіркейді,
    сондықтан тіркелгі не істегеніне жауап береді. SHOW GRANTS өз/рөл рұқсаттарын
    біріктіріп, не істей алатынын тізеді, не істегенін емес. Өзгеріс жазбасы өзгеріс
    пен себебін құжаттайды, сұрауларды тіркемейді. SHOW ROLES конфигурацияны көрсетеді,
    орындалуды емес.
- id: retire_one
  type: single_choice
  objective: Мүшелік не рөл рұқсатын қайтарып қолжетімділікті тоқтату, әсерін тұтынушы
    ретінде тексеру.
  prompt: A және B бір рөлмен оқиды, A тоқтатылады. Нені қайтарып, қалай тексеру керек?
  options:
  - id: membership
    text: A мүшелігін; кейін A сұрауына тыйым, B әлі оқиды
  - id: role_privilege
    text: 'Көріністегі рөл SELECT_PRIV рұқсатын: A қатынауын дереу жояды'
  - id: drop_role
    text: 'Рөлдің өзін: A-ға қажет емес, B керек кезде жаңасын сұрай алады'
  - id: root_check
    text: A мүшелігін; кейін root сұрауы көрініс әлі оқылатынын растайды
  answer: membership
  explanation: A мүшелігін алу тек A-ға әсер етеді, A/B ретінде сұрау әрқайсысының
    нәтижесін көрсетеді. Рөл рұқсатын қайтару не рөлді жою B-ні де ажыратады. Root
    бәрін оқиды, оның сұрауы екеуі туралы ештеңе дәлелдемейді.
- id: rollback_window
  type: single_choice
  objective: Кестені тексерілген ауысумен жариялап, кері қайтару қашан қауіпсіз болмайтынын
    айту.
  prompt: Жазушы тоқтағанда үміткер салыстырылып, swap = true арқылы жарияланды. Кейін
    жазушы жалғасып, бір тапсырыс жазды. Енді ескі кестеге қайта ауыса ала ма?
  options:
  - id: not_blindly
    text: 'Қуып жетпейінше болмайды: ескіде жариялағаннан кейінгі тапсырыс жоқ'
  - id: yes_atomic
    text: 'Иә: алмастыру атомарлы, қайта алмастыру дәл жарияланған күйді қайтарады'
  - id: yes_retained
    text: 'Иә: swap = true ескіні сақтады, Doris оны жарияланғанмен бірге жаңартады'
  - id: never
    text: 'Жоқ: кесте жарияланған соң оны кері алмастыру мүмкін емес'
  answer: not_blindly
  explanation: Жазушы тоқтағанда кері қайтару қауіпсіз; алғашқы жазудан кейін ескіде
    сол жазу жоқ, қайта алмастыру оны жоғалтады. Атомарлы — оқырман екі кестенің бірін
    көреді деген сөз, ескіде жаңа жазулар бар деген емес. Сақталған кесте жарияланғанға
    ілеспейді. Алмастыруды қайталауға болады, қауіпті ететіні дерек.
- id: rows_columns
  type: single_choice
  objective: Шектеуге кесте/баған рұқсатын, Row Policy не бүркемелеуді таңдау.
  prompt: EAST тек orders_fact_l2 EAST тапсырыстарын оқып, paid_amount пен refund_amount
    көрмеуі керек. Қайсысы сай?
  options:
  - id: policy_and_columns
    text: Топ рөліне region Row Policy-і және тек қалған бағандарға SELECT_PRIV
  - id: dashboard_filter
    text: Тақтада region сүзгісі, екі бағанды қоспайтын диаграммалар
  - id: table_select
    text: Сұраулар тек EAST сұрайтындықтан бүкіл кестеге SELECT_PRIV
  - id: masking_only
    text: 'Екі төлем бағанын бүркемелеу: ол WEST тапсырыстарын да жасырады'
  answer: policy_and_columns
  explanation: 'Рөлдің RESTRICTIVE Row Policy-і әр мүше сұрауында EAST жолдарын ғана
    қалдырады; баған рұқсаты екі төлем бағанын қоспайды, SELECT * пен COUNT(*) да
    өтпейді. Тақта сүзгісі міндетті емес: сұрау WEST сұрай алады. Кесте рұқсаты барлық
    жол/бағанды қамтиды. Бүркемелеу мән бөлігін жасырады, жол сүзбейді.'
passing_score_percent: 80
