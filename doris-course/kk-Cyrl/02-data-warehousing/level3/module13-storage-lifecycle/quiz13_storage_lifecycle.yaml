title: '13-модуль тесті: Сақтау мен өмірлік циклді басқару'
description: Бір жауап таңдалатын алты сұрақ; дерекқор қосылымы қажет емес. Түсіндірмені
  жауап бергеннен кейін көресіз.
questions:
- id: partition_key
  type: single_choice
  objective: Сақтау ережесі мен сұрау уақытына сай бөлім шекарасын таңдау.
  prompt: Ағымдағы күнтізбелік ай және алдыңғы 12 ай сақталады; қаңтар тапсырысы кейде
    ақпанда келеді. Қалай бөлімдеу керек?
  options:
  - id: monthly_order_date
    text: 'order_date күнтізбелік айымен: кеш қаңтар тапсырысы қаңтарға түседі'
  - id: monthly_load_time
    text: 'Жүктеу уақытының айымен: әр ай жүктеулері бірге жойылады'
  - id: yearly_delete
    text: Жылмен, ішіндегі ескі айларды шартты DELETE арқылы жою
  - id: rolling_days
    text: Күнмен, қызмет көрсету күнінен 365 күн бұрынғыдан ескі күндерді жоятын тапсырмамен
  answer: monthly_order_date
  explanation: 'Мерзімді шешіп, сұрау сүзетін уақыт — тапсырыс күні, бірлігі — күнтізбелік
    ай: кеш тапсырыс өз айына түседі, әр ескі ай — бір бөлім. Жүктеу уақыты кешіккенді
    қате айға қояды. Жылдық бөлімдегі DELETE compaction-ға дейін әр жыл сұрауы қолданатын
    предикат қалдырады. 365 күн — 13 күнтізбелік айдан бөлек ереже.'
- id: tablet_count
  type: single_choice
  objective: Жол бөлімге, tablet-ке, репликаға, rowset-ке, сегментке қалай тиесілі
    екенін түсіндіру.
  prompt: 13 айлық бөлім, әрқайсысында 8 bucket, 3 реплика бар. SHOW TABLETS неше
    жол береді?
  options:
  - id: replicas_312
    text: '312: бөлім/bucket-ке бірден 104 tablet, әр репликасы тізіледі'
  - id: tablets_104
    text: '104: tablet-ке бір жол, өйткені SHOW TABLETS реплика тізбейді'
  - id: partitions_13
    text: '13: бөлімге бір жол, өйткені әр бөлім — бір tablet'
  - id: buckets_24
    text: '24: bucket/репликаға бір жол, өйткені бөлімдер bucket-терді бөліседі'
  answer: replicas_312
  explanation: 'Әр бөлімде bucket-ке бір tablet: 13 × 8 = 104; әрқайсысының 3 репликасына
    бір жолдан — 312. Репликалар тізіледі, сондықтан бөлім сөйлемі көмектеседі. Tablet
    саны bucket санына тең; bucket-тер бүкіл кестеге ортақ емес, әр бөлімдікі.'
- id: lagging_count
  type: single_choice
  objective: SHOW PARTITIONS, SHOW TABLETS, SHOW CREATE TABLE арқылы өзгеріске дейінгі/кейінгі
    дәлелді жазу.
  prompt: Жүктегеннен кейін бірден қаңтар VisibleVersion өсті, бірақ SHOW PARTITIONS
    RowCount -1 көрсетеді. Қазір жолын қалай санайсыз?
  options:
  - id: count_partition
    text: SELECT COUNT(*) FROM кесте PARTITION (p202501); RowCount есеп күтеді
  - id: trust_minus_one
    text: '-1 мәнін бос бөлім деп оқу: RowCount -1 әлі жол жоқ дегенді білдіреді'
  - id: tablet_rowcount
    text: Жүктеу кезінде санайтын SHOW TABLETS RowCount мәнін оқу
  - id: show_create
    text: Әр бөлім жол санын тізетін SHOW CREATE TABLE оқу
  answer: count_partition
  explanation: VisibleVersion жүктеу бекітілгенде, RowCount/DataSize BE-нің шамамен
    бір минуттан кейінгі есебімен өзгереді; бөлім сұрауы қазір санайды. -1 — әлі хабарланбаған,
    бос екенін білдірмейді. SHOW TABLETS RowCount сол есепті күтеді. SHOW CREATE TABLE
    жол емес, анықтама береді.
- id: truncate_stages
  type: single_choice
  objective: Сұрауда көріну, метадерек өзгерісі, босатылған орынды ажыратып, compaction
    орнын айту.
  prompt: TRUNCATE TABLE ... PARTITION (p202501) жаңа ғана қайтты. Сол сәтте не өзгерді?
  options:
  - id: visible_and_id
    text: Қаңтар жолдары көрінбейді, ID жаңа; ескі файлдары себетте күтеді
  - id: space_freed
    text: Қаңтар диск орны бос, өйткені TRUNCATE барлық файлды бірден жояды
  - id: after_compaction
    text: 'Әзірге ештеңе: compaction жойғанша қаңтар жолдары көрінеді'
  - id: same_id
    text: 'Жолдар жоқ, PartitionId сол қалпы: бөлім орнында тазаланған'
  answer: visible_and_id
  explanation: 'TRUNCATE бөлімді аты бірдей жаңа босымен алмастырады: нәтиже дереу
    өзгереді, ID жаңа; ескі себетте күтеді, файлдары мерзімнен кейін кетеді. Орын
    бірден босамайды. Compaction rowset/жою предикаттарына қатысты, TRUNCATE-қа емес.
    Бөлім орнында босамай, алмастырылады.'
- id: recover_by_id
  type: single_choice
  objective: Жойылған/тазаланған бөлімді себеттен қайтарып, тек көшірме/мұрағат қашан
    көмектесетінін айту.
  prompt: Қаңтар бір сағат бұрын қате тазаланды, бос алмастырушы жол алған жоқ. Қалай
    қайтарасыз?
  options:
  - id: drop_then_recover_id
    text: Бос алмастырушыны жойып, тазалауға дейінгі ID-мен RECOVER PARTITION p202501
      орындау
  - id: recover_by_name
    text: 'RECOVER PARTITION p202501 FROM кесте орындау: дерегі барын қайтарады'
  - id: restore_needed
    text: 'Тек сақтық көшірме: тазаланған бөлім себетке түспейді'
  - id: truncate_again
    text: 'Қайта TRUNCATE орындау: ескіні себеттен кері алмастырады'
  answer: drop_then_recover_id
  explanation: Тазаланған бөлім бір күн себетте. Сол аттағы алмастырушы RECOVER-ге
    кедергі; оны да жойса, себетте екі бірдей атау болады, жазылған ID дұрысын таңдайды.
    Атаумен алдымен тыйым, кейін ең жаңа бос қайтады. Көшірме бір сағат ішінде емес,
    FORCE не мерзім соң қажет. Екінші TRUNCATE тағы бір бос бөлімді себетке қояды.
- id: runbook
  type: single_choice
  objective: Ауқымы, тексеруі, дәлелі, алдын ала сыналған қайтаруы бар қызмет көрсету
    нұсқаулығын жазу.
  prompt: 13 ай ережесімен 2025 қаңтарды жоюдың қай нұсқаулығы толық?
  options:
  - id: complete
    text: Ауқым p202501; ID/нұсқа/жолдарын жазу; мұрағатын қайта оқу; жою; тексеру
  - id: force_drop
    text: Бірден орын босату үшін p202501 FORCE жойып, кейін себетке сүйену
  - id: truncate_table
    text: Дәлелсіз бүкіл кестені тазалап, қалатын 13 айды қайта жүктеу
  - id: delete_rows
    text: 2025 ақпаннан бұрынғыны DELETE, диск азайғанын тексеру, мұрағат сақтамау
  answer: complete
  explanation: Нұсқаулық ауқымды атап, бастапқы дәлелді жазып, кейін тексереді, өзгеріске
    дейін мұрағатты оқып қайтаруды сынайды. FORCE себетті өткізеді, кейін сүйенуге
    болмайды. Бүкіл кестені тазалау қалуы тиіс 13 айды қамтиды. DELETE бірден орын
    босатпайды, мұрағатсыз қате шарт қайтарылмайды.
passing_score_percent: 80
