title: '1-модуль тесті: Doris-пен танысу және алғашқы тапсырыстарды талдау'
description: Бір дұрыс жауабы бар алты сұрақ; дерекқорға қосылу қажет емес. Жібергеннен
  кейін түсіндірмелерді қараңыз.
questions:
- id: transaction_or_analysis
  type: single_choice
  objective: Транзакцияны аяқтауды тапсырыстар тобын талдаудан ажырату.
  prompt: Бөлшек саудагер сатып алуды рәсімдеу сұрауларын өткен ай тапсырыстары туралы
    есептен бөледі. Қай сұрау талдамалық жұмыс жүктемесіне жатады?
  options:
  - id: submit_and_deduct
    text: Бір бизнес операциясында тапсырысты беру және оның тауарларын қойма қорынан
      шегеру
  - id: summarize_orders_by_date
    text: Бір айдың тапсырыстарын оқу, оларды санау және сомаларын күн бойынша қосу
  - id: address_lookup
    text: Тұтынушы растауы немесе өзгертуі үшін бір тапсырыстың жеткізу мекенжайын
      іздеу
  - id: record_payment_status
    text: Төлем нәтижесін тіркеу және сол төлеммен төленген тапсырыстың күйін жаңарту
  answer: summarize_orders_by_date
  explanation: Көп тапсырысты оқып, күн бойынша қорытындылау — нәтиже бірнеше жол
    болса да, талдау. Тапсырысты беру және қойма қорын азайту бір транзакцияны аяқтайды.
    Бір тапсырыстың мекенжайын іздеу SELECT қолданады, бірақ тапсырыстарды жалпы талдауға
    емес, тұтынушының транзакциясына қызмет етеді. Төлемді тіркеу және тапсырыс күйін
    жаңарту бір бизнес нысанын өзгертеді, бұл да транзакциялық жұмыс.
- id: doris_between_systems
  type: single_choice
  objective: Бизнес дерекқорлары мен аналитика пайдаланушылары арасындағы Doris рөлін
    түсіндіру.
  prompt: Интернет-дүкенде талдаушылар екі жылдық тапсырыстар бойынша сағаттық сату
    үрдістерін зерттегенде де, сатып алуды рәсімдеу жылдам болуы керек. Міндеттерді
    қалай бөлу дұрыс?
  options:
  - id: source_transactions_doris_analytics
    text: Дүкен дерекқоры сатып алуды рәсімдейді; Doris тапсырыс деректерін қабылдап,
      талдаушылардың сұрауларына жауап береді
  - id: doris_handles_checkout
    text: Doris талдаушылардың сұрауларына да жауап бере алатындықтан, сатып алуды
      рәсімдеуде дүкен дерекқорын алмастырады
  - id: analysts_query_source
    text: Талдаушылар дүкен дерекқорына тікелей сұрау жасайды, ал Doris оның кестелерінің
      сақтық көшірмесін сақтайды
  - id: doris_only_stores
    text: Doris тапсырыстарды сақтайды, ал дүкен дерекқоры Doris көшірмесінен сағаттық
      үрдістерді есептейді
  answer: source_transactions_doris_analytics
  explanation: Бизнес дерекқоры транзакцияларды орындауды жалғастырады, ал Doris тапсырыс
    деректерін қабылдап, талдамалық жұмысты орындайды, сондықтан ауыр талдау сатып
    алуды рәсімдеуді баяулатпайды. Doris — талдамалық дерекқор, сатып алуды рәсімдеу
    дерекқорының орнына қолданылмайды. Талдаушылардың дүкен дерекқорына тікелей сұрау
    жасауы — рәсімдеуді баяулататын жүктеменің өзі, ал сақтық көшірме ешбір сұрауға
    жауап бермейді. Doris өзі сақтайтын деректермен есептейді; үрдістерді есептеу
    бастапқы дерекқордың емес, Doris-тің жұмысы.
- id: fe_and_be_roles
  type: single_choice
  objective: Сақтау мен есептеуі біріктірілген орналастыруда Frontend (FE) және Backend
    (BE) міндеттерін түсіндіру.
  prompt: SQL клиенті сақтау мен есептеуі біріктірілген архитектура қолданылатын курстың
    сынақ ортасына тапсырыстарды агрегаттау сұрауын жібереді. Топ Frontend (FE) және
    Backend (BE) арасында міндеттер қалай бөлінеді деп күтуі керек?
  options:
  - id: fe_plans_be_executes
    text: FE SQL қабылдап, сұрауды жоспарлайды; BE деректерді сақтап, жоспарды орындайды
  - id: fe_scans_be_persists
    text: FE метадеректерді сақтап, тапсырыс жолдарын сканерлейді; BE тек файлдарды
      дискіге жазады
  - id: client_splits_plan
    text: Клиент сұрауды жоспарға бөледі, ал FE оның әр бөлігін BE-ге жібереді
  - id: fe_stores_table_data
    text: FE кестелердің деректерін сақтайды, ал BE жиі қолданылатын деректердің кэшін
      сақтап, нәтижелерді қайтарады
  answer: fe_plans_be_executes
  explanation: 'FE SQL қабылдайды, метадеректерді басқарады, сұрауды жоспарлап, үйлестіреді;
    ал BE кестелердің деректерін сақтап, оларды сканерлейді, сүзеді және агрегаттайды.
    Сақтау мен есептеуі біріктірілген архитектурада BE сақтау мен есептеудің екеуін
    де атқарады. FE метадеректерді басқарады, бірақ деректерді сканерлемейді. Клиент
    тек SQL жібереді: таратылған жоспарды FE құрады. Кестелердің деректері FE-де емес,
    BE-де орналасады.'
- id: what_the_mysql_protocol_gives
  type: single_choice
  objective: MySQL хаттамасы арқылы қосылу нені беретінін және нені бермейтінін түсіндіру.
  prompt: Топ MySQL клиентін және MySQL драйвері бар BI құралын Doris-ке қосады, екеуі
    де жұмыс істейді. SELECT VERSION() 5.7.99 мәнін қайтарады. Қай қорытынды дұрыс?
  options:
  - id: tools_send_sql_only
    text: Құралдар Doris-ке SQL жібере алады; деректерді әлі де жүктеу керек және
      Doris-тің SQL синтаксисі өзіне тән
  - id: doris_mirrors_mysql
    text: Енді Doris топтың MySQL дерекқорын шағылыстырып, оның кестелерін өздігінен
      жаңартып отырады
  - id: everything_like_mysql_57
    text: Нұсқа нөміріне сай Doris әр оператор мен параметрде MySQL 5.7 сияқты әрекет
      етеді
  - id: mysql_server_retired
    text: Енді топтың MySQL сервері кестелерін Doris-те сақтайды, сондықтан оны өшіруге
      болады
  answer: tools_send_sql_only
  explanation: MySQL хаттамасы MySQL клиенттері мен драйверлеріне қосылып, SQL жіберуге
    мүмкіндік береді; деректерді бәрібір жүктеу не синхрондау арқылы енгізу қажет,
    ал Doris-тің SQL синтаксисі, кесте модельдері және параметрлері өзіне тән. Қосылым
    деректерді көшірмейді, сондықтан ештеңе автоматты шағылыстырылмайды. 5.7.99 —
    Doris MySQL клиенттеріне хабарлайтын хаттама нұсқасы, MySQL 5.7 мінез-құлқын уәде
    ету емес; Doris нұсқасы SHOW FRONTENDS және SHOW BACKENDS нәтижелерінде. Doris-ке
    қосылу MySQL серверін де, оның кестелерін де өзгертпейді.
- id: filter_and_group_by_date
  type: single_choice
  objective: Тапсырыстарды сүзетін және күн бойынша қорытындылайтын SQL жазу.
  prompt: orders_sample кестесінің әр жолы — бір тапсырыс. Қай сұрау әр күн үшін сомасы
    кемінде 300 болатын тапсырыстар санын және жалпы сомасын күн бойынша сұрыптап
    қайтарады?
  options:
  - id: where_then_group_by_date
    text: WHERE order_amount >= 300, GROUP BY order_date, COUNT(*) және SUM(order_amount)
      арқылы, ORDER BY order_date
  - id: group_by_order_id
    text: WHERE order_amount >= 300, GROUP BY order_id, COUNT(*) және SUM(order_amount)
      арқылы, ORDER BY order_date
  - id: order_by_without_group
    text: WHERE order_amount >= 300 және ORDER BY order_date, әр тапсырыстың ID-і
      мен сомасын әр тапсырысқа бір жолмен көрсету
  - id: average_instead_of_sum
    text: WHERE order_amount >= 300, GROUP BY order_date, COUNT(*) және AVG(order_amount)
      арқылы, ORDER BY order_date
  answer: where_then_group_by_date
  explanation: WHERE топтаудан бұрын сомасы кемінде 300 болатын тапсырыстарды қалдырады,
    GROUP BY order_date әр күнге бір жол жасайды, COUNT(*) тапсырыстарды санайды,
    себебі кестеде әр тапсырысқа бір жол келеді, SUM олардың сомаларын қосады, ал
    ORDER BY күндерді сұрыптайды. order_id бойынша топтау әр күнге емес, әр тапсырысқа
    бір жол қалдырады. ORDER BY өзі тек сұрыптайды; ол бір күннің тапсырыстарын бір
    жолға біріктірмейді. AVG жалпы соманы емес, тапсырыстың орташа сомасын береді.
- id: what_an_amount_shows
  type: single_choice
  objective: Тапсырыстың салыққа дейінгі сомасы нені өлшейтінін және үлгінің жалпы
    сомасы нені көрсете алатынын және көрсете алмайтынын айту.
  prompt: Дүкен салыққа дейінгі жалпы сомасы 8,600.00 болатын үлгідегі 20 тапсырысты
    экспорттайды. Экспортта төлем өрістері жоқ. Деректер қай қорытындыны қолдайды?
  options:
  - id: sample_pre_tax_total
    text: Үлгідегі 20 тапсырыстың салыққа дейінгі жалпы сомасы — 8,600.00
  - id: whole_day_total
    text: Дүкеннің сол күнгі барлық тапсырыстарының салыққа дейінгі жалпы сомасы —
      8,600.00
  - id: all_unpaid
    text: Экспортта төлемдер көрсетілмегендіктен, 20 тапсырыстың ешқайсысы төленбеген
  - id: amount_received
    text: Дүкен осы тапсырыстар үшін осы тұтынушылардан 8,600.00 алды
  answer: sample_pre_tax_total
  explanation: 'Деректер үлгі және оның салыққа дейінгі тапсырыс сомалары туралы тұжырымды
    қолдайды: салыққа дейін неге тапсырыс берілгені. 20 тапсырыстық үлгі дүкеннің
    сол күнгі басқа тапсырыстары туралы ештеңе айтпайды. Төлем өрісінің болмауы тапсырыстар
    төленбегенін білдірмейді: экспортта төлем деректері жай ғана жоқ. Тапсырыс сомасы
    — алынған ақша емес, тапсырыс берілген құн; төлемдер үшін төлем немесе шот деректері
    қажет.'
passing_score_percent: 80
