title: '7-модуль тесті: деректерді жаңарту, жою және оқиғаларды қайта ойнату'
description: Бір дұрыс жауабы бар алты сұрақ; дерекқорға қосылу қажет емес. Жібергеннен
  кейін түсіндірмелерді қараңыз.
questions:
- id: three_grains
  type: single_choice
  objective: Ағымдағы күйдің, оқиға тарихының және бастапқы жеткізілімдердің кілттері
    мен мақсаттарын ажырату.
  prompt: Бір тапсырыстың ағымдағы күйі, бір төлем оқиғасы және қайта әрекеттерден
    кейін сол оқиғаның үш жеткізілімі бар. Аудитор соңғы күйді, бөлек оқиғаларды және
    жеткізу әрекеттерін бөлек түсіндіруі керек. Кестелерді қалай бөлу үшеуіне де жауап
    береді?
  options:
  - id: current_history_deliveries
    text: order_id бойынша ағымдағы кесте, event_id бойынша тарих және әр әрекетті
      сақтайтын жеткізілім журналы
  - id: one_table_by_order
    text: Соңғы жолды сақтайтын order_id бойынша бір кесте, себебі соңғы күй оқиғаларды
      да түсіндіреді
  - id: one_table_by_event
    text: Әр жеткізілімді сақтайтын event_id бойынша бір кесте, одан соңғы күй уақыт
      бойынша таңдалады
  - id: deliveries_only
    text: Тек жеткізілім журналы, себебі әр оқиға мен күйді жеткізілімдерден кейін
      қайта құруға болады
  answer: current_history_deliveries
  explanation: 'Әр сұрақтың өз түйіршіктілігі бар: соңғы күй — әр тапсырысқа бір жол,
    тарих — әр бөлек оқиғаға бір жол, жеткізілім журналы — әр әрекетке бір жол, сондықтан
    үш кілт үш сұраққа жауап береді. Соңғы жолдар кестесі оқиғаларды жоғалтады. event_id
    кестесі әр оқиғаны бір рет сақтайды, сондықтан үш жеткізілімді де санай алмайды,
    келу уақыты қай күй ең жаңа екенін шешпейді. Әр сұрауда бәрін жеткізілімдерден
    қайта құру жұмысты және нұсқа логикасын әр сұрауға жүктейді.'
- id: versions_decide
  type: single_choice
  objective: Қайталанған және ретсіз оқиғаларды бизнес нұсқаларымен шешу.
  prompt: '701-тапсырыстың толық күй оқиғалары мына ретпен келеді: 8-нұсқа DELIVERED,
    6-нұсқа PAID, 7-нұсқа SHIPPED, содан кейін сол 7-нұсқа оқиғасы қайтадан. Ағымдағы
    кесте event_version-ды Sequence бағаны ретінде қолданады. Ағымдағы кесте мен тарих
    не сақтайды?'
  options:
  - id: delivered_three_events
    text: Ағымдағы кесте DELIVERED көрсетеді, тарих оқиға ID-і бойынша үш бөлек оқиғаны
      сақтайды
  - id: last_arrival_wins
    text: Ағымдағы кесте соңғы келген SHIPPED көрсетеді, тарих төрт оқиға сақтайды
  - id: highest_amount_wins
    text: Ағымдағы кесте сомасы ең жоғары оқиғаны көрсетеді, тарих үшеуін сақтайды
  - id: duplicate_breaks_order
    text: Қайта жеткізілім ағымдағы кестені қайта SHIPPED етеді, тарих төрт оқиға
      сақтайды
  answer: delivered_three_events
  explanation: Sequence бағаны келу ретіне қарамастан әр тапсырыстың ең жоғары 8-нұсқасын,
    DELIVERED күйін сақтайды, ал event_id кілті бар тарих үш бөлек оқиғаны сақтайды,
    қайта жеткізілім өзін ауыстырады. Нұсқалар бапталғанда келу реті ештеңені шешпейді.
    Сома нұсқа емес. Қайта жеткізілген 7-нұсқа әлі 8-нұсқадан төмен, оқиға ID-і тарихта
    бар.
- id: partial_update
  type: single_choice
  objective: Бағандарды ішінара жаңартуды өрістері берілмеген толық жол жазуынан ажырату.
  prompt: 52-тапсырыс CREATED, 4-нұсқада, сомасы 75.00, аймағы NORTH. Жаңарту тек
    күйін PAID, 5-нұсқа етеді. Топ сома мен аймақтың сақталғанына қалай көз жеткізеді?
  options:
  - id: enable_partial_update
    text: Ішінара жаңартуды қосып, кілтті, күйді және нұсқаны жазу, төрт бағанды да
      тексеріп, параметрді қалпына келтіру
  - id: omit_columns_is_enough
    text: Тек кілт, күй және нұсқасы бар INSERT жазу, себебі Doris берілмеген бағандардың
      ескі мәндерін сақтайды
  - id: write_without_version
    text: Ішінара жаңартуды қосып, тек кілт пен күйді жазу, себебі ішінара жаңартуға
      жаңа нұсқа қажет емес
  - id: delete_then_insert
    text: Алдымен 52-тапсырысты жойып, жаңа күймен енгізу, сома мен аймақты кешегі
      есептен көшіру
  answer: enable_partial_update
  explanation: Merge-on-Write Unique Key кестесінде enable_unique_key_partial_update
    арқылы қосылған ішінара жаңарту берілген бағандарды бар жолға біріктіреді; төрт
    бағанның бәрін тексеру сақталғандарын көрсетеді, кейін параметр қалпына келтіріледі.
    Бұл параметрсіз бағандары берілмеген INSERT сол бағандарына әдепкі мән не NULL
    бар толық жол жазады. Sequence бағаны болса, 4-нұсқаны жеңу үшін жаңартуға жоғарырақ
    нұсқа қажет. Есептен көшіріп жою және қайта енгізу фактілерді ескірген болуы мүмкін
    көшірмемен ауыстырады.
- id: kinds_of_deletion
  type: single_choice
  objective: Жұмсақ жоюды, SQL DELETE, жүктеудің жою белгісін және физикалық орынды
    босатуды ажырату.
  prompt: Төленген тапсырыстан бас тартылып, кейін ақшасы қайтарылады. Операция тобы
    бас тартылған тапсырысты белсенді тапсырыс есебінен жасырғысы келеді, қаржы қайтарым
    ізін сақтауы керек, ал әріптес жолды жасыру диск орнын бірден босатады деп ойлайды.
    Қай түсіндірме сәйкес?
  options:
  - id: flag_delete_and_keep_facts
    text: Белгі жолдарды тек онымен сүзетін сұраулардан жасырады, DELETE барлық сұраудан
      алып тастайды, қайтарым сақталады
  - id: delete_the_refund
    text: Тапсырысты, төлемін және қайтарымын DELETE арқылы жою, ол жолдарды алып
      тастап, орнын сол мезетте босатады
  - id: delete_mark_frees_space
    text: Тапсырысты жою белгісімен қайта жүктеу, ол кілтті алып тастап, дисктегі
      орнын BE-ге бірден қайтарады
  - id: soft_delete_frees_space
    text: Тапсырысқа бизнес белгісін қою, ол оны барлық сұраудан жасырып, compaction-ға
      файлдарын бірден жоюға мүмкіндік береді
  answer: flag_delete_and_keep_facts
  explanation: 'is_deleted сияқты бизнес белгісі жолды сақтап, оны тек сол белгімен
    сүзетін сұрауларда жасырады, бұл белсенді тапсырыстар есебіне сай; DELETE барлық
    сұраудан жолдарды алып тастайды; қайтарым — жойылатын емес, сақталатын факт. Төлем
    мен қайтарымды жою қаржыға қажет ізді өшіреді, еш жою орынды бірден босатпайды:
    оны кейін compaction босатады. Жүктеудің жою белгісі кілтті сұраулар үшін жояды,
    орны да кейін босайды. Белгі онымен сүзбейтін сұраудан ештеңе жасырмайды.'
- id: replay_after_interruption
  type: single_choice
  objective: Бүкіл пакетті қайта ойнатып, үзілген көп кестелі жазудан қалпына келу.
  prompt: Жұмыс ағымы әр оқиғаны алдымен тарихқа, содан кейін ағымдағы кестеге жазады.
    Оқиға тарихқа жазылып, ағымдағы кестеге әлі жазылмай тұрып істен шықты. Екі кестені
    не дұрыс қалпына келтіреді?
  options:
  - id: replay_whole_batch
    text: 'Бүкіл пакетті қайта ойнату: тарих әр оқиғаны бір рет, нұсқалар ең жаңа
      күйді сақтайды'
  - id: skip_events_in_history
    text: Тек тарихта әлі жоқ оқиғаларды қайта ойнату, себебі тарихтағылар аяқталған
  - id: rebuild_current_by_time
    text: Тарихтан әр тапсырыстың соңғы келу уақыты бар оқиғасын ағымдағы кестеге
      көшіру
  - id: patch_by_hand
    text: Жұмыс ағымы істен шыққанда жазып жатқан оқиғасы бойынша ағымдағы кестені
      қолмен түзету
  answer: replay_whole_batch
  explanation: Тарих event_id кілтімен, ал ағымдағы кесте нұсқаларды шешіп сақталатындықтан,
    оқиғаны қайта жазу бұрын дұрыс болғанды өзгертпейді, сондықтан бүкіл пакетті қайта
    ойнату жетіспеген әр қадамды аяқтайды. Тарихта бар оқиғаны өткізіп жіберу дәл
    сол орындалмаған ағымдағы кесте жазуын өткізіп жібереді. Келу уақыты ең жаңа күйді
    анықтамайды. Қолмен түзету бір тапсырысты жөндейді, қайталанатын қалпына келтіру
    қалдырмайды.
- id: reconcile_with_ledger
  type: single_choice
  objective: Ағымдағы күйді тәуелсіз төлем, қайтарым және жөнелту жазбаларымен салыстыру.
  prompt: Қайта ойнатудан кейін orders_current жалпы төленген 250.00 және қайтарылған
    150.00 көрсетеді. Топ бұл сомалардың дұрыстығын қалай көрсете алады?
  options:
  - id: compare_with_independent_ledger
    text: Әр тапсырысты тәуелсіз сақталған тізілімдегі тауарларымен, төлемдерімен
      және қайтарымдарымен салыстыру
  - id: replay_again
    text: Оқиғаларды үшінші рет қайта ойнатып, сомалар бұрынғыдай қалса, қабылдау
  - id: count_records
    text: Тарихта ағымдағы кесте тапсырыстарынан көп жазба барын тексеру
  - id: non_negative_net
    text: Кез келген ағымдағы тапсырыста төленгеннен қайтарылғанды алғандағы мән теріс
      емес екенін тексеру
  answer: compare_with_independent_ledger
  explanation: 'Басқа жүйе сақтайтын тәуелсіз тізілім — қайта ойнату өзгерте алмайтын
    дәлел: әр тапсырыстың сомасы тауарларына, төленген сомасы төлемдеріне, қайтарылған
    сомасы қайтарымдарына тең болуы керек. Идемпотентті жазуларды үшінші рет қайта
    ойнату дұрыс не қате сол нәтижені қайталайды. Жазба сандары сомалар туралы ештеңе
    айтпайды. Теріс емес таза түсім де қате болуы мүмкін.'
passing_score_percent: 80
