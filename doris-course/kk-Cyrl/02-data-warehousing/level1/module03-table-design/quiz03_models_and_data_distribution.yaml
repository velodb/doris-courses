title: '3-модуль тесті: Doris кесте модельдері, бөлімдеу және бакеттерге бөлу'
description: Бір дұрыс жауабы бар алты сұрақ; дерекқорға қосылу қажет емес. Жібергеннен
  кейін түсіндірмелерді қараңыз.
questions:
- id: same_writes_three_models
  type: single_choice
  objective: Бірдей кірістің Duplicate, Unique және Aggregate Key модельдеріндегі
    нәтижесін болжау.
  prompt: Sequence бағаны жоқ кезде (order_id, amount) өрістерінің (17, 90), (17,
    85) және (23, 12) жолдары осы ретпен, әрқайсысы алдыңғысы аяқталғаннан кейін Duplicate,
    Unique және amount бағаны SUM болатын Aggregate Key кестелеріне жазылады. Әр кестеде
    не сақталады?
  options:
  - id: three_rows_85_175
    text: Duplicate үш жолды сақтайды; 17-тапсырыс Unique кестесінде 85, Aggregate
      кестесінде 175 болады
  - id: all_keep_latest
    text: Үш кестенің бәрі 17-тапсырыстың соңғы 85 сомасын сақтайды, себебі әрқайсысының
      кілті order_id
  - id: duplicate_rejects
    text: Duplicate кестесі 17-нің екінші жолын қабылдамайды; 17-тапсырыс Unique кестесінде
      85, Aggregate кестесінде 175 болады
  - id: unique_keeps_larger
    text: Duplicate үш жолды сақтайды; 17-тапсырыс Unique кестесінде үлкен сома —
      90, Aggregate кестесінде 175 болады
  answer: three_rows_85_175
  explanation: 'Duplicate Key әр жолды сақтайды, Unique Key бірдей кілтті екі жол
    бірінен кейін бірі жазылса, кейінгісін сақтайды, ал SUM қолданатын Aggregate Key
    90 мен 85-ті қосып, 175 береді. Үш модель бір кілтті әртүрлі өңдейді, сондықтан
    бәрі бірдей соңғы соманы сақтай алмайды. Duplicate Key өз кілтін сұрыптау үшін
    қолданады және ештеңені қабылдамай тастамайды. Unique Key үлкен соманы таңдамайды:
    Sequence бағаны болмаса, кейінгі жазу жеңеді.'
- id: model_and_keys
  type: single_choice
  objective: Егжей-тегжейлі жазбалар, ағымдағы күй немесе қосылатын метрикалар үшін
    кілт моделін және кілт бағандарын таңдау.
  prompt: Бақылау тақтасына әр тапсырыстың соңғы күйі, ал аудитке әр бөлек күй өзгерту
    оқиғасы қажет. Қайта әрекеттер бір event_id-ді қайта жіберуі мүмкін. Екі жауапты
    да қай кестелер сақтайды?
  options:
  - id: order_id_and_event_id
    text: Ағымдағы күй үшін order_id кілтімен бір Unique Key кестесі және оқиғалар
      үшін event_id кілтімен екінші кесте
  - id: order_id_for_both
    text: Екеуі үшін де order_id кілтімен бір Unique Key кестесі, себебі әр оқиға
      дәл бір тапсырысқа жатады
  - id: aggregate_by_status
    text: Бақылау тақтасы мен аудиттің екеуі үшін де order_id және status бойынша
      SUM қолданатын Aggregate Key кестесі
  - id: duplicate_for_events
    text: order_id бойынша Unique Key кестесі және әр қайталауды сақтайтын event_id
      бойынша Duplicate Key кестесі
  answer: order_id_and_event_id
  explanation: Ағымдағы күйде әр тапсырысқа бір жол келеді, сондықтан кілті — order_id;
    тарихта әр бөлек оқиғаға бір жол келеді, сондықтан кілті — event_id, ал қайта
    жіберілген оқиға жаңа жол қосудың орнына өзін ауыстырады. Тарих кілтін order_id
    ету әр тапсырыс үшін тек бір оқиға сақтар еді. Күй бойынша қосу күйлерді қосады,
    ал екі сұрақтың ешқайсысы мұны сұрамайды. Duplicate Key кестесі әр қайталауды
    жаңа жол ретінде сақтайды, сондықтан аудит қайта жіберілген оқиғаларды екі рет
    санар еді.
- id: four_design_choices
  type: single_choice
  objective: Бөлімдерді, бакеттерді, сұрыптау кілттерін және бизнестің бірегей кілттерін
    ажырату.
  prompt: Күн бойынша бөлімделген Duplicate Key кестесі HASH(order_id) бойынша бакеттерге
    бөлінген. Қайта әрекет бір тапсырысты екі рет жазды, ал әріптес көшірмені жою
    үшін бакет санын арттыруды ұсынады. Қай талдау дұрыс?
  options:
  - id: neither_removes_duplicates
    text: 'Бөлімдер ауқымды таңдайды, бакеттер жолдарды таратады; екеуі де көшірмені
      жоймайды: оған кілт не ереже қажет'
  - id: more_buckets_deduplicate
    text: Көбірек бакет әр тапсырысты жеке бакетке орналастырады, сондықтан екінші
      көшірме жазылған кезде жоғалады
  - id: sort_key_is_unique
    text: Сұрыптау кілті order_id-ді қазірдің өзінде бірегей етеді, сондықтан көшірме
      тек екі рет көрсетіліп, бір рет сақталады
  - id: partition_by_order_id
    text: Күннің орнына order_id бойынша бөлімдеу әр бөлімде әр тапсырысқа бір жол
      сақтар еді
  answer: neither_removes_duplicates
  explanation: Бөлімдеу жолдың қай ауқымға жататынын, бакеттерге бөлу оны қай tablet
    сақтайтынын анықтайды; екеуі де екі жолдың бір тапсырыс екенін анықтамайды. Сондықтан
    көшірмені алып тастау үшін Unique Key, нұсқалары бар бизнес кілті немесе ереже
    қажет. Көбірек бакет сол жолдарды тек көбірек tablet-ке таратады. Duplicate Key
    кестесінің кілті жолдарды реттеп, екі көшірмені де сақтайды. order_id бойынша
    бөлімдеу де екі көшірмені бір бөлімде сақтар еді.
- id: partition_and_bucket_pruning
  type: single_choice
  objective: EXPLAIN арқылы бөлімдерді оқудан алып тастауды бакеттерді оқудан алып
    тастаудан ажырату.
  prompt: Күн бойынша бөлімделген және HASH(order_id) арқылы әр күнге 4 бакетке бөлінген
    кестеде күн сүзгісінің жоспары partitions=1/2 және tablets=4/4 көрсетеді. Сүзгіге
    order_id = 1 қосу жоспарды tablets=1/4 етіп өзгертеді. Әр сүзгі не істеді?
  options:
  - id: date_partitions_id_bucket
    text: Күн екінші күннің бөлімін оқудан алып тастады; тапсырыс ID-і сол күннің
      төрт бакетінің үшеуін алып тастады
  - id: id_pruned_partitions
    text: Тапсырыс ID-і бөлімдерді алып тастады, ал күн ештеңені алып тастамады, себебі
      күндер хэштелмейді
  - id: both_prune_partitions
    text: Екі сүзгі де бөлімдерді алып тастады; tablets=1/4 оқуға төрт бөлімнің біреуі
      қалғанын білдіреді
  - id: plan_reads_one_row
    text: Күн бір бөлімді алып тастады, ал tablets=1/4 сұрау дәл бір жол оқитынын
      білдіреді
  answer: date_partitions_id_bucket
  explanation: partitions=1/2 күн бойынша бөлімдерді оқудан алып тастауды көрсетеді;
    содан кейін tablets=1/4 қалған бөлімнің tablet-терін санайды және бакеттерге бөлу
    бағанындағы теңдік сүзгісі 1-тапсырыс болуы мүмкін жалғыз бакетті қалдырады. Тапсырыс
    ID-і күнді алып тастай алмайды, себебі кез келген күнде кез келген тапсырыс болуы
    мүмкін. tablets= бөлімдерді емес, tablet-терді санайды. Бір tablet көптеген жол
    сақтайды; жоспар жолдарды санамайды.
- id: merge_on_write
  type: single_choice
  objective: Merge-on-Write Unique Key кестесі үшін не істейтінін түсіндіру.
  prompt: '"enable_unique_key_merge_on_write" = "true" орнатылған Unique Key кестесі
    1-тапсырысты алдымен 2300.00, содан кейін 2250.00 сомасымен қабылдайды. Merge-on-Write
    не істейді?'
  options:
  - id: marks_old_row_on_write
    text: 2250.00 жазылғанда, ол 1-тапсырыстың ескі жолын ауыстырылған деп белгілейді,
      сондықтан сұраулар тек 2250.00 оқиды
  - id: merges_at_query_time
    text: Ол сұрау 1-тапсырысты сұрағанша екі жолды да белгілемей сақтайды, содан
      кейін үлкен соманы қайтарады
  - id: adds_on_write
    text: Ол екі соманы жазылу кезінде қосады, сондықтан кейін 1-тапсырыстың сұрауы
      4550.00 оқиды
  - id: rejects_second_write
    text: Ол екінші жазуды қабылдамайды, себебі Unique Key кестесі әр кілтті өмірлік
      циклі бойы тек бір рет қабылдайды
  answer: marks_old_row_on_write
  explanation: 'Merge-on-Write кілттің соңғы жолын жазу кезінде анықтайды: Doris сол
    кілттің ескі жолын ауыстырылған деп белгілейді, сондықтан сұрау оқу кезінде біріктірмей,
    әр кілттің соңғы жолын оқиды, ал compaction белгіленген жолдарды кейін жояды.
    Merge-on-Write болмаса, Unique Key кестесі оқу кезінде біріктіріп, үлкен соманы
    емес, кейінгі жолды қайтарады. Мәндерді қосу — SUM қолданатын Aggregate Key кестесінің
    жұмысы. Unique Key кестесі кілтті қайта қабылдап, жаңарақ жолды сақтайды.'
- id: smaller_plan_not_speedup
  type: single_choice
  objective: Кішірек жоспарды өлшенген жылдамдаудан ажырату.
  prompt: Күн сүзгісіне order_id = 1 қосу сұрау жоспарын tablets=4/4-тен tablets=1/4-ке
    өзгертеді және екі сұрау да 1-тапсырысты қайтарады. Топ қандай қорытынды жасай
    алады?
  options:
  - id: less_planned_work_measure_speed
    text: Сұрау төрт tablet орнына біреуін оқуды жоспарлайды; жылдамырақ орындала
      ма, оны әлі өлшеу керек
  - id: four_times_faster
    text: Сұрау төрт есе жылдам орындалады, себебі бұрынғы tablet-тердің төрттен бірін
      оқиды
  - id: more_accurate_result
    text: Енді нәтиже дәлірек, себебі аз tablet-те қайталануы мүмкін жолдар азырақ
  - id: table_rebucketed
    text: Сүзгі кестені қайта бакеттерге бөлді, сондықтан кестенің басқа сұраулары
      да енді бір tablet оқиды
  answer: less_planned_work_measure_speed
  explanation: 'Жоспар сұраудың не оқитынын көрсетеді, сондықтан аз tablet азырақ
    жұмысты болжайды; уақыт tablet өлшемдеріне, кэштеуге және тұрақты шығындарға да
    байланысты, оны бірдей деректер мен машинада өлшеу керек. Tablet-тердің төрттен
    бірі уақыттың төрттен бірі емес: он тапсырыста сұраулар шамамен бірдей уақыт алады.
    Артық деректерді оқудан алып тастау нәтижені ешқашан өзгертпеуі керек, сондықтан
    жауап дәлірек болмайды, тек азырақ оқумен алынады. Сүзгі кестеде ештеңені өзгертпейді.'
passing_score_percent: 80
