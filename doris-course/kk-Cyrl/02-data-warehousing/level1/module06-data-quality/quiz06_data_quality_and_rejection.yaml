title: '6-модуль тесті: деректер сапасы және схеманы тексеру'
description: Бір дұрыс жауабы бар алты сұрақ; дерекқорға қосылу қажет емес. Жібергеннен
  кейін түсіндірмелерді қараңыз.
questions:
- id: type_check_or_business_rule
  type: single_choice
  objective: Түр тексерулерін бизнес сапасы ережелерінен ажырату.
  prompt: Жаңа тапсырыста order_amount = -15.00. Мән DECIMAL-ға түрленеді, бірақ осы
    пакет келісімшарты теріс емес соманы талап етеді. Кірісті қалай өңдеу керек?
  options:
  - id: reject_under_amount_rule
    text: Сома ережесі бойынша қабылдамай, бастапқы кірісі мен себебін сақтау
  - id: accept_valid_decimal
    text: Жарамды DECIMAL және баған түріне сай болғандықтан қабылдау
  - id: change_sign
    text: 15.00 ретінде қабылдау, себебі таңба қатесі — дереккөз пішімдеу мәселесі
  - id: drop_silently
    text: Қабылданбаған жол қоймада қалмауы керек болғандықтан, жазбасыз алып тастау
  answer: reject_under_amount_rule
  explanation: Мән түр тексеруінен өтеді, бірақ келісімшарттың бизнес ережесін бұзады,
    сондықтан себебімен қабылданбайды, бастапқы кірісі қадағалауға жарамды күйде қалады.
    Жарамды түр бизнес мағынасы туралы ештеңе айтпайды. Таңбаны өзгерту дереккөз жібермеген
    мәнді ойдан шығарады. Жазбасыз алып тастау қабылдамауды кейін түсіндіру не түзетуді
    мүмкін емес етеді.
- id: stage_raw_text_with_input_id
  type: single_choice
  objective: Әр қабылданбаған жолды дереккөзіне дейін қадағалау үшін бастапқы кірісті
    мәтін ретінде аралық кестеге сақтау.
  prompt: Жүктеуден екі апта кейін қолдау тобы бір кірістің неге қабылданбағанын сұрайды.
    Жүктеудің ErrorURL мерзімі өткен. Қай жобалау әлі жауап береді?
  options:
  - id: raw_text_input_id_reason
    text: input_id-імен мәтін ретінде сақталған бастапқы кіріс және input_id мен себебі
      бар қабылданбағандар кестесі
  - id: typed_staging_table
    text: Жүктеу қате кірісті алғаш келгенде қабылдамай тастауы үшін түрлері қатаң
      берілген аралық кесте
  - id: accepted_table_only
    text: Тек қабылданған кесте, себебі қабылданбаған кіріс анықтама бойынша деректердің
      бөлігі емес
  - id: keep_error_url
    text: Қолдау қажет кезде қайта ашуы үшін жазбадағы ErrorURL көшірмесі
  answer: raw_text_input_id_reason
  explanation: Мәтін бағандары әр кірісті дәл жіберілген күйінде қабылдайды, input_id
    әр келуді анықтайды, ал қабылданбағандар кестесі себебін атайды, сондықтан input_id
    бойынша біріктіру кез келген уақытта жауап береді. Түрлері қатаң берілген аралық
    кесте қате кірісті кіреберісте жоғалтады, түсіндіретін ештеңе қалмайды. Қабылданған
    кестеде қабылданбаған кіріс жоқ. ErrorURL біраз уақыттан кейін Doris жоятын журналға
    сілтейді; көшірілген сілтеме ешқайда апармас еді.
- id: route_with_independent_dimension
  type: single_choice
  objective: Айқын ережелер мен тәуелсіз тұтынушы өлшемін қолданып, қабылданған және
    қабылданбаған жолдарды бағыттау.
  prompt: 50 жаңа тапсырыс кірісінің 2-еуінің тұтынушы ID-і тәуелсіз тұтынушы өлшемінде
    жоқ; басқалары барлық ережеге сай. Тұтынушылар бар болуы керек. Кірістерді қалай
    бағыттау керек?
  options:
  - id: route_48_and_2
    text: Барлық 50 бастапқы кірісті сақтау, 48 қабылданған тапсырыс пен себептері
      бар 2 қабылдамауды жазу
  - id: add_missing_customers
    text: Осы кірістерден 2 тұтынушыны өлшемге қосып, барлық 50 тапсырысты қабылдау
  - id: reject_whole_batch
    text: Екі белгісіз тұтынушы барлық жолды сенімсіз еткендіктен, 50 жолдық бүкіл
      пакетті қабылдамау
  - id: accept_with_null_customer
    text: 50-інің бәрін қабылдап, ереже орындалуы үшін 2 кірістің тұтынушы ID-ін NULL
      ету
  answer: route_48_and_2
  explanation: 'Әр кіріс ережелермен бағытталады: 48-і сәйкес келіп қабылданады, 2-еуі
    тұтынушы ережесінен өтпей, себебімен қабылданбайды, 50-інің бәрі бастапқы кестеде
    қалады. Өлшемді кірістерден жасау әр белгісіз тұтынушыны белгілі етер еді. Бүкіл
    пакетті қабылдамау 2 мәселе үшін 48 дұрыс тапсырысты тастайды. Тұтынушыны NULL
    ету ережеден өту үшін кірісті өзгертіп, мәселені жасырады.'
- id: totals_are_not_details
  type: single_choice
  objective: Кірісті қамтуды, бірегейлікті, сомаларды және әр жолдың нәтижесін бірге
    тексеру.
  prompt: Жаңа қабылданған кестеде дереккөздегідей жалпы сомасы 100 болатын төрт жол
    бар. Тексеруші бір тапсырыс жоқ, екіншісі сол сомамен екі рет жүктелді деп күмәнданады.
    Қандай дәлел мәселені шешеді?
  options:
  - id: compare_ids_and_fields
    text: Дереккөз бен кестенің тапсырыс ID-лері мен өрістерін әр жол бойынша салыстырып,
      әр ID-ді санау
  - id: totals_match_so_fine
    text: 'Қажет емес: жолдар саны мен жалпы сома дереккөзге сәйкес, сондықтан еш
      тапсырыс жоғалуы мүмкін емес'
  - id: recount_rows
    text: Есеп тым ерте болған шығар деп BE келесі есебінен кейін кесте жолдарын қайта
      санау
  - id: compare_averages
    text: Орташа соманы дереккөздің орташасымен салыстыру, себебі қайталану оны өзгертер
      еді
  answer: compare_ids_and_fields
  explanation: Жоқ тапсырыс пен сомасы бірдей қайталанған тапсырыс жолдар саны мен
    жалпы соманы өзгеріссіз қалдырады; тек тапсырыс ID-лері мен өрістерін әр жол бойынша
    салыстыру және әр ID-ді санау оларды табады. Жалпы сомалардың сәйкес келуі — дәлел
    емес, алғашқы тексеру. Қайта санау сол төрт жолды береді. Орташа сомасы бар қайталану
    не бірін-бірі өтейтін екі қате орташа мәнді де өзгеріссіз қалдырады.
- id: break_the_checks_on_purpose
  type: single_choice
  objective: Белгілі қатеде сәтсіз болуын көрсетіп, тексерудің жұмыс істейтінін дәлелдеу.
  prompt: Сынаушы бір бастапқы тапсырыстың көшірмесін қосып, тексерулерді қайта орындайды;
    басқа тексеру оқиға уақыттарын осы пакеттің бекітілген шегімен салыстырады. Қай
    нәтиже тексерулердің топ айтқан мағынаға сай екенін көрсетеді?
  options:
  - id: duplicate_fails_restore_passes
    text: Көшірмеде бірегейлік сәтсіз болып, қалпына келтіруден кейін өтеді; шек өзектілік
      туралы ештеңе айтпайды
  - id: all_checks_pass
    text: Көшірме бар кезде барлық тексеру өтеді, бұл тексерулердің шағын қателерге
      төзімді екенін көрсетеді
  - id: cutoff_proves_freshness
    text: Бірегейлік тексеруі сәтсіз болады, ал бекітілген шек кесте деректерінің
      өзекті екенін көрсетеді
  - id: total_check_fails
    text: Алдымен жалпы сома тексеруі сәтсіз болады, бұл бірегейлік тексеруі қажет
      емес екенін көрсетуге жеткілікті
  answer: duplicate_fails_restore_passes
  explanation: Белгілі қате тексеруді сәтсіз етіп, түзетілген деректер қайта өткізгенде
    оның жұмыс істейтіні көрсетіледі; бекітілген шек бір офлайн пакетті тексереді
    және жұмыс істеп тұрған конвейердің өзектілігін өлшемейді. Белгілі қатемен өтетін
    тексерулер оны таппайды. Өткендегі шек бүгінгі деректер келгенін айта алмайды.
    Бірдей сомалы көшірме жалпы соманы мүлде өзгертпеуі мүмкін, бірегейлік тексеруі
    дәл сол себептен тікелей шақырылады.
- id: schema_change_effects
  type: single_choice
  objective: Схема өзгерісіне дейін және кейін оның әсерін тексеру.
  prompt: Топ күндік тапсырма бағандарды атамай INSERT INTO ... VALUES арқылы жүктейтін
    кестеге NULL қабылдайтын order_channel бағанын қосады. Нені тексеру керек?
  options:
  - id: positional_writes_break
    text: Тапсырма бағандарды атайтынын тексеру, себебі орын бойынша жазу жаңа бағандар
      тізіміне сай келмейді
  - id: metadata_only_no_effect
    text: 'Ештеңе: NULL қабылдайтын баған қосу тек метадеректерді өзгертеді, еш жазуға
      не сұрауға әсер етпейді'
  - id: old_rows_get_values
    text: Doris келесі күндік жүктеуден толтыратын ескі жолдардың order_channel мәндерін
      алатынын тексеру
  - id: rebuild_table_first
    text: Алдымен кесте қайта жасалатынын тексеру, себебі Doris кез келген жаңа баған
      үшін барлық деректер файлдарын қайта жазады
  answer: positional_writes_break
  explanation: Бағандар тізімі жоқ INSERT әр бағанға ретімен мән беруі керек, сондықтан
    өзгерістен кейін тапсырма жазулары енді сай келмейді; бағандарды атау және кейінгі
    SELECT * тексеру дұрыстығын сақтайды. Мән бағанын қосу метадеректердің жеңіл өзгерісі
    болуы мүмкін, бірақ бұл — бағандар тізіміне кім тәуелді екені емес, Doris оны
    қалай сақтайтыны туралы. Ескі жолдарда жаңа баған NULL қалады; еш жүктеу оны толтырмайды.
    Doris файлдарды тек кей түр өзгерістері сияқты ауыр өзгерістерде қайта жазады.
passing_score_percent: 80
