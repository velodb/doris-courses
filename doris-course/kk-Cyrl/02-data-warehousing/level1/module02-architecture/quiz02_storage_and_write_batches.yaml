title: '2-модуль тесті: Doris сақтау архитектурасы және жазу механизмдері'
description: Бір дұрыс жауабы бар алты сұрақ; дерекқорға қосылу қажет емес. Жібергеннен
  кейін түсіндірмелерді қараңыз.
questions:
- id: planning_then_execution
  type: single_choice
  objective: Сұрау жолын қадағалап, FE жоспарлауын және BE орындауын түсіндіру.
  prompt: Тапсырыс сұрауының EXPLAIN командасы жоспар қайтарады, бірақ сұрауды орындау
    Backend (BE) өз tablet-терін сканерлеген кезде қате аяқталады. Бұл Frontend (FE)
    және BE кезеңдері туралы нені көрсетеді?
  options:
  - id: planned_then_failed_on_be
    text: FE сұрауды жоспарлады, ал BE орындауы — әлі де қате аяқталуы мүмкін кейінгі
      кезең
  - id: roles_swapped
    text: BE сұрауды жоспарлады, ал FE сақталған тапсырыс жолдарын сканерлеген кезде
      қате аяқталды
  - id: explain_proves_scans
    text: EXPLAIN жұмыс істеді, демек әр BE сканерлеуі аяқталды және қате тек клиентте
      болуы тиіс
  - id: compaction_before_scan
    text: FE сұрауды жоспарлады, бірақ tablet-терде compaction аяқталмайынша BE сканерлей
      алмайды
  answer: planned_then_failed_on_be
  explanation: FE сұрауды синтаксистік талдап, жоспарлайды, содан кейін BE түйіндері
    жоспардың өз бөліктерін орындайды; жоспар дұрыс болса да, оны BE-де орындау қате
    аяқталуы мүмкін. Жоспарлау — FE жұмысы, сканерлеу — BE жұмысы, керісінше емес.
    EXPLAIN жоспарды орындамай құрады, сондықтан сканерлеулер туралы ештеңені дәлелдемейді.
    Compaction орындалғанына қарамастан сұраулар жарияланған rowset-терді оқиды.
- id: tablets_rowsets_segments
  type: single_choice
  objective: Кесте, бөлім, tablet, rowset және сегмент иерархиясын түсіндіру.
  prompt: Жаңа кестеде үш бөлім, әр бөлімде бес бакет бар, материалданған көрініс
    те, rollup та жоқ. Репликаларды есептемегенде, оператор қандай орналасуды күтуі
    керек?
  options:
  - id: fifteen_tablets
    text: Он бес tablet; әр tablet rowset-терді, ал әр rowset сегмент файлдарын сақтайды
  - id: five_shared_tablets
    text: Үш бөлімге ортақ бес tablet; әр tablet бөлімдердің rowset-терін сақтайды
  - id: three_tablets
    text: Үш tablet, әр бөлімге біреуден; әр бөлімнің бес бакеті — оның репликалары
  - id: fifteen_tablets_one_rowset
    text: Он бес tablet, әрқайсысында бүкіл өмірлік циклі бойы дәл бір rowset және
      бір сегмент файлы бар
  answer: fifteen_tablets
  explanation: Әр бөлімнің әр бакеті — tablet, сондықтан 3 × 5 = 15 tablet; tablet
    жазулар мен compaction нәтижесінде пайда болған rowset-терді, ал rowset сегмент
    файлдарын сақтайды. Бөлімдер ортақ tablet қолданбайды. Бакеттер бөлімді шардтарға
    бөледі; репликалар — tablet көшірмелері, бұл басқа ұғым. Rowset пен сегмент саны
    әр жазу мен compaction сайын өзгереді.
- id: visibility_and_compaction
  type: single_choice
  objective: Жүктелген жолдар қашан көрінетінін және кейін compaction нені өзгертетінін
    түсіндіру.
  prompt: Жүктеу транзакциясы жарияланды және SELECT оның жолдарын қазірдің өзінде
    қайтарады, бірақ tablet-те compaction әлі орындалмады. Бақылау тақтасы бұл жолдарды
    оқымас бұрын compaction-ды күтуі керек пе?
  options:
  - id: published_rows_queryable
    text: 'Жоқ: жарияланған жолдар қазір көрінеді, ал compaction кейін тек олардың
      файлдарын біріктіреді'
  - id: wait_for_merge
    text: 'Иә: compaction жаңа файлдарды ескілерімен біріктіргеннен кейін ғана жолдар
      сенімді болады'
  - id: wait_for_single_rowset
    text: 'Иә: сұрау tablet-ті үйлесімді түрде оқуы үшін онда жалғыз rowset болуы
      керек'
  - id: compaction_changes_results
    text: Жоқ, бірақ compaction rowset-терді біріктіргеннен кейін бақылау тақтасындағы
      сандар өзгереді
  answer: published_rows_queryable
  explanation: Транзакция жарияланғаннан кейін жолдар көрінеді; compaction содан кейін
    rowset-терді фондық режимде біріктіреді және сұрау қайтаратын жолдарды ешқашан
    өзгертпейді. Сұраулар бірнеше rowset-ті қазірдің өзінде дұрыс оқиды, сондықтан
    бірігуді күтудің пайдасы жоқ. Tablet көптеген rowset сақтай алады және бұл сұрау
    нәтижесінің үйлесімділігін бұзбайды. Compaction сұрау нәтижесін емес, жолдардың
    сақталу тәсілін өзгертеді, сондықтан бақылау тақтасындағы сандар өзгермейді.
- id: compare_one_thing_at_a_time
  type: single_choice
  objective: Қалған жағдайларды тұрақты ұстап, пакеттік және жол сайынғы жазуды салыстыру.
  prompt: Топ тапсырыстарды 100 және 10,000 жолдық пакеттермен жүктеуді салыстырады.
    Екі орындаудың нәтижесі бірдей, бірақ екінші орындауда көбірек бакет те қолданылған.
    Уақыттарды қалай түсіндіруі керек?
  options:
  - id: control_then_repeat
    text: Бакеттер санын, деректерді және параметрлерді тұрақты ұстап, екі пакет өлшемін
      қайта салыстыру
  - id: credit_batch_size
    text: Нәтижелер сәйкес келеді, сондықтан уақыттағы кез келген айырмашылық пакет
      өлшемінен болуы тиіс
  - id: shortest_time
    text: Әр орындаудың ең қысқа уақытын алу, бұл бакеттер санының әсерін жояды
  - id: compare_rowset_counts
    text: Екі бакет санын да сақтап, тек әр орындау қалдырған rowset санын салыстыру
  answer: control_then_repeat
  explanation: 'Екі нәрсе қатар өзгерсе, айырмашылықты олардың біреуіне телуге болмайды:
    бакеттер санын, деректерді және параметрлерді тұрақты ұстап, тек пакет өлшемін
    өзгертіңіз. Нәтижелердің сәйкес келуі — жылдамдықтың дәлелі емес, алдын ала шарт.
    Әр орындаудың ең қысқа уақытының өзі екі өзгерістің әсерін араластырады. Бакеттер
    саны жолдардың tablet-терге таралуын өзгертеді, сондықтан екі орындаудың rowset
    сандары да салыстыруға келмейді.'
- id: versions_and_rowsets
  type: single_choice
  objective: Tablet нұсқалары мен rowset-ін оқып, олардың жазу пакеттері мен compaction
    туралы нені көрсететінін түсіндіру.
  prompt: Бір tablet-і бар кестеге бір жолдан он рет жазғаннан кейін SHOW TABLETS
    Version 11 көрсетеді, ал tablet compaction күйінде бір ағымдағы [2-11] rowset-і
    және он ескірген rowset тізілген. Не болды?
  options:
  - id: ten_loads_then_merged
    text: Он жүктеу 2-ден 11-ге дейінгі нұсқаларды жасады, содан кейін compaction
      олардың он rowset-ін біреуіне біріктірді
  - id: eleven_orders
    text: Кестеде әр нұсқаға біреуден он бір тапсырыс бар, ал [2-11] олардың онының
      ID-ін тізеді
  - id: compaction_failed
    text: Tablet-те compaction сәтсіз аяқталды, сондықтан он ескірген rowset-ті тағы
      жүктеу керек
  - id: stale_are_replicas
    text: Ескірген rowset-тер — compaction кезінде сұраулар оқитын tablet-тің он репликасы
  answer: ten_loads_then_merged
  explanation: Бос tablet 1-нұсқадан басталады, әр жүктеу бір нұсқа қосады, сондықтан
    он жүктеу 11-нұсқамен аяқталады; [2-11] — жинақтаушы compaction 2-ден 11-ге дейінгі
    нұсқалардан жасаған rowset, ал он бастапқы rowset BE оларды жойғанға дейін ескірген
    ретінде тізіледі. Нұсқа — тапсырыс емес, жүктеу, ал [2-11] — нұсқалар ауқымы.
    Ескірген rowset-тер сәтсіздікті емес, сәтті compaction-ның біріктірілген кірістерін
    білдіреді. Репликалар — rowset емес, басқа BE түйіндеріндегі tablet көшірмелері.
- id: plan_and_profile
  type: single_choice
  objective: Сұраудың жоспарын көру үшін EXPLAIN, ал сканерлеу не оқығанын көру үшін
    Query Profile қолдану.
  prompt: order_id бойынша сұрыпталған он жолдық кестеде WHERE customer_id = 832 сұрауы
    бір жол қайтарады, ал жоспары 1 tablet-тің 1-еуін оқиды. Оның Query Profile есебінде
    ScanRows 10 және RowsVectorPredFiltered 9 көрсетілген. Бұл нені білдіреді?
  options:
  - id: read_ten_dropped_nine
    text: Сканерлеу он жолдың бәрін оқып, сүзгі тоғызын алып тастады; сұрыптау кілті
      ауқымды тарылта алмады
  - id: index_skipped_nine
    text: Сұрыптау кілтінің индексі тоғыз жолды өткізіп жіберді, сондықтан сканерлеу
      тек қайтарған жолын оқыды
  - id: plan_was_wrong
    text: Жоспар қате болды, себебі бір жол қайтаратын сұрау тек бір жол оқуы керек
      еді
  - id: nine_rows_deleted
    text: Сұрау тоғыз жолды жойды, себебі RowsVectorPredFiltered ол жойған жолдарды
      санайды
  answer: read_ten_dropped_nine
  explanation: 'Жоспар сканерлеудің қай tablet-терді оқитынын, ал Profile не істегенін
    көрсетеді: ScanRows 10 және RowsVectorPredFiltered 9 барлық жол оқылып, сүзгі
    тоғызын алып тастағанын білдіреді, себебі customer_id сұрыптау кілтіне кірмейді.
    Сұрыптау кілтінің индексі өткізіп жіберген жолдар WHERE order_id = 1 жағдайындағыдай
    RowsKeyRangeFiltered ретінде көрінер еді. Жоспар дұрыс болды: бір tablet, ал оның
    барлық жолдарын оқу — осы сүзгінің жұмыс істеу тәсілі. RowsVectorPredFiltered
    кестеден жойылған жолдарды емес, сүзгі нәтижеден алып тастаған жолдарды санайды.'
passing_score_percent: 80
