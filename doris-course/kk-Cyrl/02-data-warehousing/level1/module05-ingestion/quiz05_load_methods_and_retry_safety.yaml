title: '5-модуль тесті: деректерді пакеттік және үздіксіз жүктеу'
description: Бір дұрыс жауабы бар алты сұрақ; дерекқорға қосылу қажет емес. Жібергеннен
  кейін түсіндірмелерді қараңыз.
questions:
- id: choose_a_load_method
  type: single_choice
  objective: Жергілікті файл, объектілік сақтаудағы файлдар, хабарлар ағыны, дерекқор
    өзгерістері немесе көп шағын жазу үшін жүктеу әдісін таңдау.
  prompt: 'Топта үш жаңа дереккөз бар: талдаушы ноутбугіне бір рет экспортталған CSV,
    сақтамас бұрын SQL арқылы қарағысы келетін объектілік сақтаудағы бір айдың Parquet
    файлдары және секундына көп рет бір тапсырыстан жазатын қолданба. Қай жоспар жарайды?'
  options:
  - id: stream_s3_group_commit
    text: CSV үшін Stream Load, Parquet файлдары үшін INSERT INTO SELECT бар S3 кестелік
      функциясы, жеке тапсырыстар үшін Group Commit
  - id: broker_load_for_everything
    text: CSV мен Parquet файлдары үшін Broker Load және қолданба жазатын әр жеке
      тапсырысқа тағы бір Broker Load тапсырмасы
  - id: routine_load_for_files
    text: CSV мен Parquet файлдары үшін Routine Load, себебі тапсырма олардың барысын
      сақтайды; әр тапсырысқа Group Commit-сіз қарапайым Stream Load
  - id: catalog_for_laptop_file
    text: Ноутбуктің CSV және Parquet файлдары үстіндегі External Catalog және әр
      жаңа тапсырысқа бөлек INSERT INTO SELECT операторы
  answer: stream_s3_group_commit
  explanation: Шектеулі жергілікті файлға Stream Load, объектілік сақтаудағы бекітілген
    файлдар жиынына жолдарды INSERT INTO SELECT арқылы сақтамас бұрын қарауға мүмкіндік
    беретін S3 кестелік функциясы, ал көп ұсақ жазуға оларды аз транзакцияға біріктіретін
    Group Commit жарайды. Broker Load ноутбуктегі файлға емес, объектілік сақтаудағы
    ірі файл пакеттеріне жарайды; әр тапсырысқа бір тапсырма әр тапсырыс үшін тапсырма
    шығынын төлетер еді. Routine Load файлдарды емес, Kafka сияқты хабарлар ағынын
    тұтынады. External Catalog ноутбуктегі CSV-ді емес, басқа жүйе кестелерін оқиды,
    ал әр тапсырысқа бір INSERT әр тапсырысқа бір транзакция бекітеді.
- id: map_fields_to_columns
  type: single_choice
  objective: CSV орындарын, Parquet өрістерін және әдепкі мәндерді мақсатты кесте
    бағандарына сәйкестендіру.
  prompt: Тақырып жолы жоқ CSV-де customer_id, order_id, amount тізілген, ал мақсатты
    кесте order_id-ден басталады. Тарихтың Parquet файлында атаулы өрістер бар. Ешбір
    дереккөз жаңа тапсырыстар үшін төлем күйін жібермейді. Қай тәсіл дұрыс жолдарды
    жүктейді?
  options:
  - id: columns_names_and_no_payment_default
    text: CSV бағандарын файл ретімен тізу, Parquet өріс атауларына сүйену және төлем
      күйін әдепкі мәнге емес, дереккөзге қалдыру
  - id: trust_the_table_order
    text: Екі ID де бүтін сан және Doris түрлерді тексеретіндіктен CSV-ді columns
      тізімінсіз жүктеп, Parquet файлына да сол параметрлерді беру
  - id: default_payment_paid
    text: CSV бағандарын тізіп, әр жаңа тапсырыста мән болуы үшін төлем күйі бағанының
      әдепкі мәнін PAID ету
  - id: csv_separator_for_parquet
    text: CSV-ді columns арқылы жүктеп, екі жүктеу сәйкес болуы үшін Parquet файлына
      үтір бөлгішін және сол columns тізімін беру
  answer: columns_names_and_no_payment_default
  explanation: 'columns файл ретіндегі әр CSV мәні толтыратын бағанды атайды, сондықтан
    екі ID дұрыс бағандарға түседі; Parquet өріс атауларын қамтиды, ал әдепкі мән
    жетіспейтін бағанды тек бизнес ережесі оның мағынасын анықтағанда толтыра алады,
    бұл төлемге қатысты орындалмайды. columns болмаса, ауысқан ID-лер бәрібір түрленеді,
    сондықтан түр тексеруі ауысуды таба алмайды. PAID әдепкі мәні еш дереккөз хабарламаған
    төлемді ойдан шығарады. Parquet бөлгіштері бар мәтіндік файл емес: оған бөлгіштер
    мен орындар қолданылмайды.'
- id: judge_a_load
  type: single_choice
  objective: Жүктеуді жауабына және мақсатты кестедегі жолдарға, байланыстар мен сомаларға
    қарап бағалау.
  prompt: 100 жолдық жүктеу HTTP 200 қайтарады, ал JSON ішінде Status Success, NumberLoadedRows
    98, NumberFilteredRows 2 бар. Тапсырма әр тапсырысты жүктеуді талап етеді. Қандай
    қорытынды жасау керек?
  options:
  - id: two_rows_missing
    text: 'Жүктеу толық емес: сүзілген екі жолды және себебін табу, түзету және кестені
      қайта тексеру'
  - id: http_200_is_success
    text: Жүктеу толық, себебі HTTP 200 Doris бүкіл файлды сақтағанын білдіреді
  - id: success_means_all_rows
    text: Жүктеу толық, себебі Status Success файлдың әр жолы кестеге жүктелгенін
      білдіреді
  - id: filtered_rows_are_duplicates
    text: Жүктеу толық, себебі сүзілген жолдар — Doris әдейі алып тастаған қайталанулар
  answer: two_rows_missing
  explanation: Status Success және NumberFilteredRows 2 жүктеу бекітілгенін, бірақ
    өзі қабылдамаған екі жолсыз екенін білдіреді; әр тапсырыс жүктелуі керек болса,
    сол жолдарды жауаптағы ErrorURL арқылы тауып, түзетіңіз және кесте жолдары мен
    сомаларын тексеріңіз. HTTP 200 сұрау қабылданып, жауап берілгенін ғана айтады.
    Қабылданбаған жолдарға рұқсат ететін сүзгі үлесімен алынған Success сол жолдарды
    бәрібір тыс қалдырады. Сүзілген жолдар — қайталанулар емес, түрлендіру сияқты
    тексеруден өтпеген жолдар.
- id: retry_with_the_label
  type: single_choice
  objective: Жүктеу пакетін өз label-імен қауіпсіз қайталау және пакетті қайта жіберуді
    бизнес қайталануларын жоюдан ажырату.
  prompt: Duplicate Key кестесіне он жаңа тапсырыстың Stream Load жүктеуі клиентте
    күту уақытынан асты, сондықтан бекітілгені белгісіз. Қай қайталау кестені дұрыс
    сақтайды?
  options:
  - id: same_label_soon
    text: Бірнеше сағат ішінде сол label-мен қайта жіберу; алғашқы әрекет бекітілсе,
      Doris ештеңе жүктемейді
  - id: new_label_now
    text: Бірден жаңа label-мен қайта жіберу, себебі жүктеуі сәтсіз болуы мүмкін label-ді
      қайта қолдануға болмайды
  - id: same_label_after_days
    text: Doris алғашқы әрекеттің нәтижесін тазалағаннан кейін екі күннен соң сол
      label-мен қайта жіберу
  - id: same_label_group_commit
    text: Doris екі әрекетті бір транзакцияға біріктіруі үшін сол label және Group
      Commit арқылы қайта жіберу
  answer: same_label_soon
  explanation: 'Doris Stream Load label-ін жүктеу аяқталғаннан кейін 12 сағат есте
    сақтайды: сол label-мен қайталау, пакет бекітілсе, Label Already Exists жауабын
    алады, ал бекітілмесе, оны бір рет жүктейді. Жаңа label — жаңа пакет, сондықтан
    алғашқы әрекет бекітілген болса, кестеде он тапсырыс екі рет болар еді. Екі күннен
    кейін label ұмытылады да, сол label пакетті қайта жүктейді. Group Commit сұрауында
    мүлде label болмауы керек. Бұлардың ешқайсысы әртүрлі пакетпен келген бизнес оқиғаларының
    қайталануларын жоймайды: оған бизнес кілттері мен нұсқалар қажет.'
- id: group_commit_visibility
  type: single_choice
  objective: Group Commit көп шағын жүктеуде нені өзгертетінін және олардың жолдары
    қашан көрінетінін түсіндіру.
  prompt: Қолданба group_commit async_mode режимімен және group_commit_interval_ms
    2000 болатын кестеге бір тапсырыстық он Stream Load-ты бірінен кейін бірін жібереді.
    Оныншы жауаптан кейін бірден бақылау тақтасы тапсырыстарды санайды. Топ нені күтуі
    керек?
  options:
  - id: maybe_none_yet
    text: 'Әзірше ешқайсысы болмауы мүмкін: әр жауап жолы алдын ала жазу журналына
      жеткенде, топ бекітілмей тұрып келді'
  - id: all_ten_visible
    text: 'Он жолдың бәрі: әр жауап Success хабарлады және жүктеу жолдары жауап қайтқанда
      көрінеді'
  - id: ten_transactions
    text: Tablet-те әр сұрауға біреуден он транзакция және он жаңа нұсқа бар, бәрі
      жауаптар келмей тұрып көрінді
  - id: needs_commit_statement
    text: Әр сұраулар пакетінен кейін async_mode талап ететін COMMIT операторын біреу
      кесте үшін орындағанша ешқайсысы көрінбейді
  answer: maybe_none_yet
  explanation: 'async_mode кезінде Doris жүктеу жолдары алдын ала жазу журналына түскенде
    жауап беріп, жиналған жүктеулерді топ аралығы не көлемі жеткенде бірге бекітеді,
    сондықтан он жол шамамен 2 секундтан кейін бір транзакция және бір жаңа нұсқамен
    бірге көрінеді. async_mode сәтті жауабы жолдар қазірдің өзінде көрінеді дегенді
    білдірмейді. Он жүктеуге он транзакция және он нұсқа — off_mode нәтижесі. COMMIT
    операторы қатыспайды: топ өздігінен бекітіледі.'
- id: grains_and_definitions
  type: single_choice
  objective: WWI тарихи тапсырыстарының, шот түсімдерінің және модельденген жаңа тапсырыстардың
    түйіршіктілігі мен сома анықтамаларын ажырату.
  prompt: Талдаушы WWI тапсырыс жолдарынан, WWI тұтынушы шоттарының түсімдерінен және
    курстың модельденген тапсырыстарынан бір күндік сату қатарын жасағысы келеді.
    Бір тапсырысқа бірнеше жол жатады, түсімдер тұтынушы шоты бойынша тіркелген, модельденген
    тапсырыстар жасанды түрде жасалған. Қай тәсіл әр дереккөздің мағынасын сақтайды?
  options:
  - id: lines_by_order_receipts_apart
    text: Жолдарды тапсырыстарға қосу, шот түсімдерін тапсырыс сомаларына қоспау және
      модельденген тапсырыстарды солай белгілеу
  - id: count_lines_as_orders
    text: Әр тапсырыс жолын бір тапсырыс деп санап, әр шот түсімін өзі төлеген болуы
      ықтимал тапсырыс күніне қосу
  - id: split_receipts_evenly
    text: Әр шот түсімін тұтынушының сол ай тапсырыстарына тең бөліп, модельденген
      тапсырыстарды араластыру
  - id: drop_simulated_flag
    text: Жолдарды тапсырыстарға қосып, WWI мен модельденген тапсырыстар бір ұзағырақ
      тарих болуы үшін дереккөз бағанын алып тастау
  answer: lines_by_order_receipts_apart
  explanation: Тапсырыс жолдары әр тапсырыс үшін сан мен бірлік бағасының көбейтіндісін
    қосу және бөлек тапсырыс ID-лерін санау арқылы тапсырыстарға айналады; шот түсімдері
    тапсырыстарға емес, шоттарға жатады, сондықтан тапсырысқа жазылмайды; модельденген
    тапсырыстар COURSE_SIMULATION деп белгіленіп қалады. Жолдарды санау тапсырыстарды
    емес, өнімдерді санайды, ал түсімді болжанған тапсырысқа жазу байланысты ойдан
    шығарады. Түсімді тең бөлу де әр тапсырыс төлемін ойдан шығарады. Дереккөзді алып
    тастау жасалған деректерді нақты тарихқа араластырады.
passing_score_percent: 80
