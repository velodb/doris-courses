title: '5-модуль тесті: үздіксіз жүктеу (қосымша оқу)'
description: Қосымша оқу материалы бойынша бір дұрыс жауабы бар алты сұрақ; дерекқорға
  қосылу қажет емес. Жібергеннен кейін түсіндірмелерді қараңыз.
questions:
- id: progress_or_version
  type: single_choice
  objective: Үздіксіз жүктеу тапсырмасы неге өз барысын сақтайтынын және оның бизнес
    нұсқасынан айырмасын түсіндіру.
  prompt: Routine Load тапсырмасы бір Kafka бөлімінен тапсырыс оқиғаларын оқиды. 120-offset
    кезінде 701-тапсырыстың 4-нұсқадағы DELIVERED күйін, 121-offset кезінде сол тапсырыстың
    кешіккен 2-нұсқадағы PAID оқиғасын жүктейді. Әр сан нені шешуі керек?
  options:
  - id: offsets_resume_versions_decide
    text: Offset-тер тапсырма қайдан жалғасатынын шешеді; нұсқалар 701-тапсырысты
      DELIVERED күйінде сақтайды
  - id: later_offset_wins
    text: 'Кейінгі offset шешеді: тапсырма сол оқиғаны соңғы оқығандықтан, 701-тапсырыс
      PAID болады'
  - id: version_is_the_resume_point
    text: Жоғары нұсқа қайта іске қосудан кейін тапсырма қайдан жалғасатынын шешеді,
      бұл — 4-offset
  - id: offset_orders_partitions
    text: Offset-тер бұл оқиғаларды topic-тің барлық басқа бөлімдеріндегі оқиғаларға
      қатысты реттейді
  answer: offsets_resume_versions_decide
  explanation: 'Offset — ағындағы орын: тапсырманың кідірістен не қайта іске қосудан
    кейін қайдан жалғасатынын көрсететін барысы. Бизнес нұсқасы тапсырыстың қай күйі
    жаңарақ екенін көрсетеді, сондықтан кешіккен PAID оқиғасы DELIVERED күйін кері
    өзгертпеуі керек. Оқиғаның кейін оқылуы оны жаңарақ етпейді. Нұсқа Kafka ішіндегі
    орын емес. Offset-тер бір бөлім ішінде саналады және басқа бөлімдердегі оқиғалардың
    реті туралы ештеңе айтпайды.'
- id: pause_resume_or_stop
  type: single_choice
  objective: Routine Load тапсырмасының күйі мен барысын оқып, кідірту, жалғастыру
    және тоқтатудың бірін таңдау.
  prompt: Мақсатты кесте тексеріліп жатқанда Routine Load тапсырмасы бір сағат жүктемеуі
    керек, содан кейін еш хабарды екі рет жүктемей жалғасуы керек. Топ не орындауы
    керек?
  options:
  - id: pause_then_resume
    text: Қазір PAUSE ROUTINE LOAD, бір сағаттан кейін RESUME ROUTINE LOAD орындау;
      тапсырма барысын сақтайды
  - id: stop_then_recreate
    text: Қазір STOP ROUTINE LOAD, бір сағаттан кейін сол тапсырманы OFFSET_BEGINNING
      арқылы қайта жасау
  - id: stop_then_resume
    text: Қазір STOP ROUTINE LOAD, бір сағаттан кейін барыстан жалғастырып оқитын
      RESUME ROUTINE LOAD орындау
  - id: pause_then_recreate
    text: Қазір PAUSE ROUTINE LOAD, бір сағаттан кейін тапсырманы жойып, OFFSET_END
      арқылы қайта жасау
  answer: pause_then_resume
  explanation: 'Кідіртілген тапсырма барысын сақтайды, RESUME содан жалғасады, сондықтан
    хабар өткізіліп жіберілмейді де, екі рет жүктелмейді де. Қайта жасалған тапсырма
    бапталған offset-терден басталады: OFFSET_BEGINNING ескі хабарларды қайта жүктейді.
    Тоқтатылған тапсырма біржола аяқталады, оны жалғастыру мүмкін емес. OFFSET_END
    арқылы қайта жасау сол сағатта келген әр хабарды өткізіп жібереді.'
- id: what_a_savepoint_keeps
  type: single_choice
  objective: CDC конвейері snapshot-тан инкременттік өзгерістерге қалай өтетінін және
    checkpoint не savepoint нені сақтайтынын түсіндіру.
  prompt: MySQL кестесінің snapshot-ынан басталған Flink CDC тапсырмасы MySQL өзгеріп
    жатқанда savepoint-пен тоқтатылып, бір сағаттан кейін содан қалпына келтіріледі.
    Бос аралықсыз не қайталаусыз қуып жетуге не мүмкіндік береді?
  options:
  - id: position_state_and_binlog
    text: Savepoint binlog орны мен оператор күйі және өзгерістерді әлі сақтайтын
      binlog
  - id: snapshot_again
    text: Қалпына келтіруде қайта оқылатын жаңа кесте snapshot-ы, Doris одан әр кілттің
      ең жаңа жолын сақтайды
  - id: master_status
    text: MySQL ішіндегі SHOW MASTER STATUS, ол тапсырма тоқтағанға дейін қанша оқығанын
      көрсетеді
  - id: latest_update_time
    text: Doris кестесіндегі соңғы жаңарту уақыты, ол қай binlog оқиғалары жаңа екенін
      көрсетеді
  answer: position_state_and_binlog
  explanation: 'Savepoint тапсырманың binlog ішінде қайда болғанын және операторларының
    күйін тіркейді, сондықтан қалпына келген тапсырма дәл сол жерден оқуды жалғастырады;
    binlog-та сол өзгерістер әлі болуы қажет. Жаңа snapshot аралықта жасалған жоюларды
    қайтара алмайды. SHOW MASTER STATUS оқырман қанша оқығанын емес, MySQL қанша жазғанын
    көрсетеді. Мақсатты кестедегі уақыт binlog орнын анықтамайды: өзгерістер бір секундта
    болуы мүмкін, жойылған жолдарда уақыт қалмайды.'
- id: where_a_new_job_starts
  type: single_choice
  objective: 'Жаңа үздіксіз тапсырма оқуды қайдан бастайтынын таңдау: басынан, қазіргі
    сәттен не сақталған орыннан.'
  prompt: Жаңа Doris кестесінде MySQL кестесіндегі бүгін бар әр тапсырыс және кейінгі
    әр өзгеріс болуы керек. Жаңа Flink CDC тапсырмасына қай бастау жарайды?
  options:
  - id: initial_snapshot_then_binlog
    text: 'scan.startup.mode = initial: бар жолдардың snapshot-ы, содан кейін binlog
      өзгерістері'
  - id: latest_offset
    text: 'scan.startup.mode = latest-offset: тапсырма басталғаннан кейінгі binlog-тан
      оқылатын өзгерістер'
  - id: timestamp_of_oldest_order
    text: scan.startup.mode = timestamp, MySQL кестесіндегі ең ескі тапсырыстың жасалу
      уақытына орнатылған
  - id: export_then_latest_offset
    text: Бүгін жүктелген бір реттік экспорт, содан кейін экспорттан бір сағат кейін
      latest-offset режимінде басталатын жаңа тапсырма
  answer: initial_snapshot_then_binlog
  explanation: initial бар жолдарды оқып, содан кейін binlog-қа өтеді, сондықтан кесте
    бар деректердің бәрін және кейінгі әр өзгерісті алады. latest-offset басталғаннан
    кейін өзгермеген әр жолды тыс қалдырады. timestamp режимі тек binlog оқиды, ол
    ең ескі тапсырысқа сирек жетеді және snapshot-ты өткізіп жібереді. Экспорттан
    бір сағат кейін latest-offset бастау сол сағаттағы әр өзгерісті жоғалтады.
- id: deletes_reach_doris
  type: single_choice
  objective: Бастапқы дерекқордағы жою Doris Unique Key кестесіне қалай жететінін
    түсіндіру.
  prompt: MySQL ішінде тапсырыс жойылды. Flink CDC тапсырмасы кестені Doris Unique
    Key кестесіне жазады. Тапсырыс Doris-тен қашан жоғалады?
  options:
  - id: connector_sends_delete
    text: sink.enable-delete қосылғанда коннектор оны жоюға белгіленген жол ретінде
      жіберген кезде
  - id: nightly_cleanup
    text: 'Тапсырма арқылы емес: ол енгізу мен жаңартуды өткізеді, ал түнгі тазалау
      жоюларды алып тастайды'
  - id: next_snapshot
    text: Әдепкіде күніне бір рет бүкіл MySQL кестесін қайта оқитын тапсырманың келесі
      snapshot-ында
  - id: compaction_removes_keys
    text: Compaction орындалғанда, себебі compaction бастапқы кестеде жоқ кілттерді
      алып тастайды
  answer: connector_sends_delete
  explanation: Binlog жоюды тіркейді, CDC дереккөзі оны өткізеді, sink.enable-delete
    қосылған Doris коннекторы жоюға белгіленген жол ретінде жазады, сондықтан Unique
    Key кестесі кілтті алып тастайды. Жоюлар бөлек тазалау емес, өзгерістер ағынының
    бөлігі. CDC тапсырмасы snapshot-ты басында бір рет оқиды. Compaction файлдарды
    қайта ұйымдастырады және дереккөзде қандай кілт барын ешқашан шешпейді.
- id: files_found_by_name
  type: single_choice
  objective: Үздіксіз файл тапсырмасы жаңа файлдарды қалай табатынын және атауы ескі
    ретпен келген файлды неге өткізіп жіберетінін түсіндіру.
  prompt: Үздіксіз файл тапсырмасы orders-007.parquet жүктеді. Содан кейін orders-006.parquet
    кешігіп, одан соң orders-008.parquet келеді. Тапсырма нені жүктейді?
  options:
  - id: only_008
    text: 'Тек orders-008: атауы тапсырма барысынан бұрын тұрған файл өткізіп жіберіледі'
  - id: both_by_arrival
    text: Екеуін де келу ретімен, себебі тапсырма кез келген жаңа файлды бақылайды
  - id: only_006
    text: Тек orders-006, себебі тапсырма алдымен жіберіп алған атаулар үшін артқа
      оралады
  - id: neither_without_insert
    text: Біреу тапсырманың INSERT INTO SELECT операторын қайта орындағанша ешқайсысын
  answer: only_008
  explanation: 'Тапсырма жаңа файлдарды атауымен табады: атауы соңғы жүктеген файлдан
    кейін сұрыпталса, файл жаңа, сондықтан orders-008 жүктеледі, orders-006 өткізіліп
    жіберіліп, бөлек жүктеуді қажет етеді. Келу уақыты оған маңызды емес. Ол бос орындарды
    іздеп артқа қарамайды. Тапсырма өз INSERT INTO SELECT операторын үздіксіз өзі
    орындайды.'
passing_score_percent: 80
