title: '4-модуль тесті: сыртқы деректерді сұрау және деректер көлі кестелерін біріктіру'
description: Бір дұрыс жауабы бар алты сұрақ; дерекқорға қосылу қажет емес. Жібергеннен
  кейін түсіндірмелерді қараңыз.
questions:
- id: files_tables_catalogs
  type: single_choice
  objective: Doris ішкі кестелерін, Parquet файлдарын, Iceberg кестелерін және External
    Catalog-тарды ажырату.
  prompt: Әріптес объектілік сақтаудан Parquet файлдарын тауып, олар қазірдің өзінде
    Iceberg кестесін құрайды және External Catalog пайда болғанда Doris оны сақтайды
    деп ойлайды. Мұны қай ескерту түзетеді?
  options:
  - id: format_table_entry
    text: Parquet — файл пішімі, Iceberg файлдар үстіне метадеректер қосады, Catalog
      тек Doris-ке қатынау береді
  - id: parquet_is_iceberg
    text: Parquet файлдарының кез келген каталогы — Iceberg кестесі, ал Catalog оны
      Doris сақтауына көшіреді
  - id: catalog_converts_files
    text: Catalog жасау файлдарды Iceberg кестесіне айналдырады, содан кейін Doris
      оны өз кестесі ретінде сақтайды
  - id: internal_after_query
    text: Файлдар қазірдің өзінде кесте, ал Catalog арқылы алғашқы сұрау оны ішкі
      кестеге айналдырады
  answer: format_table_entry
  explanation: Parquet файлы бағандық деректерді сақтайды; Iceberg кестесі — сондай
    файлдарды тізетін метадеректер мен snapshot-тар; External Catalog — Doris-тің
    басқа жүйе кестелеріне кіретін нүктесі және ештеңе көшірмейді. Iceberg метадеректері
    жоқ файлдар, пішімі қандай болса да, Iceberg кестесі емес. Catalog бар метадеректерді
    оқиды; файлдардан кесте жасамайды. Catalog арқылы сұрау Doris-те ештеңе сақтамайды;
    жүктеу сақтайды.
- id: catalog_database_table
  type: single_choice
  objective: Деректер көлі кестесін Catalog арқылы тауып, catalog.database.table түрінде
    атау.
  prompt: Екі External Catalog, lake_prod және lake_test, екеуінде де reporting.orders
    бар. Сеанстың ағымдағы Catalog-ы — internal, ал есеп өндірістік кестені оқуы керек.
    Қай атау оны таңдайды?
  options:
  - id: three_part_name
    text: 'lake_prod.reporting.orders: Catalog, дерекқор және кесте'
  - id: two_part_name
    text: reporting.orders, Doris оны өзі білетін әр Catalog-тан іздейді
  - id: file_path_name
    text: s3://warehouse/reporting/orders, кесте деректер файлдарының орны
  - id: internal_name
    text: internal.reporting.orders, себебі internal — сеанстың ағымдағы Catalog-ы
  answer: three_part_name
  explanation: 'Басқа Catalog-тағы кестенің үш бөлікті атауы бар: catalog, database,
    table, сондықтан lake_prod.reporting.orders өндірістік көшірмені таңдайды. Екі
    бөлікті атау әр Catalog-тан ізделмейді, ағымдағы Catalog-та, мұнда internal ішінде
    шешіледі. Файл орны кесте атауы емес, ал файлдарды сұрау кесте метадеректерін
    айналып өтер еді. internal деректер көлінің емес, Doris-тің өз кестелерін қамтиды.'
- id: snapshots_and_files
  type: single_choice
  objective: Iceberg кестесінің snapshot-тары мен файлдарын оқып, кесте сұрауы қай
    файлдарды оқитынын түсіндіру.
  prompt: Iceberg кестесінің $snapshots тізімінде алдымен append, содан кейін барлық
    жолын ауыстырған overwrite бар; $files бір деректер файлын тізеді. Catalog арқылы
    кесте сұрауы нені оқиды?
  options:
  - id: current_snapshot_files
    text: Ағымдағы snapshot деректер файлын, яғни $files тізіміндегі файлды
  - id: every_file_ever
    text: Кестеде болған барлық деректер файлдарын, екі snapshot-тың екеуін бірге
  - id: first_snapshot
    text: Бірінші snapshot файлдарын, себебі кесте сол файлдармен жасалған
  - id: whole_directory
    text: Объектілік сақтаудағы кесте каталогында бар кез келген ескі не жаңа файлдарды
  answer: current_snapshot_files
  explanation: Snapshot сол сәтте кестені құрайтын файлдарды тізеді, ал сұрау ағымдағы
    snapshot файлдарын, яғни $files тізіміндегілерді оқиды. Ескі snapshot файлы тазаланғанға
    дейін объектілік сақтауда қалады, бірақ енді кестенің бөлігі емес. Қайта жазу
    бірінші snapshot-ты ауыстырды. Кестеге қай файлдар жататынын каталог мазмұны емес,
    Iceberg метадеректері анықтайды.
- id: query_in_place_or_load
  type: single_choice
  objective: Сыртқы деректерді орнында сұрау мен ішкі кестеге жүктеудің бірін таңдау.
  prompt: Тарихи тапсырыстар деректер көлінде. Талдаушы сұрақты алғаш зерттейді; кейін
    күндік есеп сол тарихты күніне көп рет оқиды. Қандай тәсіл орынды?
  options:
  - id: explore_then_load
    text: Алдымен Catalog арқылы зерттеу, содан кейін есеп оқитын деректерді жүктеп,
      жаңарту тәсілін жоспарлау
  - id: always_load_first
    text: Көл сұраулары біріктіре алмайтындықтан, алғашқы сұраққа дейін бүкіл тарихты
      Doris-ке жүктеу
  - id: never_load
    text: Екеуі үшін де көлді орнында сұрау, себебі жүктеу көл өзгерістеріне ілесе
      береді
  - id: load_then_stop_lake
    text: Бір рет жүктеп, деректер көлі кестелерін жою, себебі енді Doris барлық болашақ
      өзгерістерді де сақтайды
  answer: explore_then_load
  explanation: Орнында сұрау көшірме қажет етпейді және зерттеуге жарайды; сол деректерді
    қайта-қайта оқитын есеп ішкі кестеден пайда көре алады, ал ол көшірмеге жаңарту
    жоспары қажет, себебі жүктеу бір сәтті көшіреді. Деректер көлі кестелерін Doris
    кестелерімен біріктіруге болады, сондықтан зерттеуге дейін жүктеуге ештеңе мәжбүрлемейді.
    Жүктеу көлдегі кейінгі өзгерістерге ілеспейді. Көлді жою басқа жүйелер әлі жазатын
    тарихты жоғалтар еді.
- id: s3_function_and_load
  type: single_choice
  objective: Объектілік сақтаудағы файлдарды S3 кестелік функциясымен оқып, INSERT
    INTO SELECT арқылы жүктеу.
  prompt: Өткен ай тапсырыстарының үш Parquet файлы объектілік сақтауда, енді жаңасы
    қосылмайды. Топ алдымен оларды SQL арқылы қарап, содан кейін жолдарды Doris-те
    сақтағысы келеді. Қай тәсіл жарайды?
  options:
  - id: s3_select_then_insert
    text: Оларды S3 кестелік функциясымен сұрап, содан кейін ішкі кестеге INSERT INTO
      және функциядан SELECT орындау
  - id: iceberg_catalog_over_files
    text: Бакет үстінде Iceberg Catalog жасау, себебі Parquet файлдарының кез келген
      жиыны — Iceberg кестесі
  - id: routine_load_bucket
    text: Doris үш файл үшін бакетті қайта-қайта тексеріп отыруы үшін онда Routine
      Load тапсырмасын жасау
  - id: select_stores_rows
    text: Тек S3 кестелік функциясында SELECT орындау; сұрау оқыған жолдарды Doris-те
      сақтайды
  answer: s3_select_then_insert
  explanation: S3 кестелік функциясы дәл берілген файлдарды оқиды, сондықтан топ алдымен
    қарай алады, ал сол функциядан INSERT INTO ... SELECT орындау жолдарды ішкі кестеде
    сақтайды. Iceberg метадеректері жоқ файлдар Iceberg кестесі емес. Routine Load
    файлдарды емес, Kafka сияқты хабарлар ағынын тұтынады. SELECT жолдарды қайтарады
    және ештеңе сақтамайды.
- id: join_fanout_and_missing
  type: single_choice
  objective: Біріктіруге дейінгі және кейінгі нәтижелерді салыстырып, өлшем кестесіндегі
    қайталанған не жетіспейтін жолдарды табу.
  prompt: Тұтынушы кестесімен LEFT JOIN жасағаннан кейін көлдегі 100 тапсырыс 103
    жолға айналып, жалпы сома өседі. Топ келесіде не істеуі керек?
  options:
  - id: check_join_key_matches
    text: Бір кілтке бірнеше жолы бар тұтынушыларды іздеп, солар көбейткен тапсырыстарды
      тексеру
  - id: switch_to_inner_join
    text: Оның орнына INNER JOIN қолдану, ол әр тапсырысты тек бір рет сақтап, жалпы
      соманы бастапқы мәнде қалдырады
  - id: drop_customers_and_reload
    text: Барлық көл тапсырыстарын жойып, қайта жүктеу, себебі артық жолдар деректер
      көлі кестесінен шыққан
  - id: accept_new_total
    text: Үлкен жалпы соманы қабылдау, себебі LEFT JOIN әр тапсырысты сақтайды, сондықтан
      соманы асыра көрсете алмайды
  answer: check_join_key_matches
  explanation: 'Біріктіруден кейін жолдар тапсырыстардан көп болса, кей тапсырыстар
    бірнеше өлшем жолына сәйкес келген: қайталанған тұтынушы кілттерін және солар
    көбейткен тапсырыстарды табыңыз. INNER JOIN сол жолдарды да көбейтеді, әрі тұтынушысы
    жоқ тапсырыстарды алып тастайды. Артық жолдар деректер көлі кестесінен емес, өлшеммен
    біріктіруден шықты. LEFT JOIN әр тапсырысты сақтайды, бірақ бірнеше жолға сәйкес
    келген тапсырысты бәрібір көбейтеді.'
passing_score_percent: 80
