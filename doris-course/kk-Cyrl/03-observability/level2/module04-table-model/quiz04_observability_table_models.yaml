title: '4-модуль тесті: Жүйені бақылау деректерінің кесте модельдері'
description: Алты сұрақ кілті ортақ жолдарға не болатынына қарай модель таңдай, бастапқы
  телеметрияны сақтай, қорытынды түйіршіктілігін таңдап, біріктірулерін болжай, тұрақты
  ескерту сәйкестендіргішін құра және UNIQUE кестесін оқи алатыныңызды тексереді.
questions:
- id: choose_model_for_recount
  type: single_choice
  objective: Кілті ортақ жолдарға не болуы керегіне қарай DUPLICATE, AGGREGATE не
    UNIQUE таңдау.
  prompt: Әр 10 минут сайын тапсырма соңғы 10 минуттың әрқайсысына әр сервис жұбының
    шақыруларын санайды. Демек әр орындалу алдыңғы орындалу басталған минутты екінші
    рет, енді толық санымен жазады. Қай модель минут пен сервис жұбына бір дұрыс санақ
    сақтайды?
  options:
  - id: unique_latest
    text: 'Минут пен екі сервис бойынша UNIQUE: кейінгі толық санақ ішінара санақты
      алмастырады'
  - id: aggregate_sum
    text: 'SUM санағы бар AGGREGATE: сол минуттың екі санағы бір жолға қосылады'
  - id: duplicate_both
    text: 'DUPLICATE: екі санақ та сақталып, әр сұрау үлкенін алады'
  - id: aggregate_min
    text: 'MIN санағы бар AGGREGATE: алғашқы орындалу санағы сақталып, кейінгілері
      ештеңе өзгертпейді'
  answer: unique_latest
  explanation: 'Сондықтан экспорттаушының otel_traces_graph кестесі UNIQUE: кілті
    бірдей жолдар бірін-бірі алмастырады, бүкіл минутты көрген орындалу соңынан жазады.
    SUM ішінара санақты толық санаққа қосып, минутты артық санар еді. DUPLICATE екі
    жолды сақтап, әр сұрау біреуін таңдауы керек болар еді. MIN тым аз ішінара санақты
    қалдырар еді.'
- id: keep_spans_with_one_key
  type: single_choice
  objective: Бастапқы журналдар, span-дар мен метрика нүктелері неге DUPLICATE кестесіне
    жататынын түсіндіру.
  prompt: 'Кілті service_name және timestamp болатын otel_traces ішінде он екі frontend
    span-ының кілті ортақ: бір миллисекундта басталған, он екі бөлек span ID-і бар.
    Кілті дәл сондай UNIQUE кестесі олармен не істер еді?'
  options:
  - id: keep_one
    text: Он екінің біреуін сақтап, бөлек оқиғалар болып табылатын қалған он бірін
      жоғалтады
  - id: keep_all_unique
    text: Он екінің бәрін сақтайды, өйткені UNIQUE тек кілтті емес, жолдың әр бағанын
      салыстырады
  - id: reject_load
    text: Бүкіл жүктеуді қабылдамайды, өйткені UNIQUE бұрыннан бар кілтті жолдардан
      бас тартады
  - id: merge_spans
    text: Он екіні мән бағанында барлық он екі span ID-і тізілген бір жолға біріктіреді
  answer: keep_one
  explanation: 'UNIQUE әр кілтке соңғы жүктелген бір жолды сақтайды; сондықтан әрқайсысы
    өз span ID-і бар бөлек оқиға болса да, он бір span жоғалады. Сондықтан бастапқы
    телеметрия әр жолды сақтап, кілтті тек сұрыптауға қолданатын DUPLICATE пайдаланады.
    UNIQUE бүкіл жолды емес, кілт бағандарын салыстырады; жүктеуді қабылдамай тастамай,
    жолдарды алмастырады; еш модель біріктірілген жол мәндерін тізімдемейді: AGGREGATE
    оларды мән бағандарының функцияларымен біріктіреді.'
- id: choose_summary_grain
  type: single_choice
  objective: AGGREGATE кестесінің кілтін жауап беретін сұрақтарының түйіршіктілігіне
    сай таңдау.
  prompt: Бақылау тақтасы әр сервистің минуттық сұраулары мен сәтсіз сұрауларын көрсетеді.
    Қай кілт SUM бағандары бар AGGREGATE кестесіне сервис пен минутқа бір жол береді?
  options:
  - id: minute_and_service
    text: Әр сұрау аяқталған минут және service_name
  - id: span_timestamp
    text: Әр span-ның микросекундқа дейінгі timestamp мәні және service_name
  - id: trace_and_service
    text: 'trace_id және service_name: әр сұрау өз жолын сақтайды'
  - id: service_only
    text: Тек service_name, ал әр сұраудың минуты SUM бағанында
  answer: minute_and_service
  explanation: 'Кілт — түйіршіктілік: минуты мен сервисі бірдей жолдар SUM бағандарында
    санақтары бар бір жолға бірігеді; әр сұрауды аяқталған минутта санау оны Doris-ке
    жеткеннен кейін санайды. Timestamp кілтте болса, тек бір микросекунд span-дары
    бірігіп, кесте otel_traces сияқты үлкен болады. Trace ID кілтте болса, әр сұрауға
    жеке жол қалады — бұл қорытынды емес. Тек service_name болса, сервистің барлық
    минуты бір жолға бірігеді, минуттарды қосудың мәні жоқ.'
- id: predict_repeated_load
  type: single_choice
  objective: Қабаттасқан не қайталанған жүктеулерден кейінгі AGGREGATE жолдарын болжау.
  prompt: requests_per_minute кілті — (request_minute, service_name), бағаны — requests
    BIGINT SUM. Бір INSERT cart сервисінің 10:05 уақытындағы 4 сұрауын, екіншісі тағы
    7 жүктейді. Қателесіп екінші INSERT қайта орындалды. Кестеде cart үшін 10:05 уақытында
    не бар?
  options:
  - id: eighteen
    text: requests = 18, яғни 4 + 7 + 7 болатын бір жол
  - id: eleven
    text: requests = 11 болатын бір жол, өйткені Doris қайталанған INSERT-ті өткізіп
      жібереді
  - id: three_rows
    text: Үш жол, әр INSERT-ке бірден, 4, 7 және 7 сұраумен
  - id: seven
    text: requests = 7, соңғы INSERT мәні болатын бір жол
  answer: eighteen
  explanation: 'SUM кілті бірдей әр жолдың мәнін қосады, AGGREGATE қайталанған жолды
    жаңасынан ажырата алмайды: қайталанған INSERT еш қатесіз тағы 7 қосады. Doris
    INSERT алдыңғысын қайталайтынын анықтамайды, сондықтан тапсырма әр бастапқы жолды
    дәл бір рет жүктеуі керек. Кілті бірдей жолдар бір жолға бірігеді, сондықтан үш
    жол болмайды; соңғы мәнді сақтау — SUM емес, UNIQUE не REPLACE бағанының әрекеті.'
- id: stable_alert_identity
  type: single_choice
  objective: Қатенің әр қайталануында өзгермейтін ескерту сәйкестендіргішін құру.
  prompt: recommendation жалауша ағыны әр 10 минутта DEADLINE_EXCEEDED болып сәтсіз
    аяқталады, әр күй хабарында ақау уақыты бар. Қай ескерту сәйкестендіргіші осы
    ақаулардың бәріне error_alerts ішінде күніне бір жол береді?
  options:
  - id: normalized_hash
    text: Сервистің, span атауының және әр саны 0-ге алмастырылған хабардың MD5 хеші
  - id: message_hash
    text: Сервистің, span атауының және span дәл жазған, сандары да сақталған хабардың
      MD5 хеші
  - id: span_id
    text: Әр ақауды күмәнсіз анықтайтын әр қате span-ының span ID-і
  - id: trace_hash
    text: 'Трасса ID-і мен хабардың MD5 хеші: әр сұраудың қателері ортақ жол алады'
  answer: normalized_hash
  explanation: Сәйкестендіргіш оқиғалар арасында өзгеретінді елемеуі керек. Хабардағы
    уақыт әр жолы өзгереді, сондықтан тіркелген хабарды хештеу әр ақауға жаңа сәйкестендіргіш
    пен жаңа ескерту береді. Сандарды алмастыру мәселені атайтын сөздерді сақтайды.
    Span ID-і мен трасса ID-і әдейі әр ақауда бөлек болады, сондықтан екеуінің кез
    келгені әр ақауға жеке ескерту жасайды.
- id: read_one_alert_row
  type: single_choice
  objective: UNIQUE қай жолды сақтайтынын және бір жол қайталанулар туралы нені айтатынын
    болжау.
  prompt: error_alerts кілті — (alert_date, alert_hash), sequence бағаны жоқ. Төлем
    ақауының ескертуінде ашық бір жол бар. Тапсырма оны resolved деп қайта жазады;
    бір минуттан кейін басқа тапсырма бүгінгі барлық қате span-дарын open деп жүктейді.
    Кесте не көрсетеді?
  options:
  - id: open_one_row
    text: Соңғы жүктеу сол болғандықтан қайта ашық бір жол; ол қатенің қаншалықты
      жиі болғанын айтпайды
  - id: resolved_kept
    text: Әлі шешілген бір жол, өйткені ескі қателердің кейінгі жүктеуі шешілген ескертуді
      қайта аша алмайды
  - id: two_rows
    text: Бірі ашық, бірі шешілген екі жол; бірге қате қайталануларын санайды
  - id: row_per_span
    text: Күннің әр қате span-ына бір ашық жол, өйткені әр span жаңа жол ретінде жүктеледі
  answer: open_one_row
  explanation: 'Sequence бағанынсыз UNIQUE соңғы жүктелген жолды сақтайды, сондықтан
    ашық жолдардың кеш жүктеуі шешілгенін алмастырады. Соңғы қате уақыты сияқты sequence
    бағаны шешілген жолды жаңарақ қате келгенше сақтар еді. UNIQUE ішінде кілті бірдей
    жолдар қатар тұрмайды: екі жол да, әр span-ға бір жол да жоқ; жалғыз жол — ағымдағы
    күй. Payment ескертуінде бір жол бар, ал otel_traces ішінде әр сәтсіз тапсырысқа
    қате span-ы бар.'
passing_score_percent: 80
