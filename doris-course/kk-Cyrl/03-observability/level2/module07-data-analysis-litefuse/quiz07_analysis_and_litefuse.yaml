title: '7-модуль тесті: Трассаларды талдау және Litefuse'
description: Алты сұрақ операциялық сәтсіздік үлесі мен кідірісті өлшей, процентильдерді
  түсіне, ақау бастауын таба, терезелік функцияларды қолдана және LLM трассаларын
  түсіндіріп, Litefuse пен Doris-тен таба алатыныңызды тексереді.
questions:
- id: break_down_by_operation
  type: single_choice
  objective: Сервер span-дарынан әр операцияның сәтсіздік үлесі мен кідірісін есептеу.
  prompt: Төлем ақауы басталғалы frontend-proxy ingress ішінде 75,022 сұраудың 30-ы
    сәтсіз, үлесі 0.0%; checkout PlaceOrder ішінде 57-нің 31-і сәтсіз. Қай қорытынды
    дұрыс?
  options:
  - id: per_operation
    text: 'Үлестерді операция бойынша бағалау керек: шлюз тапсырыстардың жартысына
      жуығы сәтсіз екенін жасырады'
  - id: store_healthy
    text: Дүкен сау, өйткені әр сұрауды көретін шлюз дерлік ешқашан сәтсіз болмайды
  - id: checkout_cause
    text: Ақауды checkout тудырады, өйткені оның сәтсіздік үлесі барлық операциядан
      жоғары
  - id: loaded_twice
    text: Санақтар сәйкес емес, демек бір сервис span-дары Doris-ке екі рет жүктелген
  answer: per_operation
  explanation: 'Шлюз дүкеннің әр сұрауын санайды, сондықтан бір операция ақаулары
    үлесінде жоғалады; операциямен бөлгенде PlaceOrder мен payment Charge шамамен
    жартысында сәтсіз. Үлестің жоғарылығы ақаудың қайда көрінетінін көрсетеді, қайда
    басталғанын емес: checkout payment шақыруы сәтсіз болғандықтан істен шығады. Санақтар
    қайталанған жүктеуден емес, екі операция әртүрлі сұрауларды санағандықтан өзгеше.'
- id: read_p99
  type: single_choice
  objective: Кідіріс процентильдерін көрсеткенінен артық қорытынды жасамай түсіндіру.
  prompt: 75,000 сұрауы бар операцияның P50 мәні 2 ms, P99 мәні 3,000 ms. Бұл қай
    тұжырымды қолдайды?
  options:
  - id: tail_one_percent
    text: Сұрауларының шамамен 1%-ы 3 секунд не көп, жартысы ең көбі 2 ms алған
  - id: all_slow
    text: Әр сұрау шамамен 3 секунд алды, сондықтан барлық пайдаланушы сонша күтті
  - id: average_between
    text: Сұраулары P50 мен P99 ортасындағы 1.5 секундты орташа алды
  - id: users_affected
    text: Дәл 750 пайдаланушы 3 секунд күтті, өйткені P99 ең баяу пайдаланушыларды
      санайды
  answer: tail_one_percent
  explanation: 'P99 — сұраулардың 99%-ы аспаған ұзақтық, сондықтан шамамен 1%-ы сонша
    не ұзағырақ; P50 жартысы ең көбі 2 ms алғанын айтады. Процентильдер таралуды сипаттайды:
    әр сұрауды баяу етпейді, орташа емес, пайдаланушыларды емес, сұрауларды санайды.
    Операцияны баяу демес бұрын баяу сұраулардың не екенін тексеріңіз: минуттар ашық
    тұратын flagd ағындары баяу сұрау болмай-ақ шлюз P99-ын анықтайды.'
- id: find_failure_start
  type: single_choice
  objective: Көп трассадағы әр ақау басталатын сервисті SQL-мен табу.
  prompt: Әр сәтсіз тапсырыс трассасында payment, checkout, frontend және frontend-proxy
    сервер span-дары қате. Checkout-тың payment шақыруы, frontend-тің checkout шақыруы
    және проксидің frontend шақыруы да сәтсіз; payment сәтсіз шақыру жасамаған. Әр
    ақау қайдан басталады?
  options:
  - id: no_failed_call
    text: 'Payment ішінде: сервер span-ы сәтсіз, ал трассадағы өз шақыруларының ешқайсысы
      сәтсіз емес'
  - id: first_ended
    text: Қай сервис тіркесе де, трассада ең ерте аяқталған қате span-ында
  - id: most_errors
    text: Әр тапсырысқа барлық сервистен көп қате span-ын тіркеген frontend ішінде
  - id: no_error_child
    text: Frontend POST-ты қоса, тікелей балалары қатесіз әр қате span-ында
  answer: no_failed_call
  explanation: 'Сервер span-ы сәтсіз, ал өз шақыруларының ешқайсысы сәтсіз емес сервис
    өздігінен істен шыққан: мұнда тек payment, оны NOT EXISTS әр трассада табады.
    Checkout, frontend, проксидің әрқайсысы өз шақыруларының бірі сәтсіз болғандықтан
    істен шықты. Аяқталу уақыты миллисекунд бөліктеріне келіспеуі мүмкін әр сервис
    сағаттары мен SDK-ларынан келеді. Қате span саны сервис қанша тіркейтінін көрсетеді,
    бастауын емес. POST /api/checkout екі қате span-ының арасында қате тіркемейді,
    сондықтан тікелей бала ережесі frontend POST ішінде қате тоқтайды.'
- id: rolling_share
  type: single_choice
  objective: Терезелік функциямен әр жолға байланысты жолдардан мән есептеу.
  prompt: Уақыт ретімен әр тапсырыс үшін сол тапсырыс пен алдыңғы тоғыздың сәтсіздік
    үлесі керек. Қай өрнек оны береді?
  options:
  - id: avg_over_frame
    text: AVG(failed) OVER (ORDER BY timestamp ROWS BETWEEN 9 PRECEDING AND CURRENT
      ROW)
  - id: group_by_ten
    text: AVG(failed), GROUP BY FLOOR(order_number / 10) арқылы, әр ондық топқа бір
      жол
  - id: partition_by_trace
    text: AVG(failed) OVER (PARTITION BY trace_id ORDER BY timestamp), әр тапсырыс
      үшін есептеледі
  - id: limit_ten
    text: ORDER BY timestamp DESC LIMIT 10 жолдары бойынша AVG(failed)
  answer: avg_over_frame
  explanation: 'Терезелік функция әр жолды сақтап, байланысты жолдардан мән есептейді:
    ORDER BY тапсырыстарды уақытпен реттейді, жақтау ағымдағы және алдыңғы тоғызбен
    шектейді. GROUP BY он тапсырыстың әр тобын бір жолға жинайды. PARTITION BY trace_id
    әр тапсырысқа жаңа терезе бастап, тек сол тапсырысты қамтиды. LIMIT тек соңғы
    он тапсырысқа бір үлес береді.'
- id: llm_trace_contents
  type: single_choice
  objective: LLM трассасы сервис span-дары тіркемейтін нені тіркейтінін түсіндіру.
  prompt: Топ дүкенмен қатар AI көмекші орындайды, DOG стегі оның сервистерінің журналдарын,
    метрикалары мен span-дарын жинайды. Litefuse көмекшінің әр сұрауы туралы otel_traces
    тіркемейтін нені тіркейді?
  options:
  - id: prompts_and_tokens
    text: Промпт пен жауап, модель, токендері мен құны, шақыру айналасындағы қадамдар
  - id: host_load
    text: Модель жауап есептегенде хост жұмсаған CPU мен жады
  - id: error_logs
    text: Көмекші сервистері жазған қате журналдары, әр жолдың маңыздылық деңгейімен
  - id: service_calls
    text: Экспорттаушының otel_traces_graph кестесіндей көмекші сервистерінің минуттық
      шақырулары
  answer: prompts_and_tokens
  explanation: 'LLM трассасы әр қадамды бақылау жазбасы ретінде тіркейді: құжат іздеуі
    және промпты, жауабы, моделі, параметрлері, токендері мен құны бар generation
    модель шақыруы. Сервис span-дары сервистер арасындағы сұрауларды ұзақтығы мен
    күйімен тіркейді, промпт жоқ. Litefuse хост метрикаларын, журналдарды не сервисаралық
    шақыруларды жинамайды; оларды жинай беретін DOG стегін толықтырады.'
- id: locate_litefuse_traces
  type: single_choice
  objective: LLM қолданбасының трассаларын Doris-тен тауып, SQL-мен сұрау.
  prompt: Қолданба жария кілт, құпия кілт және Litefuse адресін қолданып, Langfuse
    SDK арқылы трасса жібереді. Litefuse жобасының ID-і — llm_app. Модель шақыруларын
    SQL-мен қайдан сұрай аласыз?
  options:
  - id: otel_traces
    text: otel.otel_traces ішінде, өйткені Doris-ке жететін әр span DOG Collector-ынан
      өтеді
  - id: spans_table
    text: litefuse.spans_llm_app ішінде, Litefuse worker-і жоба бақылау жазбаларын
      жүктейтін кестеде
  - id: postgres
    text: Doris-тің еш жерінде емес, өйткені Litefuse трассаларды пайдаланушылар мен
      API кілттерінің жанында PostgreSQL-де сақтайды
  - id: object_storage
    text: Тек объектілік сақтау bucket-інде; Doris әр сұрауда оның JSON файлдарын
      қайта оқиды
  answer: spans_table
  explanation: SDK бақылау жазбаларын OpenTelemetry span-дары ретінде Litefuse API-ына
    жібереді; ол әр пакетті объектілік сақтауға сақтап, кезекке қояды. Кейін worker
    жазбаларды Stream Load арқылы жоба spans_llm_app кестесіне, трассаларды traces_scalar_llm_app
    ішіне жүктейді. PostgreSQL пайдаланушы, жоба, API кілттерін, объектілік сақтау
    API алған пакеттерді ұстайды, бірақ сұраулар Doris-ті оқиды. Span-дар DOG Collector-ынан
    өтпейді, сондықтан otel_traces ішінде жоқ.
passing_score_percent: 80
