title: '8-модуль тесті: Grafana көмегімен ескерту'
description: Алты сұрақ ескерту сұрауын жаза, күйлерін болжай, ереже/саясат/байланыс
  нүктесін ажырата, қажет белгілерді сақтай, жоқ деректі өңдей және ережені кодпен
  сақтай алатыныңызды тексереді.
questions:
- id: choose_alert_expression
  type: single_choice
  objective: Ескертудің тиісті шамасын өлшейтін сұрау жазу.
  prompt: 'Хост CPU-ы жұмысбасты болып тұрса операторлар хабар алуы керек. DOG Collector
    хост CPU-ын otel_metrics_gauge ішінде system.cpu.utilization ретінде сақтайды:
    ядро мен күйге (idle, user, system т.б.) бір жол, уақыт үлесі value ішінде. Қай
    өрнек әр хост жұмысбастылығын өлшейді?'
  options:
  - id: every_row
    text: Кестені system.cpu.utilization бойынша сүзіп, әр жол мәнін шекпен салыстыру
  - id: all_states
    text: Әр хост ядроларының соңғы минуттағы барлық күйін орташалап, соны шекпен
      салыстыру
  - id: count_rows
    text: Әр хосттың соңғы минут жолдарын санап, саны шектен асса ескерту
  - id: busy_share
    text: Әр хосттың соңғы минуттағы орташа idle үлесін 1-ден шегеріп, шекпен салыстыру
  answer: busy_share
  explanation: Әр жол — бір ядроның бір күйдегі уақыт үлесі; тыныш хостта idle 1-ге
    жақын, ядро күйлерінің қосындысы әрдайым 1. Орташа idle үлесін 1-ден шегеру ядролардың
    жұмысбасты үлесін, хостпен топтау хостқа бір дана береді. Әр жолды салыстыру бос
    ядроларға іске қосылады; барлық күй орташа мәні әр хостқа бірдей; жол саны жұмысбастылықты
    емес, Collector жиілігін өлшейді.
- id: predict_pending_states
  type: single_choice
  objective: Дананың Normal, Pending, Alerting арасында және кері қалай ауысатынын
    болжау.
  prompt: Ереже әр 30 секундта бағаланады, күтуі 1 минут. Шарт 10:00:00 және 10:00:30
    ақиқат, 10:01:00 жалған, 10:01:30 бастап қайта ақиқат. Дана қашан Alerting болады?
  options:
  - id: after_reset
    text: 10:02:30, 10:01:30 қайта Pending болғаннан бір минут кейін
  - id: first_minute
    text: 10:01:00, шарт алғаш ақиқат болғаннан бір минут кейін
  - id: count_true
    text: 10:01:30, шарт үш бағалауда ақиқат болғанда
  - id: stays_normal
    text: Ешқашан, өйткені бір жалған бағалау ережені қайта сақтағанша өшіреді
  answer: after_reset
  explanation: Шарт орындалып тұрғанда дана Pending, бүкіл күту кезеңінің әр бағалауында
    орындалса Alerting болады. 10:01:00 жалған бағалауы Normal күйіне қайтарды, сондықтан
    кезең 10:01:30 қайта басталып, 10:02:30 аяқталды. 10:01:00 шарт ақиқат болмады;
    жалған бағалаудан аттап ақиқат бағалаулар қосылмайды; жалған бағалау ережені өшірмейді,
    бағалау жалғасады.
- id: find_the_routing_problem
  type: single_choice
  objective: Байланыс нүктесі, саясат және ереже әрқайсысы нені шешетінін ажырату.
  prompt: doris-course-email нүктесінің Test әрекеті хат жеткізді. Кейін Host CPU
    busy іске қосылды, бірақ oncall@example.com адресіне хат жетпеді, орнына әдепкі
    нүкте адресі алды. Алдымен нені тексеру керек?
  options:
  - id: policy_labels
    text: Саясатты және ереже белгілері doris-course-email бағытының саясатына сәйкес
      пе екенін
  - id: contact_address
    text: Байланыс нүктесінің адресін, өйткені сәтті сынақ жеткізу туралы ештеңе дәлелдемейді
  - id: rule_recipient
    text: Хат адресін бағанмен қайтаруы тиіс ереже сұрауын
  - id: smtp_server
    text: Grafana SMTP баптауларын, өйткені сынақтар мен ескертулер әртүрлі пошта
      серверімен жіберіледі
  answer: policy_labels
  explanation: 'Ереже ненің іске қосылатынын, саясат белгілермен қайда баратынын,
    байланыс нүктесі қалай жіберілетінін шешеді. Өзге саясатқа сәйкес емес ескерту
    әдепкісінің нүктесіне барады; мұнда сол болды: саясат сәйкестік белгісін және
    ереже белгілерін тексеріңіз. Сынақ нүктенің бір рет жеткізгенін дәлелдеді; ереже
    алушыны атамайды; сынақ пен ескерту бір SMTP баптауын қолданады.'
- id: preserve_host_dimension
  type: single_choice
  objective: Ескертуге әрекет етуге қажет белгілерді сақтау.
  prompt: CPU ескертулері операторға қай хост зардап шеккенін айтуы керек; сұрау хост
    атауын қайтара алады. Қай баптау осы талапты сақтайды?
  options:
  - id: body_only
    text: Хост атауын жалпы CPU high хабарымен алмастыру
  - id: random_node
    text: Ережені құрғанда бір хост атауын таңдап, әр іске қосылған данаға қолдану
  - id: keep_dimension
    text: Хостқа жеке қатар бағалап, хост атауын белгілер мен хабарда сақтау
  - id: drop_dimension
    text: Бағаламас бұрын барлық хостты белгісі жоқ бір мәнге біріктіру
  answer: keep_dimension
  explanation: 'Grafana сұраудың әр жолынан дана жасап, мәтін бағандарымен белгілейді:
    GROUP BY host хостқа host=... белгісі бар дана береді, оны хабар, саясат және
    үнсіз ету қолданады. Жалпы хабар, ережеге қолмен жазылған хост не барлық хостқа
    бір мән шегі дұрыс болса да, операторға қажет ақпаратты жоғалтады.'
- id: distinguish_missing_data_from_low_value
  type: single_choice
  objective: Ереже жоқ деректі қалай өңдейтінін шешіп, есеп беруді тоқтатқан көзді
    табу.
  prompt: Басқа хосттар жалғастырғанда бір хосттың CPU қатары бірнеше минут есеп бермейді.
    Шарт — value > 90%. Қай өңдеу ең негізді?
  options:
  - id: delete_series
    text: Соңғы байқалған мәнді шексіз қолданып, ағымдағы деп бағалау
  - id: no_data_state
    text: Дерексізді жеке күй деп қарап, ескерте ме екенін анықтау; жоқтықты 0% не
      CPU сау деген дәлел деп түсінбеу
  - id: low_cpu
    text: Жоқ үлгілерді 0%-ға айналдырып, CPU сау деп хабарлау
  - id: always_fire
    text: Әр жоқ үлгіні 100% деп алып, әр ескертуді іске қосу
  answer: no_data_state
  explanation: Жоқ телеметрия өлшенген төмен мән емес. Құралдандыру не желі ақауы
    сау хост деп хабарланбас үшін дерексіз жағдайда не болатынын нақты анықтаңыз.
    Grafana ережесінің no data баптауы сұрау мүлде ештеңе қайтармағанда қолданылады;
    басқалары есеп беріп, бірі үнсіз болса, соңғы үлгісінен бергі уақыт сияқты жеке
    тексеру керек. Соңғы мәнді қайталау үнсіздікті жасырады; 0% не 100% өлшемді ойдан
    жасайды.
- id: provision_rule_with_uid
  type: single_choice
  objective: Ережелерді код ретінде сақтап, Grafana-ға жіберу.
  prompt: 'Топ Failed orders ережесін тұрақты uid бар JSON ретінде сақтап, PUT /api/v1/provisioning/folder/{folder
    uid}/rule-groups/orders арқылы жібереді. Жаңа Grafana-да сұрау 500: could not
    find alert rule қатесімен сәтсіз. Не түзетеді?'
  options:
  - id: post_first
    text: Ережені бір рет POST /api/v1/provisioning/alert-rules арқылы құру; топ PUT
      сұрауы тек бар ережені жаңартады
  - id: disable_provenance
    text: 'Топ PUT білмейтін ережелерді құра алуы үшін X-Disable-Provenance: true
      тақырыбын қосу'
  - id: export_first
    text: Ережені ескі Grafana-дан экспорт API-ымен шығару; ол uid-ін жаңа Grafana-да
      тіркейді
  - id: sign_in_first
    text: Жаңа Grafana веб-бетіне admin болып бір рет кіру; сол пайдаланушыға provisioning
      API-ды қосады
  answer: post_first
  explanation: 'Топ PUT сұрауы аралық пен ережелерді орнатады, бірақ Grafana білетін
    uid ережесін ғана жаңарта алады: жаңа тұрақты uid алдымен POST арқылы құрылады,
    lab.provision_alert_rule_group солай істейді. X-Disable-Provenance тек веб-бетте
    өңдеу мүмкіндігін сақтайды. Экспорт бір Grafana-дан оқиды, басқасына ештеңе тіркемейді.
    API әр сұрауда әкімші тіркелгі деректерін алады, веб-бетке кіру оған әсер етпейді.'
passing_score_percent: 80
