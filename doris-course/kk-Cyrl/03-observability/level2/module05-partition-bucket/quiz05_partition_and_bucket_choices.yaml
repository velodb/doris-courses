title: '5-модуль тесті: Жүйені бақылау деректерін бөлімдеу және bucket-терге бөлу'
description: Алты сұрақ бөлімдерді, bucket-тер мен tablet-терді түсіндіре, бөлімдерді
  қысқарту мен динамикалық бөлімдерді болжай, бөлім түйіршіктілігі мен тәсілін, bucket-ке
  бөлуді таңдай және bucket санын түсіндіре алатыныңызды тексереді.
questions:
- id: count_tablets
  type: single_choice
  objective: Doris кестені бөлімдерге, bucket-терге және tablet-терге қалай бөлетінін
    түсіндіру.
  prompt: otel_traces ішінде әрқайсысы 10 bucket-тен тұратын 5 күндік бөлім, бір реплика
    бар. Неше tablet бар және бір бөлімді сканерлеу қайсысын оқиды?
  options:
  - id: fifty_in_partition
    text: 50 tablet; сканерлеу сол бөлімнің 10 tablet-ін параллель оқиды
  - id: ten_shared
    text: Барлық бөлімге ортақ 10 tablet; сканерлеу онның бәрін оқиды
  - id: five_one
    text: Әр бөлімге бірден 5 tablet; сканерлеу бөлімнің жалғыз tablet-ін оқиды
  - id: fifty_all
    text: 50 tablet; bucket-тер бөлімдерге ортақ болғандықтан, кез келген сканерлеу
      50-ін де оқиды
  answer: fifty_in_partition
  explanation: 'Doris әр бөлімнің әр bucket-ін tablet ретінде сақтайды: 10 bucket-тен
    тұратын 5 бөлім 50 tablet береді. Сканерлеу тек оқитын бөлімдерінің tablet-терін,
    мұнда 10, ашып, параллель оқиды. Bucket-тер әр бөлімді бөледі, бөлімдер арасында
    ортақ емес; бір bucket болмаса, бөлім бір tablet емес.'
- id: predict_partition_pruning
  type: single_choice
  objective: Бөлім бағанының сүзгісінен сұрау қай бөлімдерді оқитынын болжау.
  prompt: Жаңа ортада EXPLAIN timestamp >= бір сағат бұрынғы уақыт шарты бар otel_traces
    сұрауына partitions=1/5, уақыт сүзгісі мүлде жоқ сол сұрауға да partitions=1/5
    көрсетеді. Екінші жоспарды не түсіндіреді?
  options:
  - id: empty_skipped
    text: Тек бүгінгі бөлімде жолдар бар, Doris бос бөлімдерді де өткізеді
  - id: filter_ignored
    text: Doris бірінші жоспарда да уақыт сүзгісін елемеді, сондықтан екеуі бір бөлімді
      оқиды
  - id: service_pruning
    text: Doris otel_traces әр сұрауы меңзейтін service_name бойынша бөлімдерді қысқартты
  - id: plan_cache
    text: Doris екінші сұрауға SQL кэшінен біріншісінің жоспарын қайта қолданды
  answer: empty_skipped
  explanation: Қысқарту сәйкес жолдарды сақтай алатын аралықтағы бөлімдерді қалдырады;
    Doris жолы жоқ бөлімдерді де алып тастайды. Жаңа ортада тек бүгінгі бөлімде дерек
    бар, сондықтан екі жоспар да соны оқиды. Бір апталық телеметрияда уақыт сүзгісі
    жоқ сұрау барлық бөлімді, алғашқысы әлі біреуін оқыр еді. Бірінші жоспар сүзгісін
    қолданды; бөлімдер сервиспен емес, уақытпен бөлінген; SQL кэші басқалардың жоспарын
    емес, бірдей қайталанған сұрау нәтижесін сақтайды.
- id: predict_dynamic_partitions
  type: single_choice
  objective: Динамикалық бөлімдеу қандай бөлімдерді құрып, жоятынын болжау.
  prompt: Кесте DAY динамикалық бөлімдеуімен, start = -7, end = 1 және history_partition_num
    = 10 арқылы құрылды. Құрылған бойда қай бөлімдері бар?
  options:
  - id: seven_today_tomorrow
    text: Бүгінге дейінгі 7 күн, бүгін және ертең
  - id: ten_today_tomorrow
    text: Бүгінге дейінгі 10 күн, бүгін және ертең
  - id: today_only
    text: Тек бүгінгі; өткен күндер дерегі келгенде бөлім алады
  - id: no_tomorrow
    text: Бүгінге дейінгі 7 күн және бүгін; ертеңгісі түн ортасында құрылады
  answer: seven_today_tomorrow
  explanation: 'Динамикалық бөлімдеу end шегіне, мұнда ертеңге дейін бөлім құрады,
    ал history_partition_num кестемен бірге өткен бөлімдерді құрады, бірақ start шегінен
    аспайды: сұралған 10 күннің 7-еуі құрылады. Кейін жоспарлағыш әр 10 минутта бөлім
    құрып, жояды. Келген деректің бөлім құруы — AUTO PARTITION әрекеті; end = 1 ертеңгі
    бөлімді түн ортасына дейін құрады.'
- id: choose_partitioning
  type: single_choice
  objective: Сақтау мерзімі мен сұрау үлгісіне сай бөлім түйіршіктілігін және тәсілін
    таңдау.
  prompt: Сервис күніне шамамен 2 GB журнал жазады. Сұраулар соңғы минуттардан сағаттарға
    дейін қамтиды, журналдар 30 күн сақталады. Қай бөлімдеу ең қолайлы?
  options:
  - id: daily_retention
    text: Журнал уақыты бойынша күндік бөлімдер; динамикалық бөлімдеуі 30 күннен ескі
      күндерді жояды
  - id: hourly_forever
    text: Еш журнал жолы жоғалмас үшін алдын ала құрылатын, start мәні жоқ сағаттық
      бөлімдер
  - id: monthly
    text: Айлық бөлімдер, өйткені сұрау ай бөлімінің ішіндегі бір күнді әлі сүзе алады
  - id: unpartitioned_delete
    text: Бөлімсіз, әр түнде 30 күннен ескі жолдарға DELETE орындау
  answer: daily_retention
  explanation: Күндік бөлімдер сұрауларды бір-екі күнге қысқартады, сақтау мерзімі
    деректі қайта жазбай күнімен жояды. Күніне 2 GB үшін сағаттық бөлімдер tablet
    санын 24 есе өсіреді; start болмаса жойылмай, диск толғанша өседі. Айлық бөлімді
    күнмен сүзуге болады, бірақ әр сұрау күнді табу үшін бүкіл айды оқиды, сақтау
    мерзімі тұтас айды жояды. DELETE деректі қайта жазады, бөлім жоюдан әлдеқайда
    қымбат.
- id: choose_bucketing
  type: single_choice
  objective: Кесте сүзгілері мен дерек таралуына қарай HASH не RANDOM таңдау.
  prompt: HASH(service_name) арқылы 10 bucket-ке бөлінген span көшірмесі service_name
    = 'payment' үшін бір tablet оқиды, бірақ бір tablet-те жолдардың 38%-ы, басқасында
    ештеңе жоқ. Пайдаланушылар көбіне trace_id бойынша толық трасса іздейді. Қай тарату
    ең қолайлы?
  options:
  - id: hash_trace
    text: 'HASH(trace_id): мәндері жолдарды біркелкі таратады, іздеу әр бөлімге бір
      tablet оқиды'
  - id: more_service_buckets
    text: '100 bucket бар HASH(service_name): әр жұмысбасты сервисті көбірек tablet-ке
      таратады'
  - id: random_lookup
    text: 'RANDOM: tablet-терді тең ұстап, trace_id іздегенде әлі бір tablet қана
      оқиды'
  - id: one_bucket
    text: Әр іздеу бөлімнің дәл бір tablet-ін оқу үшін бөлімге бір bucket
  answer: hash_trace
  explanation: 'Көп сұрау = арқылы сүзетін баған жолдарды біркелкі таратса, сол бағанмен
    бөліңіз. Трасса ID-лері кездейсоқ, бір трассада бірнеше ондағаннан артық span
    жоқ; сондықтан tablet-тер біркелкі, бір трасса іздеуі әр сканерленген бөлімде
    бір tablet оқиды. Bucket көбейту бір сервисті бөлмейді: бір мәннің барлық жолы
    бір bucket-ке хештеледі. RANDOM tablet-терді тең ұстайды, бірақ бірде-бір bucket-ті
    қысқартпайды. Бөлімге бір bucket шынында бір tablet оқиды, бірақ ол — бүкіл бөлім.'
- id: explain_auto_buckets
  type: single_choice
  objective: Doris әр бөлімнің bucket санын қалай орнататынын түсіндіру.
  prompt: Экспорттаушының otel_traces кестесінде DISTRIBUTED BY RANDOM BUCKETS AUTO
    делінген, курс бөлімдерінің әрқайсысында бірнеше мегабайт қана бар, бірақ бәрінде
    10 bucket. Неге?
  options:
  - id: default_then_floor
    text: Кестемен бірге құрылғандар dynamic_partition.buckets мәнін, 10, алды; кейінгі
      жартысынан аз бағалар еленбейді
  - id: hash_only
    text: BUCKETS AUTO тек HASH кестелерінде жұмыс істейді, сондықтан RANDOM әр бөлімге
      әдепкі 10 bucket алады
  - id: per_megabyte
    text: Doris бөлім дерегінің әр мегабайтына бір bucket бағалайды, әр бөлімде шамамен
      10 MB бар
  - id: per_disk
    text: Doris кластердің әр дискіне бір bucket құрады, курстың Docker хостында 10
      диск бар
  answer: default_then_floor
  explanation: Кестемен бірге құрылған бөлімдер dynamic_partition.buckets мәнін, 10,
    алады. Кейінгілерге BUCKETS AUTO бұрынғылардың өлшемінен, мұнда 1 bucket, бағалайды;
    баға алдыңғы бөлім санының жартысынан аз болса, Doris бұрынғы санды сақтайды.
    BUCKETS AUTO RANDOM кестелерінде де жұмыс істейді; баға әр мегабайтқа бір емес,
    100 MB-қа дейін шамамен бір және әрі қарай әр 5 GB-қа бір bucket; кластер дискілері
    тек шегін қояды.
passing_score_percent: 80
