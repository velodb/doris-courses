title: '1-модуль тесті: DOG стегіндегі жүйені бақылау негіздері'
description: Алты сұрақ телеметрия сигналын таңдай алатыныңызды, span-дарды біріктіретін
  өрістерді түсінетініңізді, DOG стегінің міндеттерін бөле алатыныңызды, демо телеметриясының
  Doris-ке дейінгі жолын қадағалап, оның жеткенінің дәлелін бағалай және төлем ақауын
  растай алатыныңызды тексереді.
questions:
- id: choose_signal_for_failing_step
  type: single_choice
  objective: Пайдалану кезіндегі сұраққа журналдарды, метрикаларды не трассаларды
    таңдау.
  prompt: Тұтынушылар кей тапсырыстардың сәтсіз болатынын хабарлады. Кезекші инженер
    бір сәтсіз тапсырыстың сұрауы қай сервистерден өткенін және қай қадам қате қайтарғанын
    көруі керек. Қай сигнал бұған тікелей жауап береді?
  options:
  - id: traces
    text: Трассалар, өйткені әр сервистегі тапсырыс span-дарының трасса ID-і ортақ
      және олар ақаулы қадамды белгілейді
  - id: metrics
    text: Метрикалар, өйткені минутына сәтсіз төлемдер санауышы әр сәтсіз тапсырыстың
      жолын көрсетеді
  - id: logs
    text: Журналдар, өйткені әр сервис әр сұрауға ақаулы сервис аталған жол жазады
  - id: dashboard
    text: Бақылау тақтасы, өйткені оның панельдері бір сұраудың сервистерін ортақ
      көрініске біріктіреді
  answer: traces
  explanation: 'Трассалар бір сұрауды сервистер арасында қадағалайды: тапсырыстың
    әр span-ында оның трасса ID-і бар, ал ақаулы қадамның span-ында қате күйі болады.
    Сәтсіз төлемдер санауышы тапсырыстардың қаншалықты жиі сәтсіз болатынын көрсетеді,
    бір тапсырыстың өткен жолын көрсетпейді. Журналдарда тек әр сервис жазуды таңдаған
    мәлімет болады; демода payment пен checkout сервистері журнал жібермейді. Бақылау
    тақтасы сұрауларының нәтижесін көрсетеді; сұрау span-дарын өздігінен біріктірмейді.'
- id: join_spans_by_their_ids
  type: single_choice
  objective: Трасса ID-і мен ата-аналық span ID-і бір сұраудың span-дарын қалай біріктіретінін
    түсіндіру.
  prompt: otel_traces кестесінде A span-ының span ID-і 7f3a, ал ата-аналық span ID-і
    жоқ. B span-ының трасса ID-і A-мен бірдей, ал ата-аналық span ID-і 7f3a. C span-ының
    трасса ID-і басқа. Бұл өрістер нені білдіреді?
  options:
  - id: b_child_of_a
    text: B — сол сұраудағы A-ның баласы, ал C басқа сұрауға жатады
  - id: c_parent_of_a
    text: C — A-ның ата-анасы, өйткені A-ның өзінің ата-аналық span ID-і жоқ
  - id: same_service
    text: A мен B-ні бір сервис жазған, өйткені олардың трасса ID-і ортақ
  - id: b_reports_error
    text: B сәтсіз болды, өйткені ата-аналық span ID-і бар span ата-анасына қате хабарлайды
  answer: b_child_of_a
  explanation: 'Сұраудың әр span-ында сұраудың трасса ID-і бар, ал span-ның ата-аналық
    span ID-і — оны бастаған span-ның ID-і. B-де A-ның трасса ID-і, ал ата-анасы ретінде
    A-ның span ID-і бар, сондықтан B — сол сұраудағы A-ның баласы, ал ата-анасы жоқ
    A — түбір span. C-нің трасса ID-і басқа, сондықтан ол басқа сұрауға жатады және
    A-ның ата-анасы бола алмайды. Ортақ трасса ID-і ортақ сервисті білдірмейді: контексті
    тарату трасса ID-ін сервистен сервиске жеткізеді. Ата-аналық span ID-і қатені
    білдірмейді; оны күй коды көрсетеді.'
- id: assign_dog_responsibilities
  type: single_choice
  objective: Жинау, сақтау және визуализацияны DOG стегінің бөліктеріне сәйкестендіру.
  prompt: Топ көптеген сервистің журналдары, метрикалары мен трассалары үшін DOG стегін
    енгізді. Қай міндеттер бөлінісі стекке сәйкес келеді?
  options:
  - id: collector_doris_grafana
    text: Collector телеметрияны қабылдап экспорттайды, Doris сақтап сұрайды, ал Grafana
      көрсетеді
  - id: grafana_stores
    text: Grafana телеметрияны бақылау тақталарында сақтайды, Doris жинайды, ал Collector
      диаграммалар салады
  - id: doris_collects
    text: Doris телеметрияны әр сервистен тартып алады, Grafana бастапқы жазбаларды
      сақтайды, ал Collector пайдаланушыларды жүйеге кіргізеді
  - id: services_store
    text: Әр сервис өз телеметриясын сақтайды, ал Doris пен Grafana тек соңғы сұрауларды
      кэштейді
  answer: collector_doris_grafana
  explanation: 'OpenTelemetry Collector телеметрияны қабылдап, өңдеп, экспорттайды;
    Doris оны кестелерде сақтап, SQL сұрауларына жауап береді; Grafana оны іздеу,
    трассалар, бақылау тақталары және ескертулер арқылы көрсетеді. Grafana телеметрияны
    емес, тек бақылау тақталары мен баптауларын сақтайды. Doris сервистерден жинамайды:
    Collector экспорттаушысы оған деректерді жүктейді. Сервистер телеметриясын өзінде
    сақтамайды, Collector-ға жібереді.'
- id: follow_demo_telemetry_path
  type: single_choice
  objective: Демо телеметриясының сервистен Doris кестесіне дейінгі жолын қадағалау.
  prompt: Демоның өз Collector-ы тоқтады, ал DOG Collector-ы мен Doris жұмысын жалғастырып
    жатыр. Doris-тегі телеметрияға не болады?
  options:
  - id: demo_rows_stop
    text: Демо сервистерінің жолдары тоқтайды, ал DOG Collector-ының өз хост метрикалары
      келе береді
  - id: services_switch
    text: Сервистер оның орнына тікелей DOG Collector-ына жібереді, сондықтан Doris-те
      ештеңе өзгермейді
  - id: doris_pulls_later
    text: Демо Collector-ы қайта қосылған соң Doris жетіспейтін телеметрияны сервистерден
      тартып алады
  - id: all_tables_stop
    text: Doris-тегі барлық кестеге жол келуі тоқтайды, өйткені бүкіл телеметрия демо
      Collector-ынан өтеді
  answer: demo_rows_stop
  explanation: 'Демо сервистері телеметрияны OTLP арқылы демо Collector-ына жібереді,
    ол DOG Collector-ына бағыттайды. Сондықтан демо Collector-ы тоқтағанда демодан
    Doris-ке ештеңе жетпейді. DOG Collector-ының өз хост метрикалары демо Collector-ынан
    өтпейді және келе береді. Сервистер бапталған Collector-ына жібереді, басқасына
    ауыспайды. Doris сервистерден телеметрия тартпайды: оны экспорттаушы жібереді,
    ал Collector-ға мүлде жетпеген деректер жоғалады.'
- id: prove_demo_telemetry_reached_doris
  type: single_choice
  objective: Телеметрияның Doris-ке жеткенін қандай дәлел көрсететінін бағалау.
  prompt: Демоны іске қосқаннан кейін қай бақылау оның трассалары Doris-ке жеткенін
    ең жақсы көрсетеді?
  options:
  - id: recent_rows
    text: otel_traces кестесінде демо сервистері жіберген соңғы бірнеше минуттың жолдары
      бар
  - id: containers_running
    text: Демоның барлық 23 контейнері мен DOG стегінің төрт контейнері жұмыс істейді
  - id: storefront_answers
    text: Дүкен беті ашылады және тауарды себетке қатесіз қоса аласыз
  - id: collector_ready
    text: DOG Collector журналы оның дайын екенін және трасса конвейерін іске қосқанын
      айтады
  answer: recent_rows
  explanation: 'Демо сервистерінің otel_traces кестесіндегі жаңа жолдары — жолдың
    соңы: span-дар жіберіліп, бағытталып, экспортталып, жүктелген. Жұмыс істейтін
    контейнерлер тек процестердің іске қосылғанын көрсетеді. Жұмыс істейтін дүкен
    сервистердің сұрауларға жауап беретінін көрсетеді, телеметрияның олардан шыққанын
    көрсетпейді. Дайын Collector деректі қабылдай алады, бірақ оның журналы span-дардың
    одан өткенін не Doris оларды жүктегенін көрсетпейді.'
- id: confirm_payment_failure
  type: single_choice
  objective: Мүмкіндік жалаушасымен ақау тудырып, оны телеметриядан растау.
  prompt: Демоның paymentFailure жалаушасын 50% етіп сақтадыңыз. Қай бақылау ақаудың
    болып жатқанын растайды?
  options:
  - id: error_spans
    text: oteldemo.CheckoutService/PlaceOrder жаңа span-дарының күйі STATUS_CODE_ERROR
  - id: flag_page
    text: Жалауша бетін қайта жүктегенде paymentFailure карточкасында 50% көрсетіледі
  - id: error_logs
    text: otel_logs кестесінде payment сервисінің ERROR деңгейіндегі жаңа журнал жолдары,
      әр сәтсіз төлемге бір жол пайда болады
  - id: host_cpu
    text: Хост CPU-ы өседі, өйткені payment сервисі әр сәтсіз төлемді қайталап орындайды
  answer: error_spans
  explanation: 'Checkout сервисі әр тапсырысты PlaceOrder span-ы ретінде тіркейді;
    төлем сәтсіз болса, күйі STATUS_CODE_ERROR болады, сондықтан жаңа қате span-дары
    тапсырыстардың енді сәтсіз болатынын растайды. Жалауша беті тек сақталған баптауды
    көрсетеді, оның әсерін көрсетпейді. Payment сервисі қатесін тек контейнер шығысына
    жазады, сондықтан otel_logs кестесіне қате жолдары келмейді. Ақау CPU жүктемесін
    арттырмайды: payment сервисі төлемді дереу қабылдамай, ештеңені қайталап орындамайды.'
passing_score_percent: 80
