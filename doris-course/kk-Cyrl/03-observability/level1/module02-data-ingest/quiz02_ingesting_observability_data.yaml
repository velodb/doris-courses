title: '2-модуль тесті: Жүйені бақылау деректерін жүктеу'
description: Алты сұрақ Collector конвейерінің бөліктерін оқи алатыныңызды, жіберу
  мен тарту қабылдағыштарын таңдап, пакеттеуді болжай, экспорттаушының қай баптаулары
  тек жаңа кестелерге қолданылатынын ажырата, экспорт шақыруы нені дәлелдейтінін бағалай
  және қай сервис қай сигналды жіберетінін түсіндіре алатыныңызды тексереді.
questions:
- id: name_the_pipeline_parts
  type: single_choice
  objective: Collector конвейерінің қабылдағыштары, өңдегіштері, экспорттаушылары
    мен кеңейтімдері не істейтінін сипаттау.
  prompt: fe.log өз сервисін атамаса да, 2-зертханалық жұмыстың журнал collector-ы
    жолдары Doris-ке service_name doris-fe мәнімен келеді. Оны конвейердің қай бөлігі
    орнатады?
  options:
  - id: resource_processor
    text: Әр жазбада service.name атрибутын орнататын resource өңдегіші
  - id: filelog_receiver
    text: Файл атауынан сервис атауын алатын filelog қабылдағышы
  - id: doris_exporter
    text: Әр жолды collector жұмыс істейтін контейнер атымен атайтын Doris экспорттаушысы
  - id: file_storage
    text: Өзі оқитын әр файлдың сервисін тіркейтін file_storage кеңейтімі
  answer: resource_processor
  explanation: Resource өңдегіші өзінен өткен әр жазбаға ресурс атрибуттарын қосады,
    экспорттаушы service.name мәнін service_name бағанына жазады. Filelog қабылдағышы
    файл атауын log.file.name атрибутына жазады, сервис атауын емес. Экспорттаушы
    атрибуттарды бағандарға сәйкестендіреді, сервис атауын ойдан қоспайды. File_storage
    кеңейтімі тек қабылдағыштың оқу орнын сақтайды; ол дерек жолында тұрмайды.
- id: distinguish_pull_and_push
  type: single_choice
  objective: Телеметриясын өзі жіберетін және дерегі тартылуы қажет дереккөздерге
    қабылдағыш таңдау.
  prompt: Doris FE мен BE метрикаларын /metrics жолында жариялап, сұрауды күтеді.
    Python бағдарламасы span-дарын OTLP арқылы жібереді. Collector-ға қай қабылдағыштар
    қажет?
  options:
  - id: prometheus_and_otlp
    text: /metrics жолынан жинайтын prometheus қабылдағышы және бағдарлама жете алатын
      otlp қабылдағышы
  - id: otlp_for_both
    text: Екеуіне бір otlp қабылдағышы, өйткені Doris бапталған соң метрикаларын OTLP
      арқылы жібереді
  - id: prometheus_for_both
    text: Екеуіне бір prometheus қабылдағышы, өйткені ол Python бағдарламасынан span-дарды
      да жинай алады
  - id: filelog_for_both
    text: Екі дереккөз де телеметриясын ортақ файлға жазғаннан кейін екеуіне filelog
      қабылдағышы
  answer: prometheus_and_otlp
  explanation: FE мен BE Prometheus мәтінін жариялап күтеді, сондықтан prometheus
    қабылдағышы оны аралықпен тартуы керек. Python бағдарламасы OTLP арқылы жібереді,
    сондықтан collector-ға бағдарлама жете алатын порттағы otlp қабылдағышы керек,
    мысалы 2-зертханалық жұмыстың 127.0.0.1:24328 адресі. Doris метрикаларын OTLP
    арқылы жібермейді, prometheus қабылдағышы бағдарламадан span ала алмайды, ал екеуін
    де файлға жазу ешбір дереккөзге қажет емес қосымша қадам болар еді.
- id: predict_batch_export_timing
  type: single_choice
  objective: Пакет өңдегіші деректі қашан жіберетінін және жіберу кезегі мен қайталаулар
    неге кепілдік беретінін болжау.
  prompt: Пакет өңдегішінің send_batch_size мәні 10000, timeout мәні 10s. Бағдарлама
    бір span жіберді, басқа ештеңе келмейді. Collector span-ды қашан экспорттайды?
  options:
  - id: at_timeout
    text: Пакет басталғаннан шамамен 10 секунд кейін, күту мерзімі өткенде
  - id: immediately
    text: Бірден, өйткені жалғыз span-ы бар пакетке күтетін ештеңе жоқ
  - id: when_full
    text: Тек 10,000 span келгеннен кейін, өйткені пакет тек толғанда шығады
  - id: on_restart
    text: Collector қайта іске қосылғанда, өйткені күту мерзімі біткенде пакет дискіге
      жазылады
  answer: at_timeout
  explanation: Пакет өңдегіші send_batch_size шегіне жеткенде не timeout өткенде,
    қайсысы бұрын болса, пакетті жібереді; сондықтан жалғыз span шамамен 10 секундтан
    кейін шығады. Сол себепті 2-зертханалық жұмыстың span-ы Doris-те шамамен 20 секундта
    көрінеді. Әр span-ды дереу жіберу пакеттеудің мәнін жояды, ал timeout өткенде
    пакет 10,000 span күтпейді. Пакеттер жадыда қалады, дискіге ештеңе жазылмайды;
    сондықтан жіберу кезегі де құлаудан сақталмайды.
- id: table_settings_apply_at_creation
  type: single_choice
  objective: Doris экспорттаушысының қай баптаулары кестені құрғанда ғана қолданылатынын
    түсіндіру.
  prompt: 'otel_logs кестесі бар, оның күндік бөлімдері 7 күн сақталады. Collector-дың
    Doris экспорттаушысына history_days: 30 және create_schema: true орнатып, collector-ды
    қайта іске қостыңыз. otel_logs кестесіне не болады?'
  options:
  - id: nothing_changes
    text: 'Ештеңе: CREATE TABLE IF NOT EXISTS бұрынғы кестені өзгеріссіз қалдырады'
  - id: keeps_30_days
    text: Кесте енді 30 күндік бөлімдерді сақтайды, өйткені экспорттаушы оны өзгертеді
  - id: recreated
    text: Экспорттаушы кестені жойып, 30 күнмен қайта құрады, ескі жолдар жоғалады
  - id: refuses_to_start
    text: Баптауы кестенікімен сәйкес келмегендіктен, collector іске қосылудан бас
      тартады
  answer: nothing_changes
  explanation: 'Экспорттаушы кесте баптауларын тек кестені құрғанда қолданады. create_schema:
    true кезінде CREATE TABLE IF NOT EXISTS орындайды; бұрынғы кестені ол өзгертпейді,
    сондықтан otel_logs өз 7 күнін сақтайды. Экспорттаушы кестелерді өзгертпейді,
    ешқашан жоймайды және өз баптауын кестенікімен салыстырмайды, сондықтан collector
    қалыпты іске қосылады.'
- id: judge_flush_evidence
  type: single_choice
  objective: Сәтті экспорт шақыруы нені, ал тек Doris сұрауы нені көрсететінін бағалау.
  prompt: Python коды span-ды аяқтап, provider.force_flush() шақырады да, Flushed
    the span деп шығарады. otel_traces ішінде оның трасса ID-ін іздеген сұрау жол
    қайтармайды. Қай қорытынды ең негізді?
  options:
  - id: export_not_proven
    text: Flush тек экспорт әрекеті жасалғанын көрсетеді; collector-ды тексеріп, сұрауды
      қайталау керек
  - id: span_stored
    text: Span Doris-те сақталған, өйткені force_flush() сәтсіз экспортты exception
      арқылы хабарлайды
  - id: query_wrong
    text: Сұрау қате болуы тиіс, өйткені flush шақыруы аяқталғанда span Doris-те болады
  - id: grafana_needed
    text: Span Grafana оның трассасын бір рет ашқаннан кейін ғана Doris-те көрінеді
  answer: export_not_proven
  explanation: 'force_flush() экспорт әрекетін күтеді, бірақ сәттілігін хабарламайды:
    collector-ға жету мүмкін болмаса, SDK тек ескерту жазады. Collector қабылдаған
    span да пакет пен Doris-ке жүктеуді әлі күтеді, сондықтан келесі қадам — collector-ды
    тексеріп, қайта сұрау. Flush сәтсіз болса exception тудырмайды, сәтті flush жолды
    Doris-ке бірден орналастырмайды, ал Grafana дерек жүктеуге қатыспайды.'
- id: explain_missing_payment_logs
  type: single_choice
  objective: Әр сигналдан бір сұраудың дәлелін тауып, қай сервис қай сигналды жіберетінін
    ажырату.
  prompt: Сәтсіз тапсырыс трассасында payment пен checkout қате span-дары бар. otel_logs
    ішінде тапсырыс трассасының ID-і бар прокси қатынас журналы жолы бар, бірақ payment
    не checkout жолы жоқ. Ең дұрыс түсіндіру қайсы?
  options:
  - id: not_sent_to_collector
    text: Payment пен checkout журналдарын Collector-ға емес, тек өз контейнерлерінің
      шығысына жазады
  - id: errors_filtered
    text: Doris экспорттаушысы тек INFO не одан төмен маңыздылықтағы жазбаларды жүктейді,
      сондықтан қателер тасталады
  - id: logs_come_later
    text: Журналдары бірнеше сағаттан кейін келеді, өйткені журналдар сұрау трассаларынан
      кейін экспортталады
  - id: stored_with_traces
    text: Жазбаларында трасса ID-і бар, сондықтан Doris оларды otel_logs орнына otel_traces
      кестесінде сақтайды
  answer: not_sent_to_collector
  explanation: Демода payment пен checkout журналдарын тек контейнер шығысына жазады,
    оларды docker logs көрсетеді; Collector-ға журнал жібермейді, ал прокси және cart
    пен currency сияқты сервистер жібереді. Doris экспорттаушысы маңыздылығына қарамастан
    әр журнал жазбасын жүктейді; журналдар трасса аяқталғанша ұсталмайды, ал журнал
    жазбасы трасса ID-і болса да, болмаса да otel_logs кестесіне түседі.
passing_score_percent: 80
