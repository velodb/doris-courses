template.progress.formats: 'v1 және v2 файлдары қабылданады. V2 тест тапсыру әрекеттері мен тіл тарихын
  сақтайды. v1 көрінісінде бұл тарих болмайды: v2 файлыңызды сақтаңыз. Импорт дерекқордың жеке сақтық
  көшірмесін жасайды. Бұл жазбалар сайт сертификаттарын алуға негіз бола алмайды.'
template.progress.text-1: Оқу барысын импорттау
template.progress.text-2: Осы ортада оқу жазбаңызды қалпына келтіріңіз. Растамас бұрын сәйкестіктерді
  қарап шығыңыз. Белгісіз, қолданыстан шыққан және таңдалмаған модульдер өткізіледі. Зертханалық қызметтер,
  дерекқорлар мен ноутбук файлдары қалпына келтірілмейді.
