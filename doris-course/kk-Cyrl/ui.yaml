recovery.action: Қайта қосылу үшін кіру
recovery.auth: Кіру сеансының мерзімі бітті немесе қолжетімділікті тексеру керек. Қайта қосылу үшін қайта
  кіріңіз. Сақталмаған түзетулер жоғалмас үшін осы ноутбукті ашық ұстаңыз.
recovery.ended: Бұл семинар аяқталды. Жалғастыру үшін осы ноутбукті ашық ұстап, оқытушыға хабарласыңыз.
recovery.network: Байланыс үзілді. Қосылым автоматты түрде қалпына келтірілуде. Осы ноутбукті ашық ұстаңыз.
