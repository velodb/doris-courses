notebook.help: Әр тілдің жеке сақталған көшірмесі бар. Жүктеп алу не қайта ашу алдында JupyterLab ішіндегі
  File → Save Notebook пәрменін қолданыңыз. Басқа тілдегі көшірмеге оралу үшін оны осы жерден ашыңыз;
  ағымдағы Notebook пен kernel ашық қалады. Kernel-дер бір Lab қызметтері мен файлдарын пайдаланады, ал
