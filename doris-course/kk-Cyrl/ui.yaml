  ашық ұстаңыз.
recovery.restored: Кіру қалпына келтірілді. Осы терезені жауып, ноутбукке оралуға болады.
recovery.restored-title: Семинарға кіру қалпына келтірілді
recovery.signed-out: Бұл қызметтен шықтыңыз. Курстың басқа қойындыларын жабыңыз.
service.check: Қызметті іске қосып қойған болсаңыз, зертханалық жұмыстың соңғы ұяшығының нәтижесін тексеріңіз.
  Ол әлі іске қосылып жатуы немесе тоқтап қалуы мүмкін.
service.description: Бұл қызмет курстың зертханалық жұмысынан іске қосылады.
service.jupyter.description: Ноутбук жұмыс кеңістігі әлі іске қосылып жатуы немесе уақытша қолжетімсіз
  болуы мүмкін.
service.jupyter.startup: Сәл күтіп, қайталап көріңіз. Жұмыс кеңістігі әлі де қолжетімсіз болса, ұйымдастырушыға
  хабарласыңыз.
service.label: Курс қызметі
service.multi.description: Тек 9-зертханалық жұмыс үшін · 3 FE + 3 BE бар бөлек кластер. FE 1–3 беттерін
  ашпас бұрын 9-зертханалық жұмыс бойынша бір түйінді сынақ ортасын тоқтатып, осы кластерді іске қосыңыз.
service.multi.lab: 9-зертханалық жұмысты ашу
service.multi.startup: 9-зертханалық жұмысты ашып, кластерді іске қосу қадамдарын орындаңыз, оның ішінде
  бір түйінді сынақ ортасын тоқтатыңыз. Іске қосу ұяшықтары аяқталғанша күтіп, осы FE бетін қайта ашып
  көріңіз.
service.single.description: Бір түйінді сынақ ортасы · 1 FE + 1 BE. Оны 1-зертханалық жұмыста іске қосыңыз.
service.single.lab: 1-зертханалық жұмысты ашу
service.single.label: Doris · бір FE
