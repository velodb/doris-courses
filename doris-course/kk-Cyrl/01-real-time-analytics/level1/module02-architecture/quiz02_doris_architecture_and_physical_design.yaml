title: '2-модуль тесті: Apache Doris архитектурасын тереңірек зерттеу'
description: Алты сұрақ 2-модульдегі сұрауды орындау, сақтау, кесте моделі, физикалық
  құрылым және диагностика шешімдерін тексереді; әр оқу мақсатына бір сұрақтан.
questions:
- id: trace_query_execution
  type: single_choice
  objective: Сұрауды FE жоспарлауынан оның жоспар фрагменттері арқылы BE түйіндерінде
    орындалуына дейін қадағалау.
  prompt: Қай тұжырым талдамалық сұраудың Doris арқылы өту жолын дұрыс сипаттайды?
  options:
  - id: client_fragments
    text: MySQL клиенті SQL операторын жоспар фрагменттеріне бөліп, оларды Tablet
      нысандарына жібереді
  - id: be_plans_fe_scans
    text: BE үлестірілген жоспарды құрады, ал FE Segment файлдарын сканерлеп, нәтижелерді
      қайтарады
  - id: fe_plans_be_executes
    text: FE жоспарлап, жоспар фрагменттерін тағайындайды; BE түйіндері оларды физикалық
      операторлармен орындайды
  - id: fe_executes_all
    text: FE барлық сканерлеу мен агрегаттауды өзі орындайды, ал BE түйіндері тек
      SQL метадеректерін сақтайды
  answer: fe_plans_be_executes
  explanation: FE SQL синтаксисі мен мағынасын талдайды, үлестірілген сұрау жоспарын
    құрып, оңтайландырады және оның жоспар фрагменттерін тағайындайды; әр BE өз фрагменттерін
    сканерлеу, сүзу, Exchange және агрегаттау сияқты физикалық операторлармен орындайды.
    Клиент тек SQL жібереді, BE сұрауды жоспарламайды, ал FE деректерді өзі сканерлемейді.
- id: columnar_and_vectorized
  type: single_choice
  objective: Бағандық сақтау мен векторлық орындау талдамалық сканерлеу жұмысын қалай
    азайтатынын түсіндіру.
  prompt: Сұрау жеті бағаны және миллиондаған жолы бар кестеден бір күннің түсімін
    қосады; ол тек event_time және revenue оқиды. Бағандық сақтау мен векторлық орындау
    оның жұмысын қалай азайтады?
  options:
  - id: columns_and_batches
    text: Сканерлеу тек екі бағанды оқиды, ал операторлар олардың мәндерін топтамалармен
      өңдейді
  - id: row_index
    text: Бағандық сақтау әр жол үшін индекс жазбасын ұстайды, сондықтан сканерлеу
      тек сәйкес жолдарды оқиды
  - id: stored_sum
    text: Векторлық орындау қосындыны алдын ала сақтайды, сондықтан сұрау кесте жолдарын
      енді оқымайды
  - id: rows_together
    text: Бағандық сақтау әр толық жолды бірге ұстайды, ал векторлау сол жолдарды
      сығады
  answer: columns_and_batches
  explanation: Бағандық сақтау әр бағанның мәндерін бірге ұстайды, сондықтан сканерлеу
    тек сұрау пайдаланатын бағандарды оқиды, мұнда жетінің екеуін. Векторлық орындау
    операторлар арасында бір-бір жолдың орнына баған мәндерінің топтамаларын өткізеді,
    бұл сүзгі мен қосындының әр жолға кететін шығынын азайтады. Бұл тәсілдердің ешқайсысы
    әр жолға жеке индекс жазбасын ұстамайды, нәтижені алдын ала сақтамайды немесе
    толық жолдарды бірге сақтамайды.
- id: storage_hierarchy_compaction
  type: single_choice
  objective: Table, Partition, Tablet, Rowset және Segment иерархиясын және Compaction
    неліктен Rowset жиынтықтарын біріктіретінін түсіндіру.
  prompt: Қай сипаттама Doris кестесінің сақтау иерархиясын, жүктеу транзакциясын
    және Compaction үдерісін дұрыс байланыстырады?
  options:
  - id: segment_contains_tablet
    text: Segment бірнеше Tablet қамтиды, ал Compaction Partition бөлімдерін бір кестеге
      біріктіреді
  - id: load_adds_rowsets
    text: Жүктеу өзі жазатын Tablet нысандарына Rowset қосады; Compaction бір Tablet
      ішіндегі Rowset жиынтықтарын біріктіреді
  - id: rowset_global
    text: Әр жүктеу бүкіл кестеге бір Rowset жасайды, оны әр Partition және Tablet
      ортақ пайдаланады
  - id: compaction_changes_result
    text: Compaction жолдарды өзара байланыссыз Tablet нысандары арасында жылжытып,
      кейінгі сұраулардың нәтижесін өзгертеді
  answer: load_adds_rowsets
  explanation: Partition жол ауқымын қамтиды, оның әр Bucket ұяшығы — Tablet, жүктеу
    өзі жазатын әр Tablet-ке өзгермейтін Segment файлдарынан тұратын нұсқаланған Rowset
    қосады, ал фондық Compaction бір Tablet ішіндегі шағын Rowset жиынтықтарын саны
    аз, көлемі үлкен жиынтықтарға біріктіреді. Segment Tablet қамтымайды, Rowset бір
    Tablet-ке тиесілі, ал Compaction ешқашан жолдарды Tablet нысандары арасында жылжытпайды
    және сұрау нәтижелерін өзгертпейді.
- id: choose_table_model
  type: single_choice
  objective: Duplicate Key, Unique Key және Aggregate Key модельдерінің қайталанатын
    кілттерді қалай өңдейтінін сипаттау.
  prompt: Үш кестенің әрқайсысына кілт мәндері бірдей екінші жол келеді. Талап пен
    кесте моделінің қай сәйкестігі дұрыс?
  options:
  - id: correct_models
    text: 'Әр оқиғаны сақтау: Duplicate Key; соңғы күй: Unique Key; қосылған өлшемдер:
      Aggregate Key'
  - id: duplicate_unique
    text: 'Әр оқиғаны сақтау: Unique Key; соңғы күй: Duplicate Key; қосылған өлшемдер:
      Aggregate Key'
  - id: aggregate_detail
    text: 'Әр оқиғаны сақтау: Aggregate Key; соңғы күй: Unique Key; қосылған өлшемдер:
      Duplicate Key'
  - id: all_reject
    text: Үш модель де екінші жолды қабылдамайды, өйткені әр Doris кілті MySQL PRIMARY
      KEY сияқты жұмыс істейді
  answer: correct_models
  explanation: Duplicate Key моделі әр кіріс жолды сақтайды, Unique Key моделі әр
    кілтке бір ағымдағы жол көрсетеді, ал Aggregate Key моделі мән бағандарын DDL-де
    жарияланған агрегаттау арқылы біріктіреді. Duplicate Key моделінде кілт бағандары
    сұрыптау кілтін анықтайды; олар MySQL PRIMARY KEY сияқты бірегейлік шектеуі емес.
- id: choose_physical_design
  type: single_choice
  objective: Partition бөлу, bucket-терге бөлу, сұрыптау кілті және Prefix Index құралдарын
    әрқайсысы шешетін мәселе бойынша ажырату.
  prompt: Оқиғалар кестесіне бір күндік уақыт ауқымы және нақты user_id бойынша сұрау
    жасалады. Қай құрылым әр физикалық құрылым құралына өзінің міндетін береді?
  options:
  - id: correct_design
    text: Күндік Partition бөлімдері, HASH(user_id) bucket-тері және сұрыптау кілтінің
      басындағы сүзілетін бағандар
  - id: all_prefix
    text: Тек ұзынырақ Prefix Index, өйткені ол Partition, bucket және сұрыптау кілтін
      алмастырады
  - id: random_user_pruning
    text: FE user_id бойынша Tablet нысандарын, ал event_id бойынша Partition бөлімдерін
      іріктей алуы үшін RANDOM bucket бөлуі
  - id: partition_uniqueness
    text: Әр пайдаланушы бірегей болуы үшін user_id бойынша Partition бөлу, содан
      кейін Prefix Index Partition бөлімдерін алып тастайды
  answer: correct_design
  explanation: Күндік Partition бөлімдері FE түйініне басқа күндерді өткізіп жіберуге,
    user_id бойынша Hash bucket-тері сол пайдаланушы бола алмайтын Tablet нысандарын
    өткізіп жіберуге, ал сүзілетін бағандардан басталатын сұрыптау кілті Prefix Index
    арқылы әр Tablet ішінде оқылатын жолдарды тарылтуға мүмкіндік береді. RANDOM bucket
    бөлуі кілт бойынша іріктей алмайды, Partition бірегейлікті міндеттемейді, ал Prefix
    Index Partition бөлімдерін алып тастай алмайды.
- id: interpret_explain_profile
  type: single_choice
  objective: '`EXPLAIN` және Query Profile арқылы жоспарланған іріктеуді нақты орындалған
    сканерлеу жұмысынан ажырату.'
  prompt: EXPLAIN partitions=1/26, tablets=1/10 және сканерлеу предикатын көрсетеді,
    ал сұраудың Query Profile жазбасы бұрынғыдан аз сканерленген жолды көрсетеді.
    Қай қорытынды негізді?
  options:
  - id: pruning_and_runtime
    text: FE өз жоспарында Partition және Tablet нысандарын іріктеді, ал Profile BE
      түйіндерінің аз оқығанын көрсетеді
  - id: result_changed
    text: Doris сүзгіге сәйкес жолдарды өткізіп жіберді, сондықтан жылдамырақ сұрау
      енді басқа нәтиже қайтарады
  - id: compaction_ran
    text: Compaction сұрау кезінде орындалып, оқылған әр Tablet ішінде дәл бір Rowset
      қалдырды
  - id: pushdown_only
    text: Сканерлеу предикаты әр Partition және Tablet оқылғанын көрсетеді, сондықтан
      ештеңе іріктелмеген
  answer: pruning_and_runtime
  explanation: 'EXPLAIN ішіндегі қатынастар жоспарды сипаттайды: FE 26 Partition ішінен
    25-ін және таңдалған күннің 10 Tablet нысанының біреуінен басқасының бәрін алып
    тастады. Query Profile BE сканерлеуі нақты не оқығанын тіркейді. Сканерлеу предикаты
    сақтау орнына жақын есептеледі; бұл іріктеумен байланысты, бірақ бірдей емес,
    ал аз жұмыс бәрібір сол нәтижені қайтаруы тиіс.'
passing_score_percent: 80
