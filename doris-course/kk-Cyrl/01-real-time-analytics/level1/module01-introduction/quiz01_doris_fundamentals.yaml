title: '1-модуль тесті: Apache Doris жүйесіне кіріспе'
description: Алты сұрақ 1-модульдегі жүктеме, архитектура және алғашқы жұмыс үдерісіне
  қатысты шешімдерді тексереді; әр оқу мақсатына бір сұрақтан берілген.
questions:
- id: define_doris
  type: single_choice
  objective: Apache Doris жүйесін MPP архитектурасына негізделген, бастапқы коды ашық,
    нақты уақыттағы аналитика мен іздеуге арналған дерекқор ретінде сипаттау.
  prompt: Қай тұжырым Apache Doris жүйесін ең дәл сипаттайды?
  options:
  - id: bi_application
    text: Талдаушылардың диаграммалары мен бақылау тақталарын сақтайтын BI қолданбасы
  - id: object_store
    text: Сұрау қозғалтқыштары үшін Parquet файлдарын сақтайтын объектілік сақтау
      қызметі
  - id: realtime_analytics
    text: MPP арқылы орындайтын, бастапқы коды ашық, нақты уақыттағы аналитика мен
      іздеуге арналған дерекқор
  - id: oltp_plugin
    text: Есептерге арналған талдамалық плагині бар, жолдық транзакциялық дерекқор
  answer: realtime_analytics
  explanation: 'Doris дегеніміз MPP архитектурасына негізделген, бастапқы коды ашық,
    нақты уақыттағы аналитика мен іздеуге арналған дерекқор: ол деректерді бағандар
    бойынша сақтап, талдамалық сұрауларды параллель орындайды. BI құралы мен объектілік
    сақтау Doris жүйесімен бірге жұмыс істей алады, бірақ олардың ешқайсысы Doris
    емес. Doris талдамалық қондырмасы бар транзакциялық дерекқор да емес.'
- id: identify_olap
  type: single_choice
  objective: OLAP пен OLTP жүктемелерін сұрауды орындайтын өнімге емес, сұраудың атқаратын
    жұмысына қарай ажырату.
  prompt: Қай сұрау OLAP жүктемесінің ең айқын мысалы?
  options:
  - id: update_address
    text: Бір тапсырыстың жеткізу мекенжайын жаңартып, өзгерісті бекіту
  - id: revenue_by_region
    text: 100 миллион оқиғаны сканерлеп, түсімді аймақ пен сағат бойынша қосу
  - id: payment_token
    text: Бір тапсырысты рәсімдеу сеансының қазіргі төлем токенін кілтімен іздеу
  - id: reserve_inventory
    text: Себет үшін тауардың бір данасын резервтеп, транзакцияны бекіту
  answer: revenue_by_region
  explanation: Түсім сұрауы көптеген жазбаны сканерлеп, агрегаттайды, бұл талдамалық
    жүктеменің жұмысы. Бір мекенжайды жаңарту, бір токенді кілтімен іздеу және тауардың
    бір данасын резервтеу әрқайсысы бір бизнес нысанын шағын транзакциямен қамтиды.
    Қай өнім орындаса да, бұл OLTP жұмысына жатады.
- id: choose_cdc_reporting
  type: single_choice
  objective: Нақты уақыттағы бақылау тақталары, тұтынушыларға арналған аналитика,
    жүйені бақылау, lakehouse аналитикасы және CDC негізіндегі есеп беру сияқты Doris
    жүйесіне сай жүктемелерді тану.
  prompt: Интернет-сауда компаниясы OLTP дерекқорын негізгі есеп жүйесі ретінде сақтауы
    керек, бірақ бақылау тақталары бекітілген тапсырыс өзгерістерін бірнеше секунд
    ішінде алуы тиіс. Бұл дерекқорда үлкен сканерлеулер орындалмауы керек. Қай шешім
    ең қолайлы?
  options:
  - id: dashboard_on_oltp
    text: Бақылау тақтасының әр агрегаттауын тікелей OLTP дерекқорында орындау
  - id: nightly_export
    text: OLTP дерекқорының толық күй көшірмесін әр түнде бір рет Doris жүйесіне экспорттау
  - id: object_storage_only
    text: Өзгерген жолдарды сұрау қозғалтқышынсыз объектілік сақтау файлдарына көшіру
  - id: cdc_to_doris
    text: Бекітілген өзгерістерді CDC арқылы Doris жүйесіне үздіксіз жеткізу
  answer: cdc_to_doris
  explanation: Өзгерістерді тіркеу операциялық дерекқордың транзакцияларға жауапкершілігін
    сақтап, әр бекітілген өзгерісті Doris жүйесіне жеткізеді; бақылау тақталары талдамалық
    сұрауларын сонда орындайды. OLTP дерекқорын сканерлеу оған талдамалық жүктеме
    қосады, түнгі толық көшірме бір күнге ескіреді, ал сұрау қозғалтқышы жоқ файлдар
    бақылау тақталарының сұрауларына жауап бермейді.
- id: fe_be_responsibilities
  type: single_choice
  objective: Frontend (FE) пен Backend (BE) сұрауды өңдегенде әрқайсысы не істейтінін
    түсіндіру.
  prompt: Қай сипаттама сұраудың Doris арқылы өтуін дұрыс көрсетеді?
  options:
  - id: be_plans_fe_executes
    text: BE үлестірілген жоспарды құрады, ал FE әр жоспар фрагментін орындайды
  - id: client_plans
    text: MySQL клиенті сұрауды жоспарлайды, ал FE мен BE тек репликаларды сақтайды
  - id: fe_plans_be_executes
    text: FE сұрауды жоспарлап, фрагменттерін тағайындайды; BE түйіндері оларды орындайды
  - id: fe_renders_charts
    text: FE браузерде диаграммалар салады, ал BE диаграммаларды SQL сұрауларына айналдырады
  answer: fe_plans_be_executes
  explanation: FE SQL қабылдап, талдайды, үлестірілген сұрау жоспарын құрып, оңтайландырады
    және жоспар фрагменттерін тағайындайды; BE түйіндері фрагменттерді орындайды,
    ал біріктірілген архитектурада кесте деректерін де сақтайды. Бұл міндеттер керісінше
    бөлінбейді, клиент тек SQL жібереді, ал «Frontend» графикалық интерфейс дегенді
    білдірмейді.
- id: choose_architecture
  type: single_choice
  objective: Сақтау мен есептеуі біріктірілген архитектураны сақтау мен есептеуі ажыратылған
    архитектурадан ажырату.
  prompt: Команда тұрақты деректерін ортақ объектілік сақтауда ұстағысы келеді және
    жүктемелерді оқшаулап, тәуелсіз масштабталатын бөлек есептеу топтарын қалайды.
    Қай архитектура осы талаптарға сай?
  options:
  - id: decoupled
    text: Сақтау мен есептеуі ажыратылған архитектура
  - id: integrated
    text: Сақтау мен есептеуі біріктірілген архитектура
  - id: oltp_replica
    text: Транзакциялық дерекқордың оқу репликасы
  - id: files_without_doris
    text: Объектілік сақтаудағы, Doris жүйесінсіз сұрау жасалатын Parquet файлдары
  answer: decoupled
  explanation: Сақтау мен есептеуі ажыратылған архитектурада тұрақты деректер ортақ
    сақтау орнында болады, ал есептеу топтары тәуелсіз масштабталып, жүктемелерді
    оқшаулайды. Біріктірілген архитектурада күйді сақтайтын BE түйіндері деректерді
    жергілікті дискілерде сақтайды, сондықтан сақтау мен есептеу бірге өседі. Транзакциялық
    дерекқордың оқу репликасы да, жай файлдар да есептеу топтарын тәуелсіз масштабтауды
    да, жүктемелерді оқшаулауды да қамтамасыз етпейді.
- id: check_the_load
  type: single_choice
  objective: Doris жүйесіне MySQL-мен үйлесімді протокол арқылы қосылу, кесте құру,
    деректер жүктеу және нәтижені агрегаттау сұрауымен тексеру.
  prompt: 1-зертханалық жұмыста INSERT INTO events SELECT ... FROM S3(...) операторы
    10,158,080 өңделген жол туралы хабарлайды. Қай тексеру events ішкі кестесінің
    қазір нені сақтап тұрғанын көрсетеді?
  options:
  - id: count_and_range
    text: events кестесінен COUNT(*), MIN(event_time) және MAX(event_time) сұрау
  - id: rerun_s3_select
    text: LIMIT 10 бар S3 TVF сұрауын қайта орындап, оның он жолын салыстыру
  - id: show_backends
    text: SHOW BACKENDS орындап, BE үшін Alive = true екенін тексеру
  - id: container_health
    text: docker ps командасы doris-rta контейнерін healthy күйінде көрсететінін тексеру
  answer: count_and_range
  explanation: 'Енгізу нәтижесі бір оператордың не жазғанын көрсетеді; кестеге сұрау
    жасау оның қазір нені сақтап тұрғанын көрсетеді: 2019-12-01 00:00:12 уақытынан
    2020-03-11 04:53:08 уақытына дейінгі 10,158,080 жол. 1-зертханалық жұмыс осы мәндерді
    тексереді. S3 TVF кестені емес, S3 ішіндегі файлдарды оқиды, ал SHOW BACKENDS
    пен контейнердің сау күйі кестенің мазмұнын емес, Doris жұмыс істеп тұрғанын көрсетеді.'
passing_score_percent: 80
