title: '8-модуль тесті: Apache Doris жүйесінде сұрауларды жеделдету'
description: Алты дербес сценарий анықтамалар, жоспарлар, орындалу дәлелдері және
  бизнес нәтижелерін шатастырмай, Doris сұрауларын жеделдету құрылымдарын таңдап,
  тексере алатыныңызды тексереді; әр оқу мақсатына бір сұрақтан.
questions:
- id: reuse_a_definition
  type: single_choice
  objective: Қалыпты көріністі, қолмен толтырылатын жиынтық кестені, синхронды және
    асинхронды материалданған көріністі ажырату.
  prompt: Бірнеше бақылау тақтасы сатып алу түсімінің бір тексерілген SQL анықтамасын
    ортақ пайдалануы тиіс. Анықтама орталықтан өзгеруі мүмкін және топ екінші сақталған
    дерек көшірмесін де, жаңарту үдерісін де қаламайды. Қай нысан тікелей сай?
  options:
  - id: regular_view
    text: Ортақ SQL анықтамасын сақтайтын қалыпты көрініс
  - id: manual_summary_table
    text: Жоспарланған тапсырма алдын ала есептелген жолдармен толтыратын жиынтық
      кесте
  - id: synchronous_mv
    text: Әр негізгі кесте жазуы қолдайтын синхронды материалданған көрініс
  - id: asynchronous_mv
    text: Жоспарланған тапсырма жаңартатын асинхронды материалданған көрініс
  answer: regular_view
  explanation: 'Қалыпты көрініс тек анықтаманы сақтайды: әр сұрау оны негізгі кестелерге
    жаяды, сондықтан қолдайтын сақталған көшірме жоқ. Қалған үшеуі жол сақтап, жүктеу,
    жазумен қолдау немесе жаңарту жұмысын қосады. Жайылған сұраудың жеткілікті жылдам
    болуы — жоспар мен Profile үшін бөлек сұрақ.'
- id: choose_materialization
  type: single_choice
  objective: SQL ауқымы, өзектілік талабы және жазу не жаңарту шығыны бойынша синхронды
    немесе асинхронды материалдандыруды таңдау.
  prompt: Санат бақылау тақтасы оқиға фактілерін өнім өлшемімен біріктіріп, түсімді
    агрегаттайды. Бес минут кідіріс рұқсат етіледі және топ факт кестесінің әр жазуына
    қолдау жұмысын қосуды қаламайды. Қай бастапқы таңдау сай?
  options:
  - id: synchronous_mv
    text: Join нәтижесін әр жазумен өзекті ұстайтын синхронды материалданған көрініс
  - id: asynchronous_mv_with_policy
    text: Жаңарту саясаты бес минуттан аспайтын асинхронды материалданған көрініс
  - id: regular_view
    text: Join атауын бір рет беру біріктірілген нәтижесін сақтайтындықтан, қалыпты
      көрініс
  - id: manual_summary
    text: Жолдары өздігінен өзекті қалатын, жаңарту шарты жоқ жиынтық кесте
  answer: asynchronous_mv_with_policy
  explanation: Асинхронды материалданған көрініс көп кестелік нәтиже сақтап, жазулардан
    бөлек жаңара алады; бұл қабылданған кідірісті айқын етеді. Синхронды материалданған
    көрініс бір кестелік анықтаманы қолдап, әр жүктеуге жұмыс қосады, қалыпты көрініс
    нәтиже сақтамайды, ал қолмен жасалған жиынтыққа оны өзекті ұстайтын үдеріс қажет.
    Таңдау жаңарту нақты бес минут талабына сай болғанда ғана жарамды.
- id: stored_grain
  type: single_choice
  objective: Материалданған нәтиже басқа сұрауға жауап беруге қажетті өлшемдер мен
    метрика күйін сақтайтынын анықтау.
  prompt: Сақталған жиынтықта әр (event_hour, region) үшін event_count және revenue_sum
    бар бір жол сақталған. Жаңа есепке аймақ бойынша күндік revenue_sum және COUNT(DISTINCT
    buyer_id) қажет. Сақталған жиынтық неге жауап бере алады?
  options:
  - id: both_measures
    text: Екеуіне де, өйткені сағаттық жиынтық кез келген күндік метрикаға ірілене
      алады
  - id: daily_revenue_only
    text: Тек күндік түсімге; жиынтықта бірегей санауға сатып алушы сәйкестіктері
      жоқ
  - id: distinct_buyers_only
    text: Тек бірегей сатып алушыларға, өйткені event_count сатып алушы санын алмастыра
      алады
  - id: neither_measure
    text: Ешқайсысына, өйткені материалданған нәтиже тек өз GROUP BY шартына дәл жауап
      береді
  answer: daily_revenue_only
  explanation: Сағаттық түсім қосындылары қосылады, сондықтан аймақ бойынша күндік
    қосындыларға іріленеді. Бірегей сатып алушы санын оқиға сандарынан немесе сағаттық
    бірегей сандардан қалпына келтіруге болмайды, өйткені бір сатып алушы бірнеше
    сағатта болуы мүмкін; жиынтыққа идентификаторлар немесе біріктірілетін күй қажет.
    Ұсақтау сақталған түйіршіктілік жаңа сұрауға керегін сақтағанда ғана көмектеседі.
- id: choose_an_index
  type: single_choice
  objective: Қызмет етуі тиіс предикатқа қарай инверттелген индекс, BloomFilter индексі
    немесе NGram BloomFilter индексін таңдау.
  prompt: Оқиға кестесі event_time бойынша сұрыпталған. Зерттеушілерге бастапқы кілт
    бағаны ретінде пайдалы емес нақты бір сандық product_id жолдарының егжей-тегжейі
    жиі қажет және өте аз жол сәйкес келеді. Қай қосымша құрылым ең тікелей бастапқы
    тәсіл?
  options:
  - id: inverted_index
    text: product_id бойынша токенге бөлінбейтін инверттелген индекс және кейін бақыланатын
      салыстыру
  - id: ngram_bloomfilter
    text: Дәл сандық іздеу ішкі жол сәйкестігі болғандықтан, NGram BloomFilter индексі
  - id: stored_runtime_filter
    text: Doris кейінгі іздеулерге кестемен бірге сақтайтын Join Runtime Filter
  - id: longer_prefix_index
    text: Өнім іздеулерін де тарылтатын event_time бойынша ұзынырақ Prefix Index
  answer: inverted_index
  explanation: Токенге бөлінбейтін инверттелген индекс әр product_id мәнін әр Segment
    ішіндегі сәйкес Row ID мәндеріне сәйкестендіреді, бұл іріктемелі теңдік іздеуіне
    сай; индекстелмеген көшірмемен бақыланатын салыстыру не үнемдегенін көрсетеді.
    NGram BloomFilter ішкі жол сәйкестігіне қызмет етеді, Runtime Filter тек бір Join
    кезінде бар, ал Prefix Index product_id емес, сұрыптау кілтінің бастапқы бағандарын
    қамтиды.
- id: estimates_and_actuals
  type: single_choice
  objective: Жеделдету құрылымын тексергенде құру күйін, жоспар таңдауын, статистиканы
    және орындалу дәлелін ажырату.
  prompt: ANALYZE жаңа статистика жинағаннан кейін Join EXPLAIN нәтижесінде cardinality=37,400,
    ал Query Profile ішінде Join амалынан 17,798 жол шыққаны көрсетілген. Айырмашылықты
    не түсіндіреді?
  options:
  - id: estimate_vs_actual
    text: EXPLAIN статистикадан жасалған болжамды көрсетеді; Profile нақты жолдарды
      санайды
  - id: stale_statistics
    text: ANALYZE аяқталмаған, өйткені жаңа статистика нақты жол санын берер еді
  - id: profile_wrong
    text: Profile қате, өйткені жоспар cardinality мәні — сұрау нақты оқыған жолдар
  - id: rewrite_used
    text: Сұрауға материалданған көрініс жауап берді, сондықтан екі сан әртүрлі кестелерді
      сипаттайды
  answer: estimate_vs_actual
  explanation: 'Жол саны мен бірегей мәндер сияқты статистика оңтайландырғышқа болжам
    береді: екі әртүрлі оқиға түрі және жиіліктер жоқ болғанда, жолдардың жартысын
    сатып алу деп болжады. EXPLAIN cardinality мәні — сол болжам, ал Profile бір орындаудың
    не істегенін санайды. Жаңа статистика болжамдарды дәл етпей жақсартады, ал жоспардағы
    таңдалған Scan материалданған көрініс қолданылғанын көрсетеді.'
- id: worth_the_cost
  type: single_choice
  objective: Құрылымның оқу үнемі сақтау, жазу және жаңарту шығынын ақтайтынын шешу.
  prompt: Есеп күніне төрт рет орындалады және асинхронды материалданған көрініс жасалмас
    бұрын кідіріс мақсатына жеткен. Негізгі кестесіне үздіксіз жазулар келеді, көрініс
    елеулі сақтау және жаңарту жүктемесін қосады, ал бизнес ағымдағыға жуық деректерді
    талап етеді. Дәлел нені қолдайды?
  options:
  - id: drop_the_mv
    text: 'Көріністі жою: сирек оқу пайдасы жаңарту мен сақтауды ақтамайды'
  - id: keep_after_one_run
    text: Көріністі сақтау, өйткені бір жылдамырақ орындау тұрақты жақсаруды көрсетеді
  - id: refresh_less
    text: Сирегірек жаңарту, өйткені мұнда тек жаңарту шығыны маңызды
  - id: replace_base_table
    text: Негізгі кестені көрініспен ауыстыру, сонда жазу мен сақтау шығындары жоғалады
  answer: drop_the_mv
  explanation: 'Есеп көрініссіз мақсатына жеткен және сирек орындалады, ал көрініс
    жазуы көп кестеге қайталанатын жаңарту жұмысын, сақтауды және өзектілік тәуекелін
    қосады. Бір жылдамырақ орындау бұдан басым емес. Шешімді жорамалдарымен тіркеңіз:
    жиірек сұрау, қатаңырақ кідіріс мақсаты немесе арзанырақ жаңарту оны өзгертер
    еді.'
passing_score_percent: 80
