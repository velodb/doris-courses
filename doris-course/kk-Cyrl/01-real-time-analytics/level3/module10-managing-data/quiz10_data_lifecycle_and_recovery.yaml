title: '10-модуль тесті: Apache Doris жүйесінде сақтау шығындары мен деректердің өмірлік
  циклін басқару'
description: Алты дербес сценарий сығу және Partition өмірлік цикл саясатын таңдай
  алатыныңызды, уақыт терезелері мен дәлелін түсіндіруді және дұрыс қалпына келтіру
  шекарасын қолдануды тексереді; әр оқу мақсатына бір сұрақтан.
questions:
- id: compression_goal
  type: single_choice
  objective: Баған кодтауы мен Page сығуының бөлек рөлдерін түсіндіру және шектелген
    ресурсқа қарай сығу алгоритмін таңдау.
  prompt: Ыстық оқиға кестесі үздіксіз сканерленеді. Сұрау CPU толық жүктелген, бірақ
    сақтау сыйымдылығы мен оқу өткізуінде қор көп және ашу аз CPU жұмсаса, топ үлкенірек
    кестені қабылдайды. Келесі эксперимент нені сынауы тиіс?
  options:
  - id: measure_fast_decompression
    text: Сұрау CPU, кідіріс және қосымша байттарды өлшей отырып, жылдам ашылатын
      алгоритм
  - id: highest_ratio_unmeasured
    text: CPU дерегінсіз шағын сақтау есебінде ең жоғары қатынасы бар алгоритм
  - id: disable_encoding
    text: Кодтау мен Page сығуы бір қабат болғандықтан, баған кодтауын өшіру
  - id: single_fastest_run
    text: Ортақ сынақ ортасында ең қысқа бір өткен уақыт көрсеткен кез келген алгоритм
  answer: measure_fast_decompression
  explanation: Шектелген ресурс — CPU, сондықтан LZ4 сияқты ашуы арзан алгоритмді
    сынап, қосымша сақтау және енгізу/шығарумен бірге сұрау CPU мен кідірісті өлшеңіз.
    Жоғары сығу қатынасы көп CPU жұмсауы мүмкін, бір шулы орындау алгоритмдерге орын
    бере алмайды және баған кодтауы — Page сығуынан бұрынғы бөлек қабат.
- id: fair_comparison
  type: single_choice
  objective: Кіріс, орналасу, жүктеу және репликалар бірдей қалатын әділ сығу салыстыруын
    жобалау.
  prompt: Екі Duplicate Key кестесінде сол жолдар бар. events_lz4f бір Partition,
    төрт Bucket және replication_num = 1 қолданады. events_zstd екі Partition, әрқайсысына
    сегіз Bucket және replication_num = 3 қолданады. SHOW DATA events_zstd үлкенірек
    екенін көрсетеді. Бұл нені білдіреді?
  options:
  - id: layouts_not_comparable
    text: 'Алгоритмдер туралы ештеңе: орналасулар мен реплика сандары әртүрлі'
  - id: lz4f_better
    text: Кестесі кішірек көрсетілгендіктен, LZ4F бұл деректерді жақсырақ сығады
  - id: zstd_tripled_rows
    text: ZSTD жолдарды үш рет сақтады, сондықтан SQL әр жолдың үш көшірмесін қайтарады
  - id: divide_by_three
    text: ZSTD өлшемін үшке бөлу LZ4F кестесімен әділ салыстыру береді
  answer: layouts_not_comparable
  explanation: Әр Partition ішіндегі әр Bucket — өз файлдары бар Tablet және SHOW
    DATA әр репликаны қамтиды, сондықтан үш көшірмелі 16 Tablet бір көшірмелі 4 Tablet-пен
    салыстырылмайды. Үшке бөлу Tablet, Segment және индекс шығынын әлі қалдырады,
    ал репликалар сұрауда жолдарды ешқашан қайталамайды. Екі кестені сол орналасу,
    реплика, кіріс және топтамалармен жүктеңіз.
- id: partition_modes
  type: single_choice
  objective: Partition не жасайтыны және не жоятыны бойынша Manual, Auto немесе Dynamic
    Partitioning таңдау.
  prompt: 'Үш талапты Partition режиміне сәйкестендіріңіз: (1) әкімші мақұлданған
    есеп ауқымдарын жасайды; (2) бұрын кездеспеген tenant мәндері дерегі келгенде
    Partition жасайды; (3) жүйе сағатқа негізделген жеті күндік терезені ұстап, ертеңгі
    ауқымды дайындайды.'
  options:
  - id: manual_auto_dynamic
    text: (1) Қолмен Partition бөлу; (2) Автоматты Partition бөлу; (3) Динамикалық
      Partition бөлу
  - id: dynamic_manual_auto
    text: (1) Динамикалық Partition бөлу; (2) Қолмен Partition бөлу; (3) Автоматты
      Partition бөлу
  - id: auto_dynamic_manual
    text: (1) Автоматты Partition бөлу; (2) Динамикалық Partition бөлу; (3) Қолмен
      Partition бөлу
  - id: dynamic_for_all
    text: Үшеуіне де Dynamic Partitioning, өйткені ол кез келген жетіспейтін мәнді
      жасайды
  answer: manual_auto_dynamic
  explanation: Manual Partitioning шекараларды айқын бақылауда ұстайды, Auto Partitioning
    мән алғаш келгенде Partition жасайды, Dynamic Partitioning сағатқа сай болашақ
    ауқымдарды жасап, ескілерін жояды. AUTO RANGE кестелері partition.retention_count
    арқылы тарихи ауқым санын шектей алады, бірақ бұл сан саясаты бүгінге қатысты
    терезе анықтамайды. Dynamic Partitioning кеш мәнге Partition жасамайды.
- id: hourly_window
  type: single_choice
  objective: Dynamic Partition терезесін уақыт бірлігі, ығысулар және уақыт белдеуі
    бойынша оқу және кеш деректермен не болатынын болжау.
  prompt: Asia/Shanghai 10:30 кезінде кесте time_unit = HOUR, start = -2, end = 1,
    create_history_partition = true және сол уақыт белдеуін қолданады. 08:00 және
    07:59 оқиғалары келеді. Не болады?
  options:
  - id: four_hourly_ranges
    text: 08:00 оқиғасы төрт сағат ауқымының ең ескісіне түседі; 07:59 оқиғасы өтпейді
  - id: latest_two_hours
    text: Екеуі де жүктеледі және әр жол өз уақытынан дәл екі сағат кейін мерзімінен
      шығады
  - id: right_closed_ranges
    text: Ауқымдар оңнан жабық болғандықтан, 08:00 оқиғасы 08:00 аяқталатын ауқымға
      түседі
  - id: minute_partition
    text: HOUR тек белгі болғандықтан, 07:59 оқиғасы бір минуттық Partition жасайды
  answer: four_hourly_ranges
  explanation: '-2 мен +1 ығысулары төрт жартылай ашық сағат ауқымын береді: [08:00,
    09:00) мен [11:00, 12:00) аралығы. 08:00 оқиғасы 08:00 басталатын ауқымға тиесілі,
    ал 07:59 оқиғасының ауқымы жоқ, сондықтан қалыпты енгізу сәтсіз. 11:00 кезінде
    тұтас ең ескі сағат келесі жоспарлағыш тексеруінде жоюға жарамды болады; жолдар
    бір-бірден мерзімінен шықпайды.'
- id: expiry_evidence
  type: single_choice
  objective: Partition мерзімі өткенде қабылданған конфигурацияны, жоспарлағыш әрекетін,
    SQL көрінуін және сақтау орнын босатуды ажырату.
  prompt: Оператор сағаттық кестеде dynamic_partition.start мәнін -3-тен -2-ге тарылтады.
    SHOW CREATE TABLE жаңа мәнді бірден көрсетеді, бірақ бес минуттан кейін SHOW PARTITIONS
    ең ескі сағатты әлі тізеді және жолдары қайтарылады. FE тексеру аралығы әдепкі
    600 секунд. Ең ықтимал түсіндірме қандай?
  options:
  - id: scheduler_not_yet
    text: Ереже қабылданған, бірақ жоспарлағыш келесі тексеруін әлі орындамаған
  - id: rule_ignored
    text: Жасалған терезе тарылмайтындықтан, Doris жаңа start мәнін елемеді
  - id: rows_expire_individually
    text: Әр жол ауқыммен емес, өз оқиға уақытынан үш сағат кейін жеке мерзімінен
      шығады
  - id: needs_manual_drop
    text: Dynamic Partition кестесі ескі ауқымдарды тек қолмен DROP PARTITION кейін
      жояды
  answer: scheduler_not_yet
  explanation: ALTER TABLE ... SET ережені бірден өзгертеді, бірақ жоспарлағышты орындамайды.
    Dynamic Partition жоспарлағышы ережені әр dynamic_partition_check_interval_seconds
    сайын келесі тексеруде қолданады, ал SHOW DYNAMIC PARTITION TABLES соңғы орындалуын
    көрсетеді. 10-зертханалық жұмыс жою секундтар ішінде болсын деп аралықты қысқартады.
    Ауқым жоғалғаннан кейін де байттары дискіде біраз қала алады.
- id: recovery_boundary
  type: single_choice
  objective: Recycle bin қашан жеткілікті және қашан тәуелсіз сақтық көшірме не дереккөзден
    қайта ойнату қажет екенін шешу.
  prompt: Күндік Dynamic Partition саясаты 30 күн сақтайды. Терезе жылжығаннан кейін
    SHOW PARTITIONS ең ескі күнді тізбейді. Бөлек, оператор бір сағат бұрын қолмен
    Partition FORCE қолданбай жойған және ол recycle bin ішінде көрінеді. Қай қорытынды
    негізді?
  options:
  - id: recover_drop_backup_for_rest
    text: RECOVER жақындағы жоюды қалпына келтіре алады; мерзімі өткен күндерге сақтық
      көшірме не қайта ойнату қажет
  - id: compaction_erased
    text: Compaction Segment файлдарын бірден өшіргендіктен, екі ауқым да біржола
      жоғалған
  - id: replicas_restore
    text: Репликалар нұсқа тарихын сақтайтындықтан, кез келгені екі ауқымның бірін
      қайтара алады
  - id: recycle_bin_forever
    text: FORCE кейін де оператор босатқанша recycle bin екі ауқымды сақтайды
  answer: recover_drop_backup_for_rest
  explanation: 'FORCE жоқ жою recycle bin ішінде шектеулі уақыт, әдепкіде бір күн
    қалады, сондықтан RECOVER Partition қайтара алады. Мерзімі өткен күн де біраз
    recycle bin ішінде қалуы мүмкін, бірақ сақтау саясаты бұған тәуелді болмауы тиіс:
    терезеден ұзақ өмір сүруі тиіс дерекке, FORCE жоюына не жоғалған кластерге тәуелсіз
    сақтық көшірме немесе дереккөзді қайта ойнату қажет. Репликалар жоюды да көшіреді
    және recycle bin сол кластерге тиесілі.'
passing_score_percent: 80
