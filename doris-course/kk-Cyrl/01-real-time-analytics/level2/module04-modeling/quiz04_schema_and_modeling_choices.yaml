title: '4-модуль тесті: Apache Doris жүйесінде деректерді модельдеу'
description: Алты дербес бизнес сценарийі 4-модульдің модельдеу шешімдерін тексереді;
  әр оқу мақсатына бір сұрақтан. Жалғастырмас бұрын түсіндірмені оқып, кез келген
  жауапты түзетіңіз.
questions:
- id: separate_grains
  type: single_choice
  objective: Кесте түйіршіктілігін оның дереккөз шартынан анықтау және егжей-тегжейлі
    деректер мен жиынтық түйіршіктілігін бөлек кестелерде сақтау.
  prompt: Бір сату кестесі amount бағанында үш жолды араластырады. Екі жол — құны
    12.00 және 18.00 жеке сатып алу оқиғалары. Үшінші жол — сол екі сатып алудың 30.00
    күндік жиынтығы; ол тағы бір сатып алу емес. Бақылау тақтасы үш жолға да SUM(amount)
    орындайды. Нені өзгерту керек?
  options:
  - id: decimal_type
    text: Үш жолдың қосындысы 30.00 болуы үшін amount типін DECIMAL деп өзгерту
  - id: separate_grains
    text: Сатып алулар мен күндік жиынтықты түйіршіктілігі айқын екі кестеде сақтау
  - id: unique_per_customer
    text: Оқиғалар мен жалпы соманы сақтау үшін кестені әр тұтынушыға Unique Key ету
  - id: row_type_sort_key
    text: SUM жиынтық жолын өткізіп жіберуі үшін сұрыптау кілтіне жол түрі бағанын
      қосу
  answer: separate_grains
  explanation: Бақылау тақтасы 12.00 + 18.00 + 30.00 = 60.00 қосады, өйткені жиынтық
    екі сатып алуды әлдеқашан қамтиды. Жеке сатып алулар мен күндік жиынтықтар — екі
    түйіршіктілік және екі кестеге тиесілі; әрқайсысына өз түйіршіктілігі жауап беретін
    сұрақтар үшін сұрау жасалады. DECIMAL дәлдікті сақтайды, бірақ жолды жоймайды,
    сұрыптау кілті сүзбейді, ал әр тұтынушыға бір жол оқиға тарихын жоғалтар еді.
- id: duplicate_key_columns
  type: single_choice
  objective: Қайталанатын кілтке қажетті әрекетке қарай Duplicate Key, Unique Key
    немесе Aggregate Key моделін таңдау.
  prompt: Сенсор тарихы кестесі DUPLICATE KEY(observed_at, sensor_id) пайдаланады.
    Екі қабылданған өлшемнің уақыт белгісі мен сенсоры бірдей, мәндері 21 және 22;
    екеуі де қолжетімді қалуы тиіс. Бұл анықтама не істейді?
  options:
  - id: retains_both
    text: Екі өлшемді де сақтайды; бұл кілт бағандары бірегейлікті емес, сұрыптау
      ретін орнатады
  - id: keeps_latest
    text: Тек 22 сақтайды, өйткені кейінгі жазу алдыңғы өлшемді ауыстырады
  - id: adds_values
    text: Екі мәнді қосып, сол уақыт белгісі үшін 43 болатын бір өлшем сақтайды
  - id: rejects_repeat
    text: Барлық кілт бағандары бар жолды қайталағандықтан, екінші өлшемді қабылдамайды
  answer: retains_both
  explanation: Duplicate Key моделі барлық кілт бағаны қайталанса да, әр қабылданған
    жолды сақтайды; бұл модельде кілт бағандары сұрыптау кілтін анықтайды. Unique
    Key моделі бұрынғы күйді ауыстырар еді, ал Aggregate Key моделі мәндерді жарияланған
    функциясымен біріктірер еді. Ешбір модель қайталанатын кілтті қабылдамай тастамайды.
- id: additive_summary
  type: single_choice
  objective: Есеп беру талабынан жиынтық өлшемдері мен қосылатын метрикаларын шығару
    және оны егжей-тегжейлі деректермен салыстырып тексеру.
  prompt: Күндік жиынтық әр (day, store) үшін бір жол сақтауы тиіс. Екі бөлек топтама
    сол күн мен дүкенге 40.00 және 25.00 түсім үлесін береді. Қай анықтама ешбір үлесті
    ауыстырмай, сол жол үшін 65.00 жиынтығын береді?
  options:
  - id: unique_key
    text: Кәдімгі мән бағаны ретіндегі revenue бар UNIQUE KEY(day, store)
  - id: aggregate_by_day_only
    text: REPLACE бағаны ретіндегі store және SUM ретіндегі revenue бар AGGREGATE
      KEY(day)
  - id: aggregate_sum
    text: SUM мән бағаны ретінде жарияланған revenue бар AGGREGATE KEY(day, store)
  - id: revenue_in_key
    text: revenue мән бағаны жоқ AGGREGATE KEY(day, store, revenue)
  answer: aggregate_sum
  explanation: Есеп өлшемдері — Aggregate Key, ал түсім — SUM жарияланған қосылатын
    метрика, сондықтан екі үлес 65.00 болып бірігеді. Unique Key алғашқы үлесті ауыстырады,
    кілттен store алып тастау дүкендерді біріктіреді, ал revenue кілтте болуы жолды
    сома бойынша бөледі. Мұндай жиынтықты егжей-тегжейлі деректермен COUNT(*) арқылы
    емес, метрикаларының SUM қосындысы арқылы салыстырып тексеріңіз.
- id: decimal_and_varchar
  type: single_choice
  objective: Идентификатор, уақыт, ақша, санат және ішкі құрылымды мәндердің типтерін
    олардың мағынасы мен қажетті амалдарына қарай таңдау.
  prompt: Жеткізуші дәл екі ондық таңбасы бар, бәрі бір миллионнан төмен сомаларды
    және әртүрлі өнімді білдіретін 00127 пен 127 сияқты өнім кодтарын жібереді. Есептер
    қазір мәтіндік сомаларды қоспас бұрын CAST қолданады. Қай типтелген шарт сай келеді?
  options:
  - id: double_and_bigint
    text: Сомаларға DOUBLE және өнім кодтарына BIGINT
  - id: varchar_for_both
    text: Екі өріске де VARCHAR және оларды қосатын әр есепте CAST
  - id: decimal_and_varchar
    text: Сомаларға DECIMAL(12,2) және өнім кодтарына VARCHAR
  - id: bigint_and_int
    text: Центпен берілген сомаларға BIGINT және өнім кодтарына INT
  answer: decimal_and_varchar
  explanation: DECIMAL(12,2) көрсетілген ауқымды қамтып, дәл ондық сомаларды сақтайды,
    ал VARCHAR 00127 мен 127 әртүрлі өнім екенін білдіретін бастапқы нөлдерді сақтайды.
    DOUBLE жуық, бүтін кодтар екі өнімді біріктіреді, ал әр есептегі CAST тексеруді
    кестеге қосудың орнына кейінге қалдырады.
- id: omission_and_null
  type: single_choice
  objective: Жоқ, түсіріліп қалдырылған немесе жарамсыз мәндер үшін `NULL`, `NOT NULL`
    және `DEFAULT` ажырату.
  prompt: Міндетті емес жеткізу ескертпесі VARCHAR(100) NULL DEFAULT 'not provided'
    пайдаланады. A сәлемдемесінің INSERT операторы бұл бағанды түсіріп қалдырады;
    B сәлемдемесінің INSERT операторы NULL айқын береді. Екі енгізу де сәтті. Не сақталады?
  options:
  - id: both_null
    text: Баған NULL мәндеріне рұқсат еткендіктен, екі сәлемдеме де NULL сақтайды
  - id: both_default
    text: Әдепкі мән кез келген жетіспейтін мәнді ауыстыратындықтан, екеуі де not
      provided сақтайды
  - id: omitted_null_explicit_default
    text: A сәлемдемесі NULL, ал B сәлемдемесі not provided сақтайды
  - id: omitted_default_explicit_null
    text: A сәлемдемесі not provided, ал B сәлемдемесі NULL сақтайды
  answer: omitted_default_explicit_null
  explanation: Түсіріліп қалдырылған баған жарияланған әдепкі мәнін алады, ал айқын
    NULL NULL рұқсат етілетін бағанда NULL болып қалады. NULL белгісіз немесе жоқ
    мәнге рұқсат етеді, DEFAULT баған түсірілгенде не сақтау керектігін айтады, ал
    NOT NULL ескертпені ойдан жасаудың орнына B сәлемдемесінің енгізуін қабылдамас
    еді.
- id: layout_from_workload
  type: single_choice
  objective: Кесте Partition бөлімдерін, Bucket ұяшықтарын және сұрыптау кілтін уақыт
    сүзгілеріне, өмірлік цикліне, таратуына және көлеміне қарай жобалау.
  prompt: Кесте құрылғылардың температура өлшемдерін үстемелеп қосады. Деректер тұтас
    күнтізбелік айлармен сақталып, жойылады және сұраулардың көбі құрылғылар бойынша
    соңғы уақыт ауқымдарын оқиды. Құрылғы ID мәндері көп және біркелкі таралған; region
    бағанында қатты қисайған үш мән ғана бар. Қай бастапқы орналасу сай келеді?
  options:
  - id: month_partitions_device_buckets
    text: Айлық Partition бөлімдері, HASH(device_id) Bucket ұяшықтары және уақыттан
      басталатын сұрыптау кілті
  - id: region_partitions
    text: Аймақ Partition бөлімдері, HASH(region) Bucket ұяшықтары және device_id
      басындағы сұрыптау кілті
  - id: device_partitions
    text: Әр құрылғыға бір Partition, HASH(region) Bucket ұяшықтары және region басындағы
      сұрыптау кілті
  - id: region_buckets
    text: Айлық Partition бөлімдері, HASH(region) Bucket ұяшықтары және аймақтан басталатын
      сұрыптау кілті
  answer: month_partitions_device_buckets
  explanation: Айлық Partition бөлімдері тұтас айлық өмірлік циклге сай, көп әрі біркелкі
    таралған құрылғы ID мәндерін хэштеу әр Bucket-ті пайдаланады, ал уақыттан басталатын
    сұрыптау кілті жиі ауқым сүзгісіне сай. Үш қисайған аймақ жолдарды аз ғана Bucket
    ішінде шоғырландырар еді. Bucket саны әлі де дерек көлемі мен ресурстарға байланысты.
passing_score_percent: 80
