short_title: Observability
description: Build workflows for logs, metrics, traces, visualization, analysis, and alerting.
presentation:
  theme: green
  badge_label: OBSERVE
lab_setup:
  python_version: '3.12'
  requirements: requirements.txt
  supported_platforms:
  - macos
  - linux
  - wsl2
  guide: README.md
  dependencies:
  - Git
  - Docker Engine or Docker Desktop with Compose v2
  - Python 3.11 or newer
  - JupyterLab
  - The Dog Stack services described by the notebook
completion:
  enabled: true
  strategy: all_required_modules
  quiz_credit_policy: preserve_passed
certificate:
  enabled: true
  code: OBS
  template: course_completion
levels:
  '1': Build the observability foundation
  '2': Model, analyze, and alert
