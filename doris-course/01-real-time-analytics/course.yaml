short_title: Real-time Analytics
description: Build fresh analytical datasets, model them for real queries, and interpret distributed execution evidence.
presentation:
  theme: blue
  badge_label: REAL-TIME
lab_setup:
  python_version: '3.12'
  requirements: requirements.txt
  supported_platforms:
  - macos
  - linux
  - wsl2
  guide: README.md
  dependencies:
  - Git
  - Docker Engine or Docker Desktop with Compose v2
  - Python 3.11 or newer
  - JupyterLab
completion:
  enabled: true
  strategy: all_required_modules
  quiz_credit_policy: preserve_passed
certificate:
  enabled: true
  code: RTA
  template: course_completion
levels:
  '1': Build the foundation
  '2': Design and query with intent
  '3': Operate for performance and resilience
