title: D02：观察存储和写入批次
description: 五道单选题；不需要数据库连接，提交后查看解释。
questions:
- id: q1
  objective: 沿一条查询说明 FE 规划与 BE 执行的分工。
  prompt: 一条订单分析 SQL 从客户端进入 Doris，哪条路径正确？
  options:
  - id: a
    text: 客户端 → FE 规划并分发 → BE 执行 → 返回结果
  - id: b
    text: 客户端 → BE 生成所有计划 → FE 扫描列文件
  - id: c
    text: 客户端 → Compaction → FE 执行聚合
  answer: a
  explanation: FE 负责 SQL 规划和协调，BE 执行计划中的扫描与计算。Compaction 是后台存储合并，不是每条查询的必经执行入口。
- id: q2
  objective: 解释 Table、Partition、Tablet、Rowset 和 Segment 的层次。
  prompt: 表有两个分区，每个分区四个桶。怎样理解其存储层次？
  options:
  - id: a
    text: 全表四个 Tablet，每个 Tablet 等于一条订单
  - id: b
    text: 共八个 Tablet；Tablet 内有 Rowset，Rowset 内有 Segment
  - id: c
    text: 共八个 Rowset，Rowset 数永远等于桶数
  answer: b
  explanation: 每个分区各有四个 Tablet，共八个。Rowset 随写入和合并变化，Segment 是其内部列式文件，不能把桶数当成固定 Rowset 数。
- id: q3
  objective: 说明写入批次、数据可见性与后台 Compaction 的关系。
  prompt: 写入后 Compaction 尚未完成，是否一定不能查询到新数据？
  options:
  - id: a
    text: 是，只有合并后的文件才能供查询
  - id: b
    text: 否，只要 HTTP 返回就一定对所有查询可见
  - id: c
    text: 否，可见性取决于事务发布和接口语义，不要求等待 Compaction
  answer: c
  explanation: 数据可见与后台合并是不同过程。Compaction 改善物理组织但应保持逻辑结果；还要区分写入接口的响应与发布状态。
- id: q4
  objective: 控制表结构和数据，比较批量与逐行写入的结果。
  prompt: 比较一批十行和分十次写入，哪种实验设计合理？
  options:
  - id: a
    text: 保持数据、Schema、桶数和副本相同，固定 off_mode，先核对两表结果
  - id: b
    text: 同时增加逐行表的桶数，用最短耗时判断优劣
  - id: c
    text: 一张用历史数据，另一张用模拟订单，只比较 COUNT(*)
  answer: a
  explanation: 控制无关变量后才能解释差异。本课先确认两表都是十行、12220.60，再记录元数据；off_mode 是本次对照条件，不是所有生产场景的建议。
- id: q5
  objective: 区分查询计划、存储元数据和运行时证据各能说明什么。
  prompt: 怎样组合 EXPLAIN、Tablet 元数据和 Query Profile？
  options:
  - id: a
    text: EXPLAIN 的计划裁剪数就是实际磁盘读取量
  - id: b
    text: 计划看预期扫描，元数据看采样状态，Profile 看运行时工作量
  - id: c
    text: VersionCount 可以直接替代全部 Rowset 和 Segment 清单
  answer: b
  explanation: 三类证据回答不同问题。后台合并和缓存会影响观测，十行样本或一次 VersionCount 采样不能证明固定性能提升。
