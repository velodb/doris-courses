title: D02：观察存储和写入批次
description: 五道单选题；不需要数据库连接，提交后查看解释。
questions:
- id: q1
  objective: 沿一条查询说明 FE 规划与 BE 执行的分工。
  prompt: 一条订单分析 SQL 从客户端进入 Doris，哪条路径正确？
  options:
  - id: a
    text: A. 客户端提交 SQL → BE 生成分布式计划 → FE 汇总扫描结果
  - id: b
    text: B. 客户端生成分布式计划 → FE 转发 → BE 按片段执行
  - id: c
    text: C. 客户端提交 SQL → FE 规划 → 等待一次 Compaction → BE 执行
  - id: d
    text: D. 客户端提交 SQL → FE 规划并分发 → BE 执行 → 协调返回结果
  answer: d
  explanation: A：规划职责在 FE，不是由 BE 统一生成分布式计划。 B：客户端不需要承担 Doris 的分布式计划生成。 C：Compaction 是后台存储整理，不是每条查询执行前的固定关卡。 D：正确。FE 负责规划与协调，BE 执行计划中的扫描和计算。
- id: q2
  objective: 解释 Table、Partition、Tablet、Rowset 和 Segment 的层次。
  prompt: 本课表仅有基础索引，有两个分区、每个分区四个桶。不计副本，怎样理解其存储层次？
  options:
  - id: a
    text: A. 共四个 Tablet，由两个分区共享；Tablet 内包含 Rowset
  - id: b
    text: B. 共八个 Tablet；Tablet 内有 Rowset，Rowset 内有 Segment
  - id: c
    text: C. 共两个 Tablet；每个 Tablet 的四个桶表示四份副本
  - id: d
    text: D. 共八个 Tablet；每个 Tablet 固定有一个 Rowset 和一个 Segment
  answer: b
  explanation: A：每个分区有各自的分桶，不能把不同分区的桶合并计数。 B：正确。本题限定基础索引并排除副本，Tablet 数为 2×4。 C：桶描述分片，副本描述同一分片的数据副本，两者不是一回事。 D：Rowset 和 Segment 数量会随写入和合并变化，不是固定的一对一关系。
- id: q3
  objective: 说明写入批次、数据可见性与后台 Compaction 的关系。
  prompt: 写入后 Compaction 尚未完成，是否一定不能查询到新数据？
  options:
  - id: a
    text: A. 一定不能，新数据必须合并到旧文件后才可查询
  - id: b
    text: B. 可以，只要导入请求返回 HTTP 200 就表明已对查询可见
  - id: c
    text: C. 可以，可见性取决于事务发布和接口语义，不要求等 Compaction
  - id: d
    text: D. 可以，只要 BE 已生成 Segment 文件就表明事务已经可见
  answer: c
  explanation: A：查询可以读取已发布的多个 Rowset，不必先等待后台合并。 B：HTTP 成功只说明请求层面的情况，还需检查导入状态与发布结果。 C：正确。数据可见和物理合并是不同过程。 D：文件生成不等于事务发布完成，不能只凭文件存在判断可见性。
- id: q4
  objective: 控制表结构和数据，比较批量与逐行写入的结果。
  prompt: 团队比较每批 100 行与每批 10000 行的写入效果，两次运行结果一致，但第二次同时增加了桶数。应怎样解释结果？
  options:
  - id: a
    text: A. 先固定桶数、数据和写入模式，再重复比较两种批次
  - id: b
    text: B. 结果一致，说明观测到的耗时差异都来自批次大小
  - id: c
    text: C. 使用各自最短耗时，即可消除桶数变化的影响
  - id: d
    text: D. 保留不同桶数，只比较最终 Rowset 数量即可
  answer: a
  explanation: A：正确。多个变量同时变化无法归因，先控制条件再对比。 B：数据正确是前提，但不能排除桶数的影响。 C：挑最短耗时不能修复实验设计。 D：桶数会改变数据分布，Rowset 数量也不能单独说明批次效果。
- id: q5
  objective: 区分查询计划、存储元数据和运行时证据各能说明什么。
  prompt: 怎样组合 EXPLAIN、Tablet 元数据和 Query Profile？
  options:
  - id: a
    text: A. 用 EXPLAIN 中的预计扫描范围，直接计算实际磁盘读取量
  - id: b
    text: B. 用一次 VersionCount 采样，代替 Rowset 和 Segment 明细及运行指标
  - id: c
    text: C. 用十行样本的一次 Profile 耗时，预测生产环境的峰值吞吐量
  - id: d
    text: D. 用 EXPLAIN 看计划、元数据看采样状态、Profile 看实际执行工作量
  answer: d
  explanation: A：计划不等于运行结果，缓存和执行过程都会影响实际读取。 B：版本数量只是一个观测项，不能代替全部物理文件与执行证据。 C：十行、单次查询不具备生产负载的数据规模与并发条件。 D：正确。三类证据互补；采样时还需考虑后台合并、缓存和运行环境。
