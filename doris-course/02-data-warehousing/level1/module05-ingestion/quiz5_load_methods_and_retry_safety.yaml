title: D05：批量导入、失败与重试
description: 五道单选题；不需要数据库连接，提交后查看解释。
questions:
- id: q1
  objective: 按本地文件、对象存储、消息流和数据库变更选择接入路径。
  prompt: 一个本地有限 CSV 批次与一个持续产生消息的 Kafka Topic，应分别从哪条路径考虑？
  options:
  - id: a
    text: A. CSV 用 Routine Load，Kafka 先导出文件再视为已完成持续接入
  - id: b
    text: B. CSV 用 Stream Load，Kafka 用一次 Stream Load 后等待自动消费
  - id: c
    text: C. CSV 与 Kafka 都先创建 External Catalog，通过 Catalog 持续导入
  - id: d
    text: D. CSV 用 Stream Load，Kafka 用 Routine Load 持续消费
  answer: d
  explanation: A：本课的 Routine Load 面向 Kafka；将消息导出成一次文件不等于建立持续消费。 B：一次 Stream Load 是一次推送批次，不会自动创建 Kafka 消费任务。 C：Catalog 是外部访问入口，不是所有来源通用的持续导入任务。 D：正确。本地批次由客户端推送，Kafka 由持续任务维护消费进度。
- id: q2
  objective: 说明 CSV 列映射、Parquet 字段和默认值各自的作用。
  prompt: 本课无表头 CSV 与 WWI Parquet 的字段解释方式，哪项正确？
  options:
  - id: a
    text: A. CSV 指定分隔符与 columns 映射，Parquet 按文件字段对齐课程 DDL
  - id: b
    text: B. 无表头 CSV 可以按值猜出字段含义，不需要确认列顺序
  - id: c
    text: C. Parquet 与 CSV 一样，需要用逗号拆分每行来解释字段
  - id: d
    text: D. 缺少支付状态时默认写为 PAID，以保证字段完整
  answer: a
  explanation: A：正确。课程 CSV 用位置映射，Parquet 携带结构信息，但字段与目标 Schema 仍需匹配。 B：无表头文件的位置不能自动代表业务含义；列顺序错误还可能产生类型合法但语义错误的数据。 C：Parquet 是带 Schema 的列式格式，不按文本分隔符拆行。 D：默认值必须有业务依据，不能凭缺失字段捏造支付事实。
- id: q3
  objective: 结合导入响应、加载行数、关联和金额判断结果是否正确。
  prompt: 导入 100 行收到 HTTP 200，JSON 的 Status 为 Success、NumberLoadedRows 为 98、NumberFilteredRows 为 2。任务要求全部订单保留，应该怎样处理？
  options:
  - id: a
    text: A. 按 Success 交付报表，两行过滤已由数据库处理
  - id: b
    text: B. 检查过滤原因并核对缺失订单，按重试策略修复后验收
  - id: c
    text: C. 立即换新 label 重发全文件，忽略已经写入的 98 行
  - id: d
    text: D. 只要现有 98 行的金额能汇总，就完成业务验收
  answer: b
  explanation: A：导入任务成功不代表达到业务完整性要求。 B：正确。定位过滤行并核对目标结果，再选择补写或重建等恢复方式。 C：新 label 会形成新批次，在明细表中可能重复追加已写入数据。 D：可聚合不证明订单完整或客户引用正确。
- id: q4
  objective: 区分导入批次重试、业务事件去重与持续任务恢复。
  prompt: 本课 off_mode 导入中，同一文件的请求结果不确定。批次重试与业务去重应怎样区分？
  options:
  - id: a
    text: A. 生成新 label 重发相同文件，避免与原请求冲突就能保证不重复
  - id: b
    text: B. 使用同一 label 永久提交不同文件，让它自动去重所有业务事件
  - id: c
    text: C. 在 label 有效期内保留批次身份并查询原结果；业务事件另用稳定键与版本
  - id: d
    text: D. 看到 Kafka offset 前进，就认为订单当前状态和其他表都已正确更新
  answer: c
  explanation: A：新 label 可能让同一批数据再次追加，应先确认原事务状态。 B：label 有保留期限，且标识导入批次，不是不同文件的通用业务去重键。 C：正确。批次身份、业务事件身份与恢复位置各有职责；Publish Timeout 等情况需先确认原结果。 D：消费进度不能代替乱序版本裁决、业务核对或跨表恢复检查。
- id: q5
  objective: 区分 WWI 历史订单、账户收款与课程模拟新订单的粒度和口径。
  prompt: WWI 订单明细、客户账户收款和本课模拟订单，哪项理解正确？
  options:
  - id: a
    text: A. 订单明细每行有订单号，因此明细行数可以直接当订单数
  - id: b
    text: B. 客户账户收款为负数，因此可以直接按订单退款统计
  - id: c
    text: C. 模拟订单使用了 WWI 客户和商品，因此支付也属于真实历史
  - id: d
    text: D. 明细按订单汇总，账户收款不能强行逐单分摊，模拟来源单独标记
  answer: d
  explanation: A：一单可能有多条商品明细，行数需要按实际粒度解释。 B：在这份数据里，负数收款代表账户收款，不是逐订单退款证据。 C：引用真实样例维度不会使生成的支付、退款和地区变成原始历史事实。 D：正确。分别识别订单、账户账款与 COURSE_SIMULATION 的粒度和来源，才能避免口径混用。
