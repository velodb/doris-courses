title: Module 7：乱序裁决、历史保留和可恢复重放
description: 五道单选题；不需要数据库连接，提交后查看解释。
questions:
- id: q1
  objective: 区分订单当前状态、事件历史和原始投递的键与用途。
  prompt: 为什么需要当前表、事件历史和投递记录三种粒度？
  options:
  - id: a
    text: A. 当前表已记录最新状态，因此可以代替全部事件历史和重投记录
  - id: b
    text: B. 当前表、历史和投递都按 order_id 覆盖，减少重复即可
  - id: c
    text: C. 每次重投都生成新 event_id，让历史完整计数每一次投递
  - id: d
    text: D. 当前表回答现在怎样，事件历史回答发生过什么，投递记录回答尝试了几次
  answer: d
  explanation: A：最新状态会覆盖旧值，无法反推出所有事件与尝试次数。 B：同一订单有多个事件和投递，统一覆盖会丢失各层事实。 C：重复投递不是新业务事件，新 event_id 会破坏事件去重；投递次数应由投递层记录。 D：正确。本课分别使用 order_id、event_id 以及 attempt_id 与 delivery_id 表达这些粒度。
- id: q2
  objective: 使用业务版本解释重复与乱序事件的处理结果。
  prompt: 订单 701 的完整状态事件依次到达：版本 8 已签收、版本 6 已支付、版本 7 已发货，再重投同一个版本 7 事件。当前表和事件历史应该怎样变化？
  options:
  - id: a
    text: A. 当前状态最后变为已发货，历史按每次投递追加
  - id: b
    text: B. 当前状态保持已签收，历史只保存版本 8 的事件
  - id: c
    text: C. 当前状态保持已签收，历史按稳定事件 ID 保留三个事件
  - id: d
    text: D. 把四次接收顺序用作版本号，当前状态取接收序号最大者
  answer: c
  explanation: A：接收顺序不能替代业务版本，重投也不代表新业务事件。 B：迟到事件仍有历史价值。 C：正确。完整状态按业务版本裁决，历史按稳定事件 ID 去重，投递次数可另外记录。 D：本地接收序号仍会让迟到旧状态覆盖新状态。
- id: q3
  objective: 区分部分列更新与省略字段的整行写入。
  prompt: 仅更新 orders_partial_update 的状态和版本，正确检查是什么？
  options:
  - id: a
    text: A. 启用部分更新，使用递增版本，核对未提供的金额和地区保持不变，结束后恢复开关
  - id: b
    text: B. 使用普通整行写入但省略其他字段，认为省略就会自动保留旧值
  - id: c
    text: C. 启用部分更新，只核对状态；未提供字段即使变为默认值也视为成功
  - id: d
    text: D. 启用部分更新，使用较低版本；认为该开关会绕过 Sequence 裁决
  answer: a
  explanation: A：正确。在独立实验表中核对状态及保留字段，金额应为 100.00、地区应为 EAST，并恢复会话设置。 B：省略字段的整行写入不等于部分更新，可能触发默认值或其他整行写入行为。 C：部分更新的目的之一就是保留未提供字段，不能只检查被修改列。 D：部分更新并不取消版本裁决，较低业务版本不应覆盖更高版本。
- id: q4
  objective: 区分软删除、SQL 删除与物理文件回收。
  prompt: 软删除、SQL DELETE 和退款应如何理解？
  options:
  - id: a
    text: A. 设置 is_deleted 后，普通 SELECT 会自动隐藏这笔订单
  - id: b
    text: B. 软删除需要查询过滤，SQL DELETE 改变行可见性，退款事实仍应保留
  - id: c
    text: C. SQL DELETE 后查不到行，说明对应物理文件已立即回收
  - id: d
    text: D. 退款成功后删除订单与支付记录，只保留净额就足以对账
  answer: b
  explanation: A：is_deleted 是本课业务字段，查询需要显式过滤或通过封装视图过滤。 B：正确。三者分别涉及业务标记、逻辑可见性和业务资金事实。 C：查询不可见不代表磁盘空间立刻释放，物理回收是另一个过程。 D：删除事实会丢失订单、支付和退款的关联，净额不能替代可追踪的对账记录。
- id: q5
  objective: 通过重复重放、逐行比较和独立业务流水核对恢复结果。
  prompt: 历史写入后、当前状态写入前中断，恢复后应检查什么？
  options:
  - id: a
    text: A. 重复执行未完成流程，逐字段核对当前与历史，并用独立流水对账；本 Lab 预期为 11 当前、18 历史、19 投递
  - id: b
    text: B. 历史表已有 event_id，就跳过当前状态及业务流水的后续步骤
  - id: c
    text: C. 恢复后投递次数没有增加，就认定所有业务数据已正确恢复
  - id: d
    text: D. 事件历史写入成功，就认定当前表和独立业务流水也已原子提交
  answer: a
  explanation: A：正确。重复重放应保持业务结果幂等，并通过独立商品、支付、退款和配送记录核对；这些计数只针对本 Lab 的固定重放流程。 B：中断可能发生在历史写入之后，跳过会遗留未完成的当前状态或流水处理。 C：投递计数属于尝试层，不能证明业务表正确；本课重试还会保留新增尝试记录。 D：三张表按步骤分别写入，单表成功后仍需核对其他表，确保整条处理流程已经完成。
