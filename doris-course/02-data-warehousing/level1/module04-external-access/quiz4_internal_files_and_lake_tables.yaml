title: D04：湖表与内部表关联
description: 五道单选题；不需要数据库连接，提交后查看解释。
questions:
- id: q1
  objective: 区分 Doris 内部表、Parquet 文件、Iceberg 表与 External Catalog。
  prompt: Parquet、Iceberg 与 External Catalog 的关系是什么？
  options:
  - id: a
    text: Parquet 是文件格式，Iceberg 管表元数据和文件，Catalog 是外部访问入口
  - id: b
    text: 任意 Parquet 目录自动成为 Iceberg 表
  - id: c
    text: 创建 Catalog 会自动复制所有外部文件到内部表
  answer: a
  explanation: 文件、表格式和访问入口处于不同层次。Iceberg 需要表元数据，Catalog 访问成功不代表已经导入内部表。
- id: q2
  objective: 根据探索和重复分析的需求选择外部直查或导入内部表。
  prompt: 已有湖上历史订单，第一次探索某个问题，合理的起点是什么？
  options:
  - id: a
    text: 无论场景都先完整迁移数据湖
  - id: b
    text: 先评估直查，若需要反复分析再评估导入和刷新成本
  - id: c
    text: 先把所有订单与客户拼成不可更新的宽表
  answer: b
  explanation: 直查可以降低探索前的搬运工作，但性能仍需实际评估。导入保留本次结果，不会自动变成长期同步。
- id: q3
  objective: 解释 Catalog、Database、Table 如何定位一张外部表。
  prompt: wwi_lake.sales.orders 中三部分分别表示什么？
  options:
  - id: a
    text: 对象存储桶、文件目录、Parquet 文件
  - id: b
    text: Doris 节点、Tablet、Segment
  - id: c
    text: Catalog、Database、Table
  answer: c
  explanation: 这是 SQL 的完整表名，不是文件路径。Lab 使用 DW_ICEBERG_ORDERS 配置实际表名，不假定示例 Catalog 已存在。
- id: q4
  objective: 通过关联前后对照发现维表重复或关联缺失。
  prompt: 订单与客户做 JOIN 后行数变多，优先检查什么？
  options:
  - id: a
    text: 关联键在客户侧是否有多行匹配
  - id: b
    text: 是否需要把结果再乘以副本数
  - id: c
    text: 是否把 SUM 改成 MAX 就能自动修复
  answer: a
  explanation: 重复维表键会复制匹配的订单行。反过来，内连接缺失客户也可能丢行，所以要检查键、行数和金额，而非用聚合掩盖问题。
- id: q5
  objective: 在具备 Iceberg 环境时核对直查、关联和导入后的同一批订单。
  prompt: 怎样证明本 Lab 的直查与导入结果一致？
  options:
  - id: a
    text: 外部查询无报错即可
  - id: b
    text: 对同一十单样本检查关联前后数量和金额，并逐字段比较内部结果
  - id: c
    text: 只确认内部表存在
  answer: b
  explanation: 预期十单、12220.60，还需核对完整字段，避免错误抵消。必须使用真实预置湖表；没有外部环境时应记录未执行。
