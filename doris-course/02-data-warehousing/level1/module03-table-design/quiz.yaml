title: "D03：模型语义与分区分桶"
description: "五道单选题；不需要数据库连接，提交后查看解释。"
questions:
  - id: q1
    objective: "哪种模型适合保留所有重复明细？"
    prompt: "哪种模型适合保留所有重复明细？"
    options:
      - id: a
        text: "Duplicate Key"
      - id: b
        text: "Unique Key"
      - id: c
        text: "只保留 SUM 的 Aggregate Key"
    answer: a
    explanation: "Duplicate Key 不以键去掉重复行。"
  - id: q2
    objective: "同一订单的当前状态与业务历史应该怎样识别？"
    prompt: "同一订单的当前状态与业务历史应该怎样识别？"
    options:
      - id: a
        text: "两者都只留订单号最后一行"
      - id: b
        text: "两者都用到达时间作为唯一标识"
      - id: c
        text: "当前按订单号，历史按稳定事件 ID"
    answer: c
    explanation: "两个对象粒度不同，按订单号覆盖历史会丢失事件。"
  - id: q3
    objective: "Aggregate Key 对 (1,100)、(1,50) 使用 SUM 后是什么？"
    prompt: "Aggregate Key 对 (1,100)、(1,50) 使用 SUM 后是什么？"
    options:
      - id: a
        text: "一行 50"
      - id: b
        text: "一行 150"
      - id: c
        text: "两行 100 和 50"
    answer: b
    explanation: "预定义聚合规则改变同 Key 记录的结果语义。"
  - id: q4
    objective: "日期分区和 Hash 分桶职责是否相同？"
    prompt: "日期分区和 Hash 分桶职责是否相同？"
    options:
      - id: a
        text: "不同，分别组织分区和数据分布"
      - id: b
        text: "完全相同，只是叫法不同"
      - id: c
        text: "两者都保证订单号全局唯一"
    answer: a
    explanation: "分布规则不能代替业务唯一性设计。"
  - id: q5
    objective: "EXPLAIN 中选中更少 Tablet，就证明整个查询更快吗？"
    prompt: "EXPLAIN 中选中更少 Tablet，就证明整个查询更快吗？"
    options:
      - id: a
        text: "一定快一百倍"
      - id: b
        text: "说明数据已丢失"
      - id: c
        text: "不能，还需实际执行与等价结果验证"
    answer: c
    explanation: "计划是扫描范围证据，实际耗时还有其他因素。"
