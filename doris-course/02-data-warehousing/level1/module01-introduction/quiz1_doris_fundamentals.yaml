title: D01：连接 Doris，查询第一批订单
description: 五道单选题；不需要数据库连接，提交后查看解释。
questions:
- id: q1
  objective: 区分“完成一笔交易”和“分析一批订单”这两类工作。
  prompt: 以下哪项主要属于分析工作？
  options:
  - id: a
    text: 提交一笔订单并扣减对应库存
  - id: b
    text: 按日期汇总大量订单的数量和金额
  - id: c
    text: 按订单号修改一笔订单的地址
  answer: b
  explanation: 分析关注跨记录的扫描和汇总，交易关注一次业务操作。返回的结果只有几行，也可能需要分析很多订单。
- id: q2
  objective: 说明 Doris 在业务数据库与分析用户之间承担什么职责。
  prompt: 本课程中 Doris 与源业务系统如何配合？
  options:
  - id: a
    text: 源系统提交交易，Doris 接收数据供分析
  - id: b
    text: 使用 MySQL 协议后，Doris 自动承担所有原业务事务
  - id: c
    text: 报表数据必须先写回源业务库才能被查询
  answer: a
  explanation: 源交易系统继续记录下单、支付等操作，Doris 提供分析层。协议接口相似不代表事务语义和适用工作负载相同。
- id: q3
  objective: 说明存算一体环境中 Frontend（FE）和 Backend（BE）的分工。
  prompt: 在本课存算一体环境中，哪项分工正确？
  options:
  - id: a
    text: FE 执行列扫描，BE 只存查询计划
  - id: b
    text: 客户端拆分分布式计划，FE 只保存连接
  - id: c
    text: FE 接收并规划查询，BE 保存内部表数据并执行计划
  answer: c
  explanation: 客户端把 SQL 发给 FE，FE 规划和协调执行，BE 执行计划。本节的存储职责以存算一体架构为前提。
- id: q4
  objective: 连接 Doris，执行建表、写入和分组聚合 SQL。
  prompt: d01_orders 一行是一笔订单，要按日期输出订单数和金额并稳定排序，应怎样查询？
  options:
  - id: a
    text: 按 order_id 分组，再按金额排序
  - id: b
    text: 按 order_date 分组，计算 COUNT(*) 和 SUM(order_amount)，按日期排序
  - id: c
    text: 只按日期排序，不需要 GROUP BY
  answer: b
  explanation: GROUP BY 决定汇总粒度，COUNT 和 SUM 计算组内指标，ORDER BY 决定展示顺序。这一计数方法依赖一行一单；订单明细表不能直接照搬。
- id: q5
  objective: 用明细、行数和金额核对数据，区分税前订单金额与收款。
  prompt: WWI 十单投影税前金额合计 12220.60，且没有逐订单支付字段。能得出什么结论？
  options:
  - id: a
    text: 两天全量销售额和收款均为 12220.60
  - id: b
    text: 十笔订单都尚未支付
  - id: c
    text: 十笔样本税前金额为 12220.60，不能据此推断收款
  answer: c
  explanation: 这是子集，不是两天全部订单；缺少支付字段也不等于未支付。还需比对十行明细与字段，不能仅凭金额总数证明数据正确。
