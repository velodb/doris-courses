[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doris-labkit"
version = "0.1.0"
description = "Notebook runtime shared by the Apache Doris courses"
requires-python = ">=3.9,<3.14"
dependencies = [
  "ipython>=8",
  "ipywidgets>=8.1,<9",
  "pandas>=2.2,<3",
  "PyMySQL>=1.1,<2",
  "PyYAML>=6.0,<7",
]

[tool.setuptools]
packages = ["doris_labkit", "doris_workshop_locales"]

[tool.setuptools.package-dir]
doris_workshop_locales = "../../locales"

[tool.setuptools.package-data]
doris_workshop_locales = ["ui.en.json", "ui.contract.json"]
