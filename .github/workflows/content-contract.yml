name: Content contract

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  contract:
    name: Content contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements.txt
      - name: Validate the package and stable identities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            python tools/check_content_contract.py --base-ref "$BASE_SHA"
          else
            python tools/check_content_contract.py
          fi
      - name: Verify the admission checks
        run: python -m unittest discover -s tools/tests -p 'test_content_contract.py' -v
