# Repository checks and the offline tests of every course. Nothing here needs
# Docker or a running Doris; the labs themselves are verified by running them.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the check dependencies
        run: python -m pip install -r workshop/aws/preflight-requirements.txt -r workshop/aws/runtime/test-requirements.txt
      - name: Links
        run: python tools/check_links.py doris-course maintenance workshop README.md CONTRIBUTING.md
      - name: Notebook outputs
        run: python tools/check_notebook_outputs.py --strict
      - name: Quiz structure
        # Every quiz must have a valid structure. A course whose quizzes have
        # been revised must also meet the answer-balance thresholds.
        run: |
          python tools/check_quiz_balance.py
          python tools/check_quiz_balance.py --strict doris-course/04-ai-integrations
          python tools/check_quiz_balance.py --strict doris-course/03-observability
          python tools/check_quiz_balance.py --strict doris-course/02-data-warehousing
          python tools/check_quiz_balance.py --strict doris-course/01-real-time-analytics
      - name: Course manifests
        run: python tools/check_course_manifests.py
      - name: Content contract
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
        run: |
          if [ -n "$CONTRACT_BASE_SHA" ] && [ "$CONTRACT_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python tools/check_content_contract.py --base-ref "$CONTRACT_BASE_SHA"
          else
            python tools/check_content_contract.py
          fi
      - name: Workshop release boundaries
        run: python tools/check_workshop_release.py
      - name: Image list
        # Only whether maintenance/images.md lists the images that the courses
        # name; comparing their digests with the registries needs the network.
        run: python tools/check_image_digests.py --offline
      - name: Secrets, local paths and email addresses
        run: python tools/check_sensitive_info.py
      - name: Tests of the checks
        run: python -m unittest discover -s tools/tests -v

  workshop-runtime:
    name: Workshop runtime isolation (offline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime test dependencies
        run: python -m pip install -r workshop/aws/runtime/test-requirements.txt
      - name: Bundle, kernel restart and local Jupyter authentication
        run: python -m unittest discover -s tools/tests -p 'test_workshop*runtime.py' -v

  workshop-preflight:
    name: Workshop preflight and saved-plan gate (offline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install preflight dependencies
        run: python -m pip install -r workshop/aws/preflight-requirements.txt
      - name: Failure cases, saved-plan binding and stubbed SDK contracts
        run: python -m unittest discover -s tools/tests -p test_workshop_preflight.py -v
      - name: Lifecycle orchestration, failure recovery and SSM contracts
        run: python -m unittest discover -s tools/tests -p test_workshop.py -v

  workshop-terraform:
    name: Workshop Terraform (${{ matrix.module }}, mocked AWS)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        module: [bootstrap, pilot, image-build, image-validation, shared-access, access-bindings, ttl-control]
    defaults:
      run:
        working-directory: workshop/aws/terraform/${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Format, schema and provider-mock tests
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test

  tests:
    name: Offline tests (${{ matrix.package }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [common, 01-real-time-analytics, 02-data-warehousing, 03-observability, 04-ai-integrations]
    defaults:
      run:
        working-directory: doris-course/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            doris-course/*/requirements.txt
            doris-course/*/pyproject.toml
      - name: Install
        # Courses install the shared runtime through `-e ../common` in their
        # requirements, so pip runs in the course directory.
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install -e .
          fi
      - name: Test
        run: python -m unittest discover -s tests -v
